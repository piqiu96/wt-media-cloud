name = 'wt-media-cloud'

[initial_admin]
password = 'admin123'
username = 'admin'

[server]
http_addr = '127.0.0.1:8188'
session_cookie_secure = true

[bitbrowser]
observation_fresh_for = '2m'

[publication_generation]
model = 'deepseek-flash'
base_url = 'https://api.deepseek.com'
timeout = '170s'

# Keep production closed until this deployment combination has passed real Bilibili acceptance.
[publication_platforms]
bilibili_enabled = false

# New-content defaults only; no implicit statement or authorship assertion.
[publication_platforms.bilibili]
partition_id = 0
partition_name = ''
tags = []
visibility = 'public'
