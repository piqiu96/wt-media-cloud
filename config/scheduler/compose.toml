# Compose worker operational settings (M4-C5, CHG-20261013-083). The workspace
# root anchors to the Cloud home when relative; node_id names this worker in
# compose_tasks.claimed_node_id and must be unique per running worker.

workspace_root = '.compose'
node_id = 1
concurrency = 2
global_concurrency = 2
lease = '5m'
heartbeat_interval = '30s'
task_timeout = '30m'
poll_interval = '2s'
recovery_interval = '30s'
