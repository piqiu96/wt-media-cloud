schema_version: 1
revision: "2026.10.29.1"
schemas:
  PublicUser:
    type: object
    required: [id, username, role, status, team_id, team_name, category_ids]
    properties:
      id: {type: integer, format: int64}
      username: {type: string}
      role: {type: string, enum: [admin, senior_operator, operator]}
      status: {type: string, enum: [enabled, disabled]}
      team_id: {type: integer, format: int64, nullable: true}
      team_name: {type: string}
      category_ids:
        type: array
        items: {type: integer, format: int64, minimum: 1}
    forbidden_properties: [password, password_hash, session_token, token_hash]
  Category:
    type: object
    required: [id, type, name, enabled, remark, created_at, updated_at]
    properties:
      id: {type: integer, format: int64, minimum: 1}
      type: {type: string, enum: [game, ai, anime]}
      name: {type: string, minLength: 1, maxLength: 128}
      enabled: {type: boolean}
      remark: {type: string, maxLength: 255}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
  UserSession:
    type: object
    description: >
      The sole authentication fact. `users` holds no login state; a credential is valid
      exactly while its row is unexpired and un-invalidated. A user may hold several web
      rows and at most one valid desktop row.
    required: [id, user_id, client_type, created_at, expires_at]
    properties:
      id: {type: string}
      user_id: {type: integer, format: int64}
      client_type: {type: string, enum: [web, desktop]}
      created_at: {type: string, format: date-time}
      expires_at: {type: string, format: date-time}
      invalidated_at: {type: string, format: date-time, nullable: true}
      invalidated_reason:
        type: string
        nullable: true
        enum: [logout, password_changed, admin_reset, user_disabled, force_logout, desktop_replaced, superseded]
    forbidden_properties: [token, token_hash]
  OperationTeam:
    type: object
    required: [id, name, user_count, created_at, updated_at]
    properties:
      id: {type: integer, format: int64}
      name: {type: string, maxLength: 64}
      user_count:
        type: integer
        format: int64
        description: >
          Users currently belonging to this team. Read from the users table on every
          list, so it cannot drift from the membership it describes.
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
  OneTimePasswordResult:
    type: object
    required: [one_time_password]
    properties:
      one_time_password: {type: string}
