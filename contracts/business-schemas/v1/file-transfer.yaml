schema_version: 1
revision: "2026.10.23.1"

schemas:
  FileTransferTask:
    type: object
    required: [id, asset_type, asset_id, asset_title, purpose, execution_scope, status, total_bytes, completed_bytes, attempt_count, created_at, updated_at]
    properties:
      id: {type: string}
      # 2026.10.13（CHG-20261013-085）：`const material` 放宽为枚举——成片与原素材共用
      # 同一张传输表（DB CHECK 自迁移 039 已允许 composite_output），同一次加宽覆盖
      # LocalLease（cloud-agent 契约）与两侧消费方（Agent 租约门、web 下载中心）。
      asset_type: {type: string, enum: [composite_output, material]}
      asset_id: {type: integer, format: int64}
      asset_title:
        type: string
        description: >-
          The title of the asset at the moment the task was created. Required rather than optional because a
          task row is otherwise unnameable: the id alone tells the download centre nothing about what it is
          downloading, and `file_name` only arrives once an executor has finished. Held on the row rather than
          looked up on read, because a task outlives the rename of what it points at.
      attempt_id:
        type: string
        description: >-
          The current claim of this task. A lease generates a new one, and every continuation report must
          carry it: it binds the report to the executor that took the lease. Empty until the task is first
          claimed, and cleared when a failed task is retried. It is a run identifier, not an execution
          credential.
      claimed_by:
        type: string
        nullable: true
        description: >-
          Audit label of the process holding the lease; never an authentication subject. A claim is scoped
          to the requesting user, so any of that user's machines may pick up a pending task.
      purpose: {type: string, enum: [compose_input_prepare, user_download]}
      execution_scope: {type: string, enum: [cloud, local_agent]}
      status: {type: string, enum: [pending, running, success, failed, cancelled]}
      total_bytes: {type: integer, format: int64, minimum: 0}
      completed_bytes: {type: integer, format: int64, minimum: 0}
      bytes_per_second: {type: integer, format: int64, minimum: 0}
      estimated_remaining_seconds: {type: integer, format: int64, minimum: 0, nullable: true}
      attempt_count: {type: integer, minimum: 0}
      max_attempts: {type: integer, minimum: 1}
      checksum_sha256: {type: string, nullable: true}
      file_name:
        type: string
        nullable: true
        description: >-
          The final file name the executor reported, with no directory component. It is the name the
          executor actually wrote, reported rather than derived a second time by the UI.
      error_code: {type: string, nullable: true}
      error_message: {type: string, nullable: true}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      finished_at:
        type: string
        format: date-time
        nullable: true
        description: >-
          When the task became terminal (success, failed or cancelled), null while the transfer is pending
          or running. Added for the download centre's terminal tabs, which order their rows and apply their
          retention windows against it.
    forbidden_properties: [local_path, download_url, storage_credential, node_credential]
