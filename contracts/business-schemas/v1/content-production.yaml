schema_version: 1
revision: "2026.10.29.1"

# 描述 Cloud 当前返回的 body；未知的可选属性省略，内部对象存储引用不返回。

schemas:
  ComposeTemplate:
    type: object
    required: [id, code, name, version, schema, status]
    properties:
      id: {type: integer, format: int64}
      code: {type: string}
      name: {type: string}
      version: {type: integer, minimum: 1}
      schema: {type: object}
      status: {type: string, enum: [active, inactive]}
  BasicCutV1Config:
    type: object
    required: [start_seconds, end_seconds]
    additionalProperties: false
    properties:
      start_seconds: {type: integer, minimum: 0}
      end_seconds: {type: integer, minimum: 1, description: Must exceed start_seconds.}
  GuideV1Config:
    type: object
    required: [guide_video_url, insert_seconds, guide_duration_seconds, max_duration_seconds]
    additionalProperties: false
    properties:
      guide_video_url: {type: string, format: uri, description: Public downloadable HTTPS URL, frozen in the task snapshot.}
      insert_seconds: {type: integer, minimum: 0}
      guide_duration_seconds: {type: integer, minimum: 0, description: Zero uses the whole guide video.}
      max_duration_seconds: {type: integer, minimum: 0, description: Zero has no output duration limit.}
  ComposeStrategy:
    type: object
    required: [id, team_id, category_id, name, compose_template_id, compose_template_version, config, schedule, next_run_at, status, created_at, updated_at]
    properties:
      id: {type: integer, format: int64}
      team_id: {type: integer, format: int64}
      category_id: {type: integer, format: int64, minimum: 1}
      name: {type: string}
      compose_template_id: {type: integer, format: int64}
      compose_template_version: {type: integer, minimum: 1}
      config:
        oneOf: [{ref: BasicCutV1Config}, {ref: GuideV1Config}]
      schedule: {ref: ComposeSchedule, nullable: true}
      next_run_at: {type: string, format: date-time, nullable: true}
      status: {type: string, enum: [active, inactive]}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
  ComposeSchedule:
    type: object
    required: [enabled, mode, timezone, per_run_limit, daily_limit, material_scope]
    properties:
      enabled: {type: boolean}
      mode: {type: string, enum: [manual, interval, daily]}
      interval_minutes: {type: integer, minimum: 1, maximum: 1440}
      daily_time: {type: string}
      timezone: {type: string}
      per_run_limit: {type: integer, minimum: 1, maximum: 100}
      daily_limit: {type: integer, minimum: 1, maximum: 1000}
      material_scope: {type: string, enum: [team_materials, creator_usages], description: "team_materials is the current execution semantics: scheduled production reads the strategy team's material pool. creator_usages is the historical persisted value and remains accepted; existing schedule_json is not rewritten."}
  ComposeScheduleRun:
    type: object
    required: [run_key, compose_strategy_id, trigger_type, schedule_slot, candidate_count, created_count, skipped, created_at]
    properties:
      run_key: {type: string}
      compose_strategy_id: {type: integer, format: int64}
      trigger_type: {type: string, enum: [manual, scheduled]}
      schedule_slot: {type: string, format: date-time}
      candidate_count: {type: integer, minimum: 0}
      created_count: {type: integer, minimum: 0}
      skipped: {type: array}
      created_at: {type: string, format: date-time}
  Material:
    type: object
    description: 一条素材及其源视频准备投影；键集与 `model.Material` 的 json tag 一一对应。
    required: [id, team_id, source_content_id, title, source_url, platform, status, video_status, view_count, like_count, favorite_count, comment_count, share_count, created_at, updated_at, created_by]
    properties:
      id: {type: integer, format: int64}
      team_id: {type: integer, format: int64}
      source_content_id: {type: integer, format: int64}
      title: {type: string}
      source_url: {type: string, format: uri}
      platform: {type: string}
      video_status: {type: string, enum: [not_downloaded, downloading, ready, failed]}
      # 素材库自己的生命周期，与 video_status 是两个维度（规范 §7.2）：文件状态回答「源视频
      # 准备好了没有」，这一档回答「这条素材还提供给运营选用吗」，可以同时是「已暂停 + 可下载」。
      # 库列 NOT NULL DEFAULT 'available'，键恒在。写路径尚未存在，所以值恒为 available ——
      # 那是这批素材的真实状态，不是兜底默认值。
      status: {type: string, enum: [available, paused, delisted]}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      # 素材操作人（= 创建人）：人工转换时是执行转换的人，自动转素材时是任务创建人。
      # 库列 NOT NULL，键恒在；权限与「谁用过这条素材」的 usage 投影无关，三种角色都读。
      created_by: {type: integer, format: int64}
      # 创建人昵称（无昵称回退用户名）；目录里已没有此人时不出现，页面显示「未记录」。
      created_by_name: {type: string}
      # 以下四个键只出现在素材库列表与详情读取里，是「当前查看者」的投影，不是素材自己的
      # 事实：两个人读同一行可能看到不同的值。没有关系时 usage_status 与 added_at 都不出现；
      # removed 表示关系还在、用户已移出，在素材库口径里等同于未加入。
      usage_status: {type: string, enum: [active, removed], description: 当前查看者自己的素材关系状态；没有关系时该键不出现。}
      added_at: {type: string, format: date-time, description: 当前查看者这条关系建立的时间；没有关系时该键不出现。}
      my_usage:
        type: string
        enum: [used, unused]
        description: >-
          当前查看者是否是至少一条成功成片的负责人。只按成功成片计算：失败、取消、
          等待中的成片都不算；移出素材关系后，历史成功成片仍然算「已使用」。
      usage:
        type: object
        description: >-
          当前团队在这条素材上的成功成片事实，按 (素材, 团队) 聚合，跨团队不合并。
          output_count 统计所有成功成片；operator_count 只统计有负责人的成片 ——
          历史行没有负责人时仍计入前者的总数，但不计为「有人用过」，也不回填。
          operators 只返回给高级运营与管理员，普通运营只拿到两个计数。
        required: [output_count, operator_count]
        properties:
          output_count: {type: integer, format: int64, minimum: 0}
          operator_count: {type: integer, format: int64, minimum: 0}
          operators:
            type: array
            description: 有负责人的成功成片按操作人分组；普通运营看不到该键。
            items:
              type: object
              required: [id, output_count]
              properties:
                id: {type: integer, format: int64}
                name: {type: string, description: 姓名目录里查不到时该键不出现。}
                output_count: {type: integer, format: int64, minimum: 0}
      category_id: {type: integer, format: int64, minimum: 1, description: 素材未归类目时该键不出现。}
      author_name: {type: string, description: 为空时该键不出现。}
      # 封面与作者主页是来源行自己的两个链接（CHG-20260930-069）：投影在读取时 JOIN
      # source_contents 带出来，不是物化时抄进 materials 的副本 —— 来源是唯一事实，
      # 抄一份就是第二个会漂移的事实。两页列表的封面缩略图与详情抽屉里的作者主页
      # 链接读的都是这两个键。
      cover_url: {type: string, format: uri, description: 来源没有封面时该键不出现。}
      author_home_url: {type: string, format: uri, description: 来源没有作者主页时该键不出现。}
      # 来源行采集到时的内容池统计（CHG-20260930-069 走查反馈）：同样是读取时 JOIN
      # source_contents 带出的事实，键与库列同名。列 NOT NULL，所以键恒在，0 表示
      # 「采集时就是 0 / 采集器没有提供」，不是「未知」。
      view_count: {type: integer, format: int64}
      like_count: {type: integer, format: int64}
      favorite_count: {type: integer, format: int64}
      comment_count: {type: integer, format: int64}
      share_count: {type: integer, format: int64}
      published_at: {type: string, format: date-time, description: 来源没有发布时间时该键不出现。}
      video_size_bytes: {type: integer, format: int64, description: 准备通过校验前该键不出现。}
      video_sha256: {type: string, description: 准备通过校验前该键不出现。}
      media_summary: {type: object, description: 准备通过校验前该键不出现；形状由媒体探针决定，不是对外契约。}
      last_error: {type: string, description: 最近一次准备没有错误时该键不出现。}
      video_prepared_at: {type: string, format: date-time, description: 尚未有一次通过校验的准备时该键不出现。}
    forbidden_properties: [object_key, local_path, download_url, video_url, storage_credential]

  MaterialVideoLink:
    type: object
    description: >-
      详情链接接口（GET /api/v1/materials/{material_id}/video-url）的 body：云端视频的
      **签名**地址。它是这个地址的**唯一**出口 —— 列表与素材 body 都不携带（见
      Material 的 forbidden_properties），因为一个浏览器拿得到的地址应当只落在明确
      检查过登录与业务范围的读取上。地址是对该对象的一次性短时 GET grant：桶拒绝匿名
      读取（2026-10-01 实测 403 `Garage does not support anonymous access yet`），
      不签名的地址是服务端自己已经证明打不开的那一个。**它会过期**，所以调用方每次
      用之前重新要，不要持有 —— 详情抽屉因此在点击「打开云端视频」时才发这次请求，
      而不是在抽屉打开时。存活时长是配置项（`object_storage.presign_ttl`），不是本
      body 的一部分，故这里**不发布** `expires_at`。
    required: [url]
    properties:
      url: {type: string, format: uri}

  MaterialUsage:
    type: object
    description: 「我的素材」里的一条关系；移出保留同一行，只把状态改写，故历史可追溯、可恢复。
    required: [id, team_id, material_id, user_id, status, created_at, updated_at]
    properties:
      id: {type: integer, format: int64}
      team_id: {type: integer, format: int64}
      material_id: {type: integer, format: int64}
      user_id: {type: integer, format: int64}
      status: {type: string, enum: [active, removed]}
      download_status:
        type: string
        enum: [downloading, downloaded, failed]
        description: >-
          该用户在这条素材上的下载生命周期，按「最新一条 user_download 任务」派生
          （pending/running→downloading；success→downloaded；failed/cancelled→failed），
          与素材云侧 `video_status` 正交。从未下载过时该键不出现。
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      removed_at: {type: string, format: date-time, description: 关系仍是 active 时该键不出现。}
      material:
        type: object
        description: >-
          这条关系指向的素材，随列表一并返回，键集即上方 `Material`。没有它，「我的素材」
          列表每行都要再发一次请求才能显示标题与视频状态 —— 代价付在页面上。
          这里不重复列它的属性：同一批键写两遍就是第二个落点，改了这处忘了那处不会有任何症状。
