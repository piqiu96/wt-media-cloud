schema_version: 1
revision: "2026.11.05.4"

# 描述 Cloud 当前返回的 body；未知的可选属性省略，内部对象存储引用不返回。

schemas:
  ComposeTemplate:
    type: object
    additionalProperties: false
    required: [id, code, name, version, schema, status]
    properties:
      id: {type: integer, format: int64}
      code: {type: string}
      name: {type: string}
      version: {type: integer, minimum: 1}
      schema:
        type: object
        description: Versioned JSON Schema. Each property may declare editable; absent or false means fixed. Required and range validation remains server-side.
        properties:
          properties: {type: object, additionalProperties: {ref: ComposeTemplateParameter}}
      status: {type: string, enum: [active, inactive]}
  BasicCutV1Config:
    type: object
    required: [start_seconds, end_seconds]
    additionalProperties: false
    properties:
      start_seconds: {type: integer, minimum: 0}
      end_seconds: {type: integer, minimum: 1, description: Must exceed start_seconds.}
  GuideV1Config:
    type: object
    required: [guide_video_url, insert_seconds, guide_duration_seconds, max_duration_seconds]
    additionalProperties: false
    properties:
      guide_video_url: {type: string, format: uri, description: "Public downloadable HTTPS URL, frozen in the task snapshot."}
      insert_seconds: {type: integer, minimum: 0}
      guide_duration_seconds: {type: integer, minimum: 0, description: Zero uses the whole guide video.}
      max_duration_seconds: {type: integer, minimum: 0, description: Zero has no output duration limit.}
  ComposeStrategy:
    type: object
    required: [id, team_id, category_id, operator_id, operator_name, name, compose_template_id, compose_template_version, config, output_settings, execution_mode, schedule, priority_rules, single_limit, daily_limit, next_run_at, status, created_at, updated_at]
    properties:
      id: {type: integer, format: int64}
      team_id: {type: integer, format: int64}
      category_id: {type: integer, format: int64, minimum: 1}
      operator_id: {type: [integer, 'null'], format: int64, description: "Null on historical rows written before assignment existed; never backfilled from created_by."}
      operator_name: {type: string, description: "Display name resolved from operator_id; empty when unassigned or no longer resolvable."}
      name: {type: string}
      compose_template_id: {type: integer, format: int64}
      compose_template_version: {type: integer, minimum: 1}
      config:
        oneOf:
          - {ref: BasicCutV1Config}
          - {ref: GuideV1Config}
      output_settings: {type: array, minItems: 1, maxItems: 20, items: {ref: ComposeOutputSetting}, description: "Independent groups in saved order. When omitted by legacy requests config supplies one default group; each group stores complete template parameters."}
      execution_mode: {type: string, enum: [manual, scheduled]}
      schedule:
        oneOf:
          - {ref: ComposeSchedule}
          - {type: 'null'}
      priority_rules: {type: array, items: {ref: ComposePriorityRule}}
      single_limit: {type: integer, minimum: 1, maximum: 100}
      daily_limit: {type: integer, minimum: 0, maximum: 1000, description: "Required positive for scheduled strategies; manual strategies have no daily limit and persist zero."}
      next_run_at: {type: [string, 'null'], format: date-time, description: "UTC time; null unless the enabled strategy uses scheduled execution."}
      status: {type: string, enum: [enabled, disabled]}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
  ComposeSchedule:
    type: object
    additionalProperties: false
    required: [mode, timezone]
    properties:
      mode: {type: string, enum: [interval, daily]}
      interval_minutes: {type: integer, minimum: 1, maximum: 1440, description: "Required for interval mode; absent for other modes."}
      daily_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: "Required for daily mode; absent for other modes."}
      timezone: {type: string, description: "IANA timezone, default Asia/Shanghai in the editor."}
  ComposeScheduleRun:
    type: object
    required: [batch_id, run_key, compose_strategy_id, trigger_type, schedule_slot, candidate_count, created_count, skipped, created_at]
    properties:
      batch_id: {type: [integer, 'null'], format: int64, description: "Actual created batch ID; null for zero-task or historical runs."}
      run_key: {type: string}
      compose_strategy_id: {type: integer, format: int64}
      trigger_type: {type: string, enum: [manual, immediate, scheduled]}
      schedule_slot: {type: string, format: date-time}
      candidate_count: {type: integer, minimum: 0}
      created_count: {type: integer, minimum: 0}
      skipped:
        type: array
        items:
          type: object
          required: [material_id, reason]
          properties:
            material_id: {type: integer, format: int64}
            reason: {type: string}
      created_at: {type: string, format: date-time}
  ComposeOutputSetting:
    type: object
    additionalProperties: false
    description: Independent output group; array order is execution order. Platforms label each copy and do not multiply output count. All parameters are frozen per task.
    required: [name, platforms, copies, params]
    properties:
      key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$', description: "Unique stable group key. Omission generates group_N; reads always include the normalized key."}
      name: {type: string, minLength: 1, maxLength: 120}
      platforms: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {type: string, enum: [bilibili, baidu, xiaohongshu]}}
      copies: {type: integer, minimum: 1, maximum: 20}
      params: {type: object, description: "Complete template config; only parameters explicitly declared editable may differ from template defaults. Fixed values and unknown keys are rejected by the server."}
  ComposeTemplateParameter:
    type: object
    description: Versioned JSON Schema parameter definition. Missing editable means fixed; disabled UI controls do not grant override permission.
    properties:
      type: {type: string}
      title: {type: string}
      description: {type: string}
      default: {}
      minimum: {type: number}
      maximum: {type: number}
      editable: {type: boolean, default: false}
  ComposePriorityRule:
    type: object
    description: All filter groups apply first regardless of priority; match groups then run in ascending priority. Missing facts use three-valued all/any logic and never become zero.
    additionalProperties: false
    required: [priority, action, logic, conditions]
    properties:
      priority: {type: integer, minimum: 1}
      action: {type: string, enum: [match, filter]}
      logic: {type: string, enum: [all, any]}
      conditions: {type: array, minItems: 1, items: {ref: ComposeCondition}}
  ComposeCondition:
    type: object
    additionalProperties: false
    required: [field, operator, value]
    properties:
      field: {type: string, enum: [published_at, like_count, favorite_count]}
      operator: {type: string, enum: [eq, gte, lte, lt, recent_hours, recent_days], description: "Server validates allowed operators by field."}
      value: {oneOf: [{type: integer, minimum: 0}, {type: string, format: date-time}], description: "Integer for counts, recent_hours (1-8760) or recent_days (1-365); RFC3339 date-time for published_at gte/lt. Recent intervals roll backward from the execution instant."}
  ComposeConditionDecision:
    type: object
    additionalProperties: false
    required: [field, operator, expected, state]
    properties:
      field: {type: string, enum: [published_at, like_count, favorite_count]}
      operator: {type: string, enum: [eq, gte, lte, lt, recent_hours, recent_days]}
      expected: {oneOf: [{type: integer}, {type: string, format: date-time}]}
      actual: {oneOf: [{type: integer}, {type: string, format: date-time}], description: "Omitted for unknown facts; missing counts are never substituted with zero."}
      state: {type: string, enum: [matched, not_matched, unknown]}
  ComposePreviewMaterial:
    type: object
    additionalProperties: false
    required: [material_id, title, selected, reason]
    properties:
      material_id: {type: integer, format: int64}
      title: {type: string}
      selected: {type: boolean}
      reason: {type: string, description: "Specific selection or refusal reason such as matched, filtered, no_match, metrics_missing, already_executed, operator_unavailable, template_unavailable, per_run_limit or daily_limit. Conditions preserve the exact metric values and comparisons."}
      priority: {type: integer, minimum: 1, description: "Decisive rule priority when applicable. Filters always apply before match rules."}
      conditions: {type: array, items: {ref: ComposeConditionDecision}}
  ComposeExecutionPreview:
    type: object
    additionalProperties: false
    required: [strategy, selected_count, estimated_output_count, single_limit, daily_remaining, settings, materials, active_batch, preview_token]
    properties:
      strategy: {ref: ComposeStrategy}
      selected_count: {type: integer, minimum: 0, description: "Selected source materials; limits count materials rather than expanded tasks."}
      estimated_output_count: {type: integer, minimum: 0, description: "selected_count multiplied by the sum of setting copies; platforms do not multiply it."}
      single_limit: {type: integer, minimum: 1, maximum: 100}
      daily_remaining: {type: [integer, 'null'], minimum: 0, description: "Null for manual strategies, which have no daily quota. Scheduled run-now shares the scheduled daily material quota."}
      settings: {type: array, items: {ref: ComposeOutputSetting}}
      materials: {type: array, items: {ref: ComposePreviewMaterial}}
      active_batch: {oneOf: [{ref: ComposeTaskBatch}, {type: 'null'}], description: "Existing unfinished batch blocks immediate execution."}
      preview_token: {type: string, description: "Opaque confirmation token for this exact read-only result. Empty when execution is blocked by an active batch. Confirm must revalidate facts and quotas."}
  ComposeTaskBatch:
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - team_id
    - category_id
    - operator_id
    - compose_strategy_id
    - trigger_type
    - created_by
    - config_snapshot
    - created_at
    - counts
    - operator_name
    - strategy_name
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      team_id:
        type: integer
        format: int64
      category_id:
        type: integer
        format: int64
        minimum: 1
      operator_id:
        type:
        - integer
        - 'null'
        format: int64
      compose_strategy_id:
        type: integer
        format: int64
      trigger_type:
        type: string
        enum:
        - manual
        - immediate
        - scheduled
        description: Manual material creation, immediate strategy execution, or scheduled strategy execution.
      created_by:
        type: integer
        format: int64
      config_snapshot:
        oneOf:
        - type: array
          items:
            ref: ComposeOutputSetting
        - type: object
          required:
          - settings
          - acceptance
          properties:
            settings:
              type: array
              items:
                ref: ComposeOutputSetting
            acceptance:
              type: array
              items:
                type: object
                required:
                - material_id
                - code
                - message
                properties:
                  material_id:
                    type: integer
                    minimum: 1
                  code:
                    type: string
                  message:
                    type: string
            source_output_id:
              type: integer
              minimum: 1
            source_task_id:
              type: integer
              minimum: 1
        description: Frozen settings and optional manual acceptance outcomes. Guide addresses are redacted; legacy batches may return an empty array.
      created_at:
        type: string
        format: date-time
      counts:
        ref: ComposeBatchCounts
      operator_name:
        type: string
        description: Resolved owner display name; empty if unknown.
      strategy_name:
        type: string
        description: Resolved strategy display name.
  ComposeBatchCounts:
    type: object
    required: [pending, running, success, failed, cancelled]
    properties:
      pending: {type: integer, minimum: 0, description: Tasks of this run still waiting for a worker.}
      running: {type: integer, minimum: 0, description: Tasks of this run currently executing.}
      success: {type: integer, minimum: 0}
      failed: {type: integer, minimum: 0}
      cancelled: {type: integer, minimum: 0}
    description: Counts over every authorized task in the real batch, independent of local filters. Ended progress is (success+failed+cancelled)/total;
      success rate remains separate.
  ComposeTask:
    type: object
    required: [id, team_id, category_id, operator_id, operator_name, trigger_type, material_id, material_usage_id, compose_strategy_id, template_code, template_version, config_snapshot, status, created_by, created_at, updated_at]
    properties:
      id: {type: integer, format: int64}
      batch_id: {type: [integer, 'null'], format: int64, description: "Actual batch identity; null for historical tasks."}
      setting_key: {type: string, description: "Frozen output setting key; empty on legacy tasks."}
      setting_name: {type: string, description: "Frozen output setting name; empty on legacy tasks."}
      copy_index: {type: integer, minimum: 0, description: "One-based copy number for new tasks; zero on historical rows."}
      platforms: {type: [array, 'null'], items: {type: string, enum: [bilibili, baidu, xiaohongshu]}, description: "Frozen target platform labels; null on legacy tasks."}
      display_name: {type: string, description: "Creation-time material title and strategy name; empty for legacy tasks that cannot be safely reconstructed."}
      team_id: {type: integer, format: int64}
      category_id: {type: integer, format: int64, minimum: 1}
      operator_id: {type: [integer, 'null'], format: int64, description: "The strategy's operator at creation time, frozen on the task; null on historical rows, never backfilled from created_by."}
      operator_name: {type: string, description: "Display name resolved from operator_id; empty when unassigned or no longer resolvable."}
      trigger_type: {type: string, enum: [manual, immediate, scheduled]}
      material_id: {type: integer, format: int64}
      material_usage_id: {type: [integer, 'null'], format: int64, description: "Null when the task was created from the strategy team's material pool; scheduled production does not create a personal usage row."}
      compose_strategy_id: {type: integer, format: int64}
      template_code: {type: string}
      template_version: {type: integer, minimum: 1}
      config_snapshot: {type: object, description: "Frozen execution settings projected for readers; guide_video_url is replaced with a redaction label while the stored execution snapshot stays unchanged."}
      status: {type: string, enum: [pending, running, success, failed, cancelled]}
      cancel_requested: {type: boolean, description: "A cancel was requested while running; the task stays running until the worker confirms the controlled stop."}
      stage: {type: string, description: "Worker phase projection from the bounded set validating_input, waiting_input, cutting, uploading, committing; a pending task carries an empty stage."}
      progress: {type: integer, minimum: 0, maximum: 100}
      error_code: {type: string}
      error_message: {type: string, description: "Fixed human-readable error category; raw FFmpeg output, paths and signed URLs are never returned."}
      attempt_count: {type: integer, minimum: 0}
      started_at: {type: string, format: date-time, nullable: true, description: "Null until execution starts."}
      finished_at: {type: string, format: date-time, nullable: true, description: "Null until the terminal transition."}
      composite_output_id: {type: integer, format: int64, nullable: true, description: "Set only after the success transaction commits a verified output; never an object address."}
      created_by: {type: integer, format: int64}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
  Material:
    type: object
    description: Material projection, successful-output use facts and optional authorized selection metadata. Unknown optional values
      are not fabricated.
    required:
    - id
    - team_id
    - source_content_id
    - title
    - source_url
    - platform
    - status
    - video_status
    - view_count
    - like_count
    - favorite_count
    - comment_count
    - share_count
    - created_at
    - updated_at
    - created_by
    properties:
      id: {type: integer, format: int64}
      team_id: {type: integer, format: int64}
      source_content_id: {type: integer, format: int64}
      title: {type: string}
      source_url: {type: string, format: uri}
      platform: {type: string}
      video_status: {type: string, enum: [not_downloaded, downloading, ready, failed]}
      status: {type: string, enum: [available, paused, delisted]}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      created_by: {type: integer, format: int64}
      created_by_name: {type: string}
      usage_status: {type: string, enum: [active, removed], description: 当前查看者自己的素材关系状态；没有关系时该键不出现。}
      added_at: {type: string, format: date-time, description: 当前查看者这条关系建立的时间；没有关系时该键不出现。}
      my_usage: {type: string, enum: [used, unused], description: 当前查看者是否是至少一条成功成片的负责人。只按成功成片计算：失败、取消、 等待中的成片都不算；移出素材关系后，历史成功成片仍然算「已使用」。}
      usage:
        type: object
        description: 当前团队在这条素材上的成功成片事实，按 (素材, 团队) 聚合，跨团队不合并。 output_count 统计所有成功成片；operator_count 只统计有负责人的成片 —— 历史行没有负责人时仍计入前者的总数，但不计为「有人用过」，也不回填。
          operators 只返回给高级运营与管理员，普通运营只拿到两个计数。
        required: [output_count, operator_count]
        properties:
          output_count: {type: integer, format: int64, minimum: 0}
          operator_count: {type: integer, format: int64, minimum: 0}
          operators:
            type: array
            description: 有负责人的成功成片按操作人分组；普通运营看不到该键。
            items:
              type: object
              required: [id, output_count]
              properties: {id: {type: integer, format: int64}, name: {type: string, description: 姓名目录里查不到时该键不出现。}, output_count: {type: integer,
                  format: int64, minimum: 0}}
      category_id: {type: integer, format: int64, minimum: 1, description: 素材未归类目时该键不出现。}
      author_name: {type: string, description: 为空时该键不出现。}
      cover_url: {type: string, format: uri, description: 来源没有封面时该键不出现。}
      author_home_url: {type: string, format: uri, description: 来源没有作者主页时该键不出现。}
      view_count: {type: integer, format: int64}
      like_count: {type: integer, format: int64}
      favorite_count: {type: integer, format: int64}
      comment_count: {type: integer, format: int64}
      share_count: {type: integer, format: int64}
      published_at: {type: string, format: date-time, description: 来源没有发布时间时该键不出现。}
      video_size_bytes: {type: integer, format: int64, description: 准备通过校验前该键不出现。}
      video_sha256: {type: string, description: 准备通过校验前该键不出现。}
      media_summary: {type: object, description: 准备通过校验前该键不出现；形状由媒体探针决定，不是对外契约。}
      last_error: {type: string, description: 最近一次准备没有错误时该键不出现。}
      video_prepared_at: {type: string, format: date-time, description: 尚未有一次通过校验的准备时该键不出现。}
      selectable: {type: boolean, description: Selector eligibility; prior successful or unfinished tasks do not automatically prevent
          a new confirmed production.}
      selection_reason: {type: string, description: Source or material refusal reason when selection is unavailable.}
      strategy_history: {ref: ComposeMaterialState}
      metric_presence:
        type: object
        required: [view_count, like_count, favorite_count]
        properties: {view_count: {type: boolean}, like_count: {type: boolean}, favorite_count: {type: boolean}}
        description: Selector source evidence. False means unknown; display a dash rather than the legacy numeric default zero.
    forbidden_properties: [object_key, local_path, download_url, video_url, storage_credential]
  MaterialVideoLink:
    type: object
    description: >-
      详情链接接口（GET /api/v1/materials/{material_id}/video-url）的 body：云端视频的
      **签名**地址。它是这个地址的**唯一**出口 —— 列表与素材 body 都不携带（见
      Material 的 forbidden_properties），因为一个浏览器拿得到的地址应当只落在明确
      检查过登录与业务范围的读取上。地址是对该对象的一次性短时 GET grant：桶拒绝匿名
      读取（2026-10-01 实测 403 `Garage does not support anonymous access yet`），
      不签名的地址是服务端自己已经证明打不开的那一个。**它会过期**，所以调用方每次
      用之前重新要，不要持有 —— 详情抽屉因此在点击「打开云端视频」时才发这次请求，
      而不是在抽屉打开时。存活时长是配置项（`object_storage.presign_ttl`），不是本
      body 的一部分，故这里**不发布** `expires_at`。
    required: [url]
    properties:
      url: {type: string, format: uri}

  MaterialUsage:
    type: object
    description: 「我的素材」里的一条关系；移出保留同一行，只把状态改写，故历史可追溯、可恢复。
    required: [id, team_id, material_id, user_id, status, created_at, updated_at]
    properties:
      id: {type: integer, format: int64}
      team_id: {type: integer, format: int64}
      material_id: {type: integer, format: int64}
      user_id: {type: integer, format: int64}
      status: {type: string, enum: [active, removed]}
      download_status: {type: string, enum: [downloading, downloaded, failed], description: 该用户在这条素材上的下载生命周期，按「最新一条 user_download 任务」派生
          （pending/running→downloading；success→downloaded；failed/cancelled→failed）， 与素材云侧 `video_status` 正交。从未下载过时该键不出现。}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      removed_at: {type: string, format: date-time, description: 关系仍是 active 时该键不出现。}
      material: {type: object, description: 这条关系指向的素材，随列表一并返回，键集即上方 `Material`。没有它，「我的素材」 列表每行都要再发一次请求才能显示标题与视频状态 —— 代价付在页面上。 这里不重复列它的属性：同一批键写两遍就是第二个落点，改了这处忘了那处不会有任何症状。}
  MaterialPage:
    type: object
    required: [items, total, page, page_size]
    properties: {items: {type: array, items: {ref: Material}}, total: {type: integer, minimum: 0}, page: {type: integer, minimum: 1},
      page_size: {type: integer, minimum: 1}}
  MaterialUsagePage:
    type: object
    required: [items, total, page, page_size]
    properties: {items: {type: array, items: {ref: MaterialUsage}}, total: {type: integer, minimum: 0}, page: {type: integer, minimum: 1},
      page_size: {type: integer, minimum: 1}}
  ComposeTaskPage:
    type: object
    required: [items, total, page, page_size]
    properties: {items: {type: array, items: {ref: ComposeTask}}, total: {type: integer, minimum: 0}, page: {type: integer, minimum: 1},
      page_size: {type: integer, minimum: 1}}
  ComposeTaskBatchPage:
    type: object
    required: [items, total, page, page_size]
    properties: {items: {type: array, items: {ref: ComposeTaskBatch}}, total: {type: integer, minimum: 0}, page: {type: integer, minimum: 1},
      page_size: {type: integer, minimum: 1}}
  ComposeBatchActions:
    type: object
    required: [retry_count, cancel_count]
    properties: {retry_count: {type: integer, minimum: 0}, cancel_count: {type: integer, minimum: 0}}
    description: Eligible task counts from the entire batch, independent of task-page filters. Retry is zero for roles without retry permission.
  ComposeTaskBatchDetail:
    type: object
    required: [batch, actions]
    properties: {batch: {ref: ComposeTaskBatch}, actions: {ref: ComposeBatchActions}}
  ComposeBulkItem:
    type: object
    required: [task_id, status]
    properties: {task_id: {type: integer, minimum: 1}, status: {type: string, enum: [accepted, skipped, failed]}, reason: {type: string},
      task: {ref: ComposeTask}}
  ComposeBulkResult:
    type: object
    required: [items, accepted, skipped, failed]
    properties: {items: {type: array, items: {ref: ComposeBulkItem}}, accepted: {type: integer, minimum: 0}, skipped: {type: integer,
        minimum: 0}, failed: {type: integer, minimum: 0}}
  ComposeTaskAttempt:
    type: object
    required: [id, compose_task_id, attempt, source, started_at, outcome, stage, error_code, error_message, steps, created_at, updated_at,
      finished_at]
    properties:
      id: {type: integer, format: int64}
      compose_task_id: {type: integer, format: int64}
      attempt: {type: integer, minimum: 1, description: Matches the task's attempt_count for that run.}
      source: {type: string, enum: [auto, manual], description: auto — the worker's own transient retry; manual — an authorized human
          retry.}
      started_at: {type: string, format: date-time, nullable: true, description: Null until the worker claims the attempt.}
      finished_at: {type: string, format: date-time, nullable: true, description: Null while the attempt is pending or running.}
      outcome: {type: string, enum: [pending, running, success, failed, cancelled]}
      stage: {type: string, description: Last projected phase of the attempt; empty until the worker reports progress.}
      error_code: {type: string}
      error_message: {type: string, description: 'Fixed human-readable error category; raw FFmpeg output, paths and signed URLs are never
          returned.'}
      steps: {type: array, description: 'The steps this attempt completed or failed on, in execution order. Server-authored labels and
          allowlisted metrics only — never a source address, a storage key, a local path or raw FFmpeg output.', items: {ref: ComposeTaskAttemptStep}}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      uncertain_review: {ref: ComposeUncertainReview, description: Only admins and same-team senior operators receive the recorded review
          event and evidence; omitted for ordinary operators. At most one per attempt.}
  ComposeTaskAttemptStep:
    type: object
    additionalProperties: false
    required: [step, label, outcome, started_at, finished_at, duration_ms, error_code, error_label, metrics]
    properties:
      step: {type: string, enum: [validate_input, prepare_input, fetch_guide, cut, upload, commit]}
      label: {type: string, description: Server-authored Chinese label for the step key.}
      outcome: {type: string, enum: [success, failed]}
      started_at: {type: string, format: date-time}
      finished_at: {type: string, format: date-time}
      duration_ms: {type: integer, minimum: 0}
      error_code: {type: string, description: Empty on a successful step; the bounded failure code on a failed one.}
      error_label: {type: string, description: 'Fixed human-readable failure category, empty on a successful step.'}
      metrics: {ref: ComposeTaskAttemptStepMetrics}
  ComposeTaskAttemptStepMetrics:
    type: object
    additionalProperties: false
    properties:
      size_bytes: {type: integer, format: int64, minimum: 1, description: Bytes this step staged or stored.}
      sha256: {type: string, description: Digest of the verified output; 64 lowercase hex characters.}
      output_duration_ms: {type: integer, format: int64, minimum: 1, description: Duration of the composed output the executor reported.}
      output_id: {type: integer, format: int64, minimum: 1, description: Row id of the composite output committed by this step.}
  ComposeUncertainReview:
    type: object
    additionalProperties: false
    required: [id, compose_task_id, attempt, actor_user_id, evidence, created_at]
    properties:
      id: {type: integer, format: int64}
      compose_task_id: {type: integer, format: int64}
      attempt: {type: integer, minimum: 1, description: The uncertain attempt reviewed before manual retry.}
      actor_user_id: {type: integer, format: int64}
      evidence: {type: string, description: 'Reviewer''s verification note, not automated proof.'}
      created_at: {type: string, format: date-time}
  ComposeMaterialState:
    type: object
    additionalProperties: false
    required: [material_id, success_count, active_count, failed_count, cancelled_count, last_task_at]
    properties: {material_id: {type: integer, format: int64}, success_count: {type: integer, minimum: 0}, active_count: {type: integer,
        minimum: 0}, failed_count: {type: integer, minimum: 0}, cancelled_count: {type: integer, minimum: 0}, last_task_at: {type: [string,
          'null'], format: date-time}}
    description: Read-only history for confirmation; previous production may be made again using a new command and batch.
  CreateComposeTasksResult:
    type: object
    required: [batch, replayed, created, failed]
    properties: {batch: {oneOf: [{ref: ComposeTaskBatch}, {type: 'null'}]}, replayed: {type: boolean}, created: {type: array, items: {
          ref: ComposeTask}}, failed: {type: array, items: {ref: ComposeTaskCreateFailure}}}
  ComposeTaskCreateFailure:
    type: object
    required: [material_id, request_key, errcode, error, message]
    properties: {material_id: {type: integer, minimum: 1}, request_key: {type: string}, errcode: {type: integer}, error: {type: string},
      message: {type: string}}
  ComposeOutput:
    type: object
    additionalProperties: false
    required:
    - id
    - team_id
    - category_id
    - operator_id
    - operator_name
    - material_id
    - material_usage_id
    - compose_task_id
    - compose_strategy_id
    - template_code
    - template_version
    - file_size_bytes
    - sha256
    - media
    - publish_status
    - created_by
    - created_at
    - updated_at
    - name
    - file_name
    - material_title
    - author_name
    - strategy_name
    - batch_id
    - setting_key
    - setting_name
    - platforms
    - video
    - actions
    properties:
      id:
        type: integer
        format: int64
      team_id:
        type: integer
        format: int64
      category_id:
        type: integer
        format: int64
        minimum: 1
      operator_id:
        type:
        - integer
        - 'null'
        format: int64
        description: Inherited from the task's operator snapshot; null on historical rows, never backfilled from created_by.
      operator_name:
        type: string
        description: Display name resolved from operator_id; empty when unassigned or no longer resolvable.
      material_id:
        type: integer
        format: int64
      material_usage_id:
        type:
        - integer
        - 'null'
        format: int64
        description: Null when the task was created from the strategy team's material pool; scheduled production does not create a personal usage row.
      compose_task_id:
        type: integer
        format: int64
      compose_strategy_id:
        type: integer
        format: int64
      template_code:
        type: string
      template_version:
        type: integer
        minimum: 1
      file_size_bytes:
        type: integer
        format: int64
        minimum: 1
      sha256:
        type: string
      media:
        type:
        - object
        - 'null'
        description: Verified final output probe facts only. Unknown fields are omitted.
        properties:
          duration_ms:
            type: integer
            minimum: 1
          width:
            type: integer
            minimum: 1
          height:
            type: integer
            minimum: 1
      publish_status:
        type: string
        enum:
        - pending_publish
        - published
        - archived
        description: Legacy stored field; never used as evidence for per-platform publishing.
      created_by:
        type: integer
        format: int64
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      name:
        type: string
        description: Persisted creation-time material title and setting name; empty when historical facts are unknown.
      file_name:
        type: string
        description: Persisted safe video filename including output ID and extension; unknown legacy rows remain empty.
      material_title:
        type: string
      author_name:
        type: string
      strategy_name:
        type: string
      batch_id:
        type:
        - integer
        - 'null'
        format: int64
      setting_key:
        type: string
      setting_name:
        type: string
      platforms:
        type:
        - array
        - 'null'
        items:
          type: string
          enum:
          - bilibili
          - baidu
          - xiaohongshu
      video:
        ref: ComposeOutputVideo
      actions:
        ref: ComposeOutputActions
  ComposeOutputTrace:
    type: object
    additionalProperties: false
    required:
    - material
    - material_usage
    - strategy
    - compose_task
    - publishing
    properties:
      material:
        type: object
        required:
        - id
        - title
        properties:
          id:
            type: integer
            format: int64
          title:
            type: string
      material_usage:
        type:
        - object
        - 'null'
        required:
        - id
        - status
        properties:
          id:
            type: integer
            format: int64
          status:
            type: string
            description: active or removed — the usage is history, not a live requirement.
        description: Null when the output came from a scheduled task over the team material pool; the key stays, the value is null.
      strategy:
        type: object
        required:
        - id
        - name
        - template_code
        - template_version
        - config_snapshot
        - template_schema
        properties:
          id:
            type: integer
            format: int64
          name:
            type: string
          template_code:
            type: string
          template_version:
            type: integer
            minimum: 1
          config_snapshot:
            type:
            - object
            - 'null'
            description: Original task final parameter snapshot with fixed guide addresses redacted.
          template_schema:
            type:
            - object
            - 'null'
            description: Exact original template version schema, never a current-version substitution.
      compose_task:
        type: object
        required:
        - id
        - status
        - config_snapshot
        - created_at
        - batch_id
        - setting_key
        - setting_name
        - platforms
        - template_code
        - template_version
        properties:
          id:
            type: integer
            format: int64
          status:
            type: string
          config_snapshot:
            type:
            - object
            - 'null'
            description: Original task final parameter snapshot with fixed guide addresses redacted.
          created_at:
            type: string
            format: date-time
          batch_id:
            type:
            - integer
            - 'null'
            format: int64
          setting_key:
            type: string
          setting_name:
            type: string
          platforms:
            type:
            - array
            - 'null'
            items:
              type: string
              enum:
              - bilibili
              - baidu
              - xiaohongshu
          template_code:
            type: string
          template_version:
            type: integer
            minimum: 0
      publishing:
        ref: ComposeOutputPublishing
  ComposeOutputVideo:
    type: object
    additionalProperties: false
    required:
    - status
    - reason
    - checked_at
    properties:
      status:
        type: string
        enum:
        - ready
        - failed
        - unknown
      reason:
        type: string
      checked_at:
        type:
        - string
        - 'null'
        format: date-time
  ComposeOutputActions:
    type: object
    additionalProperties: false
    required:
    - download
    - remake
    - download_reason
    - remake_reason
    properties:
      download:
        type: boolean
      remake:
        type: boolean
      download_reason:
        type: string
      remake_reason:
        type: string
  ComposeOutputPublishing:
    type: object
    additionalProperties: false
    required:
    - available
    - reason
    - platforms
    properties:
      available:
        type: boolean
        const: false
      reason:
        type: string
      platforms:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - platform
          - status
          properties:
            platform:
              type: string
              enum:
              - bilibili
              - baidu
              - xiaohongshu
            status:
              type:
              - string
              - 'null'
              enum:
              - null
              - unarranged
              - arranged
              - published
              description: Null when the publishing domain is unavailable; no inferred legacy global status.
  ComposeOutputPage:
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - page_size
    properties:
      items:
        type: array
        items:
          ref: ComposeOutput
      total:
        type: integer
        minimum: 0
      page:
        type: integer
        minimum: 1
      page_size:
        type: integer
        minimum: 1
        maximum: 100
  ComposeOutputMaterial:
    type: object
    additionalProperties: false
    required:
    - material_id
    - material_title
    - author_name
    - category_id
    - output_count
    - strategies
    - latest_created_at
    properties:
      material_id:
        type: integer
        format: int64
      material_title:
        type: string
      author_name:
        type: string
      category_id:
        type: integer
        format: int64
      output_count:
        type: integer
        minimum: 1
      strategies:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
      latest_created_at:
        type: string
        format: date-time
  ComposeOutputMaterialPage:
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - page_size
    properties:
      items:
        type: array
        items:
          ref: ComposeOutputMaterial
      total:
        type: integer
        minimum: 0
      page:
        type: integer
        minimum: 1
      page_size:
        type: integer
        minimum: 1
        maximum: 100

  ComposeStrategyPage:
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - page_size
    properties:
      items:
        type: array
        items:
          ref: ComposeStrategy
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        minimum: 1
      page_size:
        type: integer
        minimum: 1
        maximum: 100
