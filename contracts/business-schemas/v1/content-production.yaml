schema_version: 1
revision: "2026.09.26.1"

schemas:
  Material:
    type: object
    required: [id, team_id, source_content_id, title, source_url, video_status, created_at, updated_at]
    properties:
      id: {type: integer, format: int64}
      team_id: {type: integer, format: int64}
      game_id: {type: string, nullable: true}
      source_content_id: {type: integer, format: int64}
      title: {type: string}
      source_url: {type: string, format: uri}
      platform: {type: string}
      author_name: {type: string, nullable: true}
      published_at: {type: string, format: date-time, nullable: true}
      video_status: {type: string, enum: [not_downloaded, downloading, ready, failed]}
      object_key: {type: string, nullable: true, description: Internal Cloud object reference; never a signed URL.}
      file_size_bytes: {type: integer, format: int64, nullable: true}
      sha256: {type: string, nullable: true}
      media_summary: {type: object, nullable: true}
      last_error: {type: string, nullable: true}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
    forbidden_properties: [local_path, download_url, storage_credential]

  MaterialUsage:
    type: object
    required: [id, material_id, user_id, status, created_at, updated_at]
    properties:
      id: {type: integer, format: int64}
      material_id: {type: integer, format: int64}
      user_id: {type: integer, format: int64}
      status: {type: string, enum: [active, removed]}
      removed_at: {type: string, format: date-time, nullable: true}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}

  FileTransferTask:
    type: object
    required: [id, asset_type, asset_id, purpose, execution_scope, status, total_bytes, completed_bytes, attempt_count, created_at, updated_at]
    properties:
      id: {type: string}
      asset_type: {type: string, const: material}
      asset_id: {type: integer, format: int64}
      purpose: {type: string, enum: [compose_input_prepare, user_download]}
      execution_scope: {type: string, enum: [cloud, local_agent]}
      status: {type: string, enum: [pending, running, success, failed, cancelled]}
      total_bytes: {type: integer, format: int64, minimum: 0}
      completed_bytes: {type: integer, format: int64, minimum: 0}
      bytes_per_second: {type: integer, format: int64, minimum: 0}
      estimated_remaining_seconds: {type: integer, format: int64, minimum: 0, nullable: true}
      attempt_count: {type: integer, minimum: 0}
      max_attempts: {type: integer, minimum: 1}
      checksum_sha256: {type: string, nullable: true}
      error_code: {type: string, nullable: true}
      error_message: {type: string, nullable: true}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
    forbidden_properties: [local_path, download_url, storage_credential, node_credential]
