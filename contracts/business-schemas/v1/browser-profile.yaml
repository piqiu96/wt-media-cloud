schema_version: 1
revision: "2026.10.30.1"
schemas:
  BrowserProfile:
    type: object
    description: >
      One BitBrowser Profile mirror as Cloud knows it. Reads and writes scope on
      `user_id + bit_main_user_id`; a row under another main account is not visible.
    required: [id, user_id, team_id, bit_profile_id, bit_main_user_id, bit_user_id, bit_name, local_state, enabled, last_synced_at]
    properties:
      id: {type: string}
      user_id: {type: integer, format: int64}
      team_id: {type: integer, format: int64, nullable: true}
      bit_profile_id: {type: string}
      bit_main_user_id: {type: string, source: BitBrowser.mainUserId}
      bit_user_id: {type: string, source: BitBrowser.userId}
      bit_name: {type: string}
      bit_seq: {type: integer}
      bit_group_id: {type: string}
      bit_group_name: {type: string}
      bit_profile_status: {type: string}
      bit_updated_at: {type: string}
      bit_proxy_type: {type: string}
      bit_proxy_host: {type: string}
      bit_proxy_port: {type: integer}
      bit_remark: {type: string}
      remark: {type: string}
      enabled: {type: boolean}
      local_state: {type: string, enum: [active, local_missing, archived]}
      proxy_id: {type: integer, format: int64, nullable: true}
      reserved_proxy_id: {type: integer, format: int64, nullable: true}
      proxy_operation: {type: object, description: Internal current/last operation receipt containing operation_id/action/proxy_id/outcome only; no credentials, not included in profile list.}
      reserved_since: {type: string, format: date-time, nullable: true}
      last_synced_at: {type: string, format: date-time}
    forbidden_properties: [cookie, password, proxy_username, proxy_password, oper_user_id]
  BitAccountBinding:
    type: object
    required: [user_id, bit_main_user_id, status]
    properties:
      user_id: {type: integer, format: int64}
      bit_main_user_id: {type: string}
      status: {type: string, enum: [bound]}
      bound_at: {type: string, format: date-time}
      last_verified_at: {type: string, format: date-time}
  BitAccountView:
    type: object
    description: >
      What the Web front-end may see. The full `main_user_id` never leaves the Cloud:
      eight characters or fewer are shown as `****`, longer ones keep the first four and
      the last four.
    required: [bound]
    properties:
      bound: {type: boolean}
      main_user_id_masked: {type: string}
      bound_at: {type: string, format: date-time}
      last_verified_at: {type: string, format: date-time}
    forbidden_properties: [main_user_id]
sync_policy:
  snapshot_is_staged: true
  confirmation_required: true
  automatic_rebind: false
  one_snapshot_per_user: true
  snapshot_carries_bit_main_user_id: true
  snapshot_carries_observed_at: true
  confirmation_never_deletes_unseen_profiles: true
  confirmed_snapshot_retained_until_next_scan: true
  new_clients_confirm_reviewed_sync_id: true
  repeated_confirmation_returns_receipt: true
