openapi: 3.1.0
info:
  title: WT Media Cloud File Transfer API
  version: 2026.10.23.1
  description: >-
    Executor-neutral transfer task API. Asset domains may create tasks but do not own the transfer
    lifecycle. Every response uses the Cloud errcode/message/data/logid envelope, and every task body is a
    `FileTransferTask` record from `business-schemas/v1/file-transfer.yaml` — never a local path, a signed
    URL, or a storage credential.

    Redelivery (重投递) semantics: a download belongs to the user, not to a machine. The dedupe key and the
    latest-success check are scoped to the user, so a repeat click while the task is outstanding is the same
    request, and any machine the user logs in on can claim the task. A task left pending by one machine
    stays claimable by the next; there is no per-device ownership to unbind and no suspended-device state.
paths:
  /api/v1/file-transfer-tasks:
    get:
      operationId: listFileTransferTasks
      summary: List transfer tasks visible to the current user.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: The current user's `FileTransferTask` records, newest first. The list is always scoped to the requesting user; no query parameter widens it.}
  /api/v1/file-transfer-tasks/{task_id}/cancel:
    post:
      operationId: cancelFileTransferTask
      summary: Request cancellation; a running executor confirms terminal cancellation.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: 'The refreshed `FileTransferTask`: `cancelled` when it had no executor, otherwise `running` with a recorded cancellation request that the executor turns terminal.'}
        '403': {description: 'Task belongs to another user (`transfer_task_forbidden`).'}
        '404': {description: 'Task does not exist (`transfer_task_not_found`).'}
        '409': {description: 'Task is already terminal (`transfer_task_conflict`).'}
  /api/v1/file-transfer-tasks/{task_id}/hide:
    post:
      operationId: hideFileTransferTask
      summary: Hide the current user's finished download history for the task's asset from the download centre.
      description: >-
        Only a terminal user_download may be hidden. The operation hides the current user's finished
        download rows for the same asset type and asset ID so an older row does not reappear. Task facts,
        asset facts, local files, and download-status projections remain unchanged. Repeating the call is safe.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: 'Display history hidden; response data is null.'}
        '403': {description: 'Task belongs to another user (`transfer_task_forbidden`).'}
        '404': {description: 'Task does not exist (`transfer_task_not_found`).'}
        '409': {description: 'Task is not a terminal user download (`transfer_task_conflict`).'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  parameters:
    TaskID: {in: path, name: task_id, required: true, schema: {type: string}}
