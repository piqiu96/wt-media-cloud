openapi: 3.1.0
info:
  title: WT Media Work
  version: 2026.11.21.2
  description: Canonical verified public work. Singular entity names. IDs are decimal strings. No public creation or deletion. Publication resolution owns evidence and atomic association. Scope matches publication owner/team/category. Timestamps RFC3339, today uses actual platform published_at in Asia/Shanghai.
paths:
  /api/v1/work:
    get:
      operationId: listWork
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: search, schema: {type: string, maxLength: 100}}
        - {in: query, name: platform, schema: {type: string, enum: [baidu, bilibili, xiaohongshu]}}
        - {in: query, name: category_id, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
        - {in: query, name: media_account_id, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
        - {in: query, name: published_from, schema: {type: string, format: date-time}}
        - {in: query, name: published_before, schema: {type: string, format: date-time}}
      responses:
        '200': {description: 'Standard envelope data {items:[Work],total,page,page_size}. Work contains id, platform, platform_work_id, work_url, platform_account_uid, media_account_id, operator_id, team_id, category_id, publication_id, attempt_id, composite_output_id, title, account_name, cover_resource_path, cover_file_id, published_at, first_observed_at. No credentials or private execution evidence.'}
        '400': {description: Invalid filters.}
  /api/v1/work/summary:
    get:
      operationId: summarizeWork
      security: [{sessionCookie: []}]
      description: Same filters and actor scope as list, independent of pagination. Actual platform published_at determines today; first observation never substitutes for publication time.
      responses:
        '200': {description: 'Standard envelope data {all,today}.'}
  /api/v1/work/{id}:
    get:
      operationId: getWork
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
      responses:
        '200': {description: Standard envelope data Work.}
        '404': {description: Missing or outside current user/team/category scope.}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
