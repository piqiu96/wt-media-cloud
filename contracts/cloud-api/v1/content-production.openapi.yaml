        created_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        name:
          type: string
          description: Persisted creation-time material title and setting name; empty when historical facts are unknown.
        file_name:
          type: string
          description: Persisted safe video filename including output ID and extension; unknown legacy rows remain empty.
        material_title:
          type: string
        author_name:
          type: string
        strategy_name:
          type: string
        batch_id:
          type:
          - integer
          - 'null'
          format: int64
        setting_key:
          type: string
        setting_name:
          type: string
        platforms:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - bilibili
            - baidu
            - xiaohongshu
        video:
          $ref: '#/components/schemas/ComposeOutputVideo'
        actions:
          $ref: '#/components/schemas/ComposeOutputActions'
    ComposeOutputTrace:
