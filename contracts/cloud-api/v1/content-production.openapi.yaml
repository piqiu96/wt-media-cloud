      - compose_strategy_id
      - template_code
      - template_version
      - file_size_bytes
      - sha256
      - media
      - publish_status
      - created_by
      - created_at
      - updated_at
      - name
      - file_name
      - material_title
      - author_name
      - strategy_name
      - batch_id
      - setting_key
      - setting_name
      - platforms
      - video
      - actions
      properties:
        id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
          minimum: 1
        operator_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Inherited from the task's operator snapshot; null on historical rows, never backfilled from created_by.
        operator_name:
          type: string
          description: Display name resolved from operator_id; empty when unassigned or no longer resolvable.
        material_id:
          type: integer
          format: int64
        material_usage_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Null when the task was created from the strategy team's material pool; scheduled production does not create a personal usage row.
        compose_task_id:
          type: integer
          format: int64
        compose_strategy_id:
          type: integer
          format: int64
        template_code:
          type: string
        template_version:
          type: integer
          minimum: 1
        file_size_bytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
        media:
          type:
          - object
          - 'null'
          description: Verified final output probe facts only. Unknown fields are omitted.
          properties:
            duration_ms:
