openapi: 3.1.0
info:
  title: WT Media Cloud Content Production API
  version: 2026.11.05.3
  description: Cloud content production API. Every response uses the Cloud errcode/message/data/logid envelope.
paths:
  /api/v1/compose-templates:
    get:
      operationId: listComposeTemplates
      summary: Read published active compose template versions.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Published active template versions.}
        '403': {description: Actor cannot read the template catalog.}
  /api/v1/compose-operators:
    get:
      operationId: listComposeOperators
      summary: List the people a strategy at one team may be assigned to.
      description: >-
        Senior operators name only their own team; administrators must pass the
        target team. An ordinary operator has no directory (403). A person is
        eligible when enabled, holds the operator or senior_operator role and
        belongs to the team; a category_id narrows the result to people responsible
        for that category.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: team_id, required: false, description: Required for administrators; senior operators may omit it and are pinned to their own team., schema: {type: integer, format: int64, minimum: 1}}
        - {in: query, name: category_id, required: false, description: Optional exact category ID; the strategy form passes the category it will bind., schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: '[ComposeOperatorOption] sorted by display name.'}
        '400': {description: Missing or invalid team (named compose_operator_invalid).}
        '403': {description: Actor is an ordinary operator or names another team (named compose_operator_forbidden).}
  /api/v1/compose-strategies:
    get:
      operationId: listComposeStrategies
      summary: List strategies in the actor's team and category scope; an ordinary operator sees only enabled strategies assigned to them.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: search, required: false, description: "Strategy name substring, or exact strategy ID when numeric.", schema: {type: string, maxLength: 100}}
        - {in: query, name: category_id, required: false, description: Exact category ID., schema: {type: integer, format: int64, minimum: 1}}
        - {in: query, name: template_id, required: false, description: Exact compose template ID; non-positive values are refused., schema: {type: integer, minimum: 1}}
        - {in: query, name: status, required: false, description: Exact strategy status. Unknown values are refused., schema: {type: string, enum: [enabled, disabled]}}
      responses:
        '200': {description: Visible strategies with their fixed template version and current config.}
        '400': {description: Invalid filter (named compose_strategy_invalid).}
    post:
      operationId: createComposeStrategy
      summary: Senior operator creates a strategy bound to one active template version.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateComposeStrategy'}
      responses:
        '201': {description: "Created strategy, read back from storage."}
        '400': {description: Invalid input or config outside the bound template schema.}
        '403': {description: Actor cannot manage the target team or category.}
        '409': {description: Template version is inactive or not executable.}
  /api/v1/compose-strategies/{strategy_id}:
    get:
      operationId: getComposeStrategy
      summary: Read one visible strategy.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200': {description: Strategy in the actor's scope.}
        '404': {description: Strategy absent or outside the actor's scope.}
    put:
      operationId: updateComposeStrategy
      summary: Senior operator updates the current config, execution settings and conditions without changing the bound template version.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateComposeStrategy'}
      responses:
        '200': {description: Updated current strategy.}
        '400': {description: Invalid input or config outside the bound template schema.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-strategies/{strategy_id}/copy:
    post:
      operationId: copyComposeStrategy
      summary: Senior operator copies a strategy while retaining its template binding and config.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopyComposeStrategy'}
      responses:
        '201': {description: New independent strategy.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
        '409': {description: Bound template version is no longer active.}
  /api/v1/compose-strategies/{strategy_id}/status:
    patch:
      operationId: setComposeStrategyStatus
      summary: Senior operator enables or disables a strategy.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComposeStrategyStatusChange'}
      responses:
        '200': {description: Strategy with updated status.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-strategies/next-run-preview:
    post:
      operationId: previewComposeStrategyNextRun
      summary: Compute the next execution time from a draft plan using the scheduler algorithm, without saving it.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComposeSchedule'}
      responses:
        '200': {description: Object with next_run_at computed at request time.}
        '400': {description: Invalid schedule fields.}
        '403': {description: Actor cannot manage strategies.}
  /api/v1/compose-strategies/{strategy_id}/execution-preview:
    post:
      operationId: previewComposeStrategyExecution
      summary: Read-only material decisions and estimated outputs for immediate strategy execution.
      description: Does not create a run, batch, task, material usage or input preparation job. Applies the same eligibility and quota rules as confirmation; reports an existing unfinished batch instead of queuing another run.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200':
          description: Read-only execution preview in the standard Cloud envelope.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties:
                  errcode: {type: integer}
                  message: {type: string}
                  data: {$ref: '#/components/schemas/ComposeExecutionPreview'}
                  logid: {type: string}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-strategies/{strategy_id}/run-now:
    post:
      operationId: runComposeStrategyNow
      summary: Start one immediate selection and queue pass without moving next_run_at.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_key, preview_token]
              properties:
                preview_token: {type: string, minLength: 64, maxLength: 64, description: "Token from the latest execution-preview result. Required at the HTTP boundary; revalidated transactionally before creating tasks."}
                request_key: {type: string, minLength: 8, maxLength: 64, description: Stable client idempotency key for this command.}
      responses:
        '200': {description: "ComposeScheduleRun with nullable batch_id and per-material skip reasons. Same request key and content replay the prior result; zero tasks still produce a run but no empty batch."}
        '400': {description: Invalid request or strategy has no plan.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
        '409': {description: 'compose_preview_changed (errcode 15214) when facts, quota or settings changed since preview; compose_already_running (errcode 15215) when the strategy has unfinished work. Refresh preview before confirming again.'}
  /api/v1/compose-strategies/{strategy_id}/runs:
    get:
      operationId: listComposeStrategyRuns
      summary: Read paged strategy run history with optional trigger and time filters.
      security: [{sessionCookie: []}]
      parameters:
      - {$ref: '#/components/parameters/StrategyID'}
      - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
      - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      - {in: query, name: trigger_type, schema: {type: string, enum: [manual, immediate, scheduled]}}
      - {in: query, name: created_from, schema: {type: string, format: date-time}, description: Inclusive UTC or offset-aware execution
          start.}
      - {in: query, name: created_before, schema: {type: string, format: date-time}, description: Exclusive UTC or offset-aware execution
          end.}
      responses:
        '200':
          description: Persisted runs and an exact filtered total, newest first.
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/ComposeScheduleRunHistoryPage'}}
        '400': {description: Invalid pagination or filters.}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-tasks:
    post:
      operationId: createComposeTasks
      summary: Create one manual task batch with one task per material, output setting and copy.
      description: The nominated operator owns each material usage; the actor is the audit creator. A material may be produced again after
        explicit remake confirmation. Same command replay returns the original batch and per-material outcome; a new command creates new
        tasks. A zero-accepted result has a null batch. Each task freezes the final permitted parameter snapshot; retries keep the original
        task and configuration.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateComposeTasks'}}}
      responses:
        '200':
          description: Batch and per-material acceptance results, including whole-command replay.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties: {errcode: {type: integer}, message: {type: string}, logid: {type: string}, data: {$ref: '#/components/schemas/CreateComposeTasksResult'}}
        '400': {description: Command body invalid (named compose_task_invalid).}
        '403': {description: Strategy or a material is outside the actor's scope (named compose_task_forbidden).}
        '404': {description: Strategy absent or outside the actor's scope (named compose_task_not_found).}
        '409': {description: 'Template unavailable, reused request key with different command content, or remake confirmation required
            (compose_task_conflict).'}
    get:
      operationId: listComposeTasks
      summary: List compose tasks visible in the current user's scope.
      security: [{sessionCookie: []}]
      parameters:
      - {in: query, name: status, required: false, schema: {type: string, enum: [pending, running, success, failed, cancelled]}}
      - {in: query, name: trigger_type, required: false, schema: {type: string, enum: [manual, immediate, scheduled]}}
      - {in: query, name: compose_strategy_id, required: false, schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: team_id, required: false, description: Administrators may narrow to one team; operators and seniors are pinned
          to their own., schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: operator_id, required: false, description: Exact responsible operator. Ordinary operators may only name themselves.,
        schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: operator_scope, required: false, description: 'mine matches the assigned operator, or the creator of a historical
          unassigned row; team drops the operator narrowing inside the actor''s team; all is administrator-only.', schema: {type: string,
          enum: [mine, team, all]}}
      - {$ref: '#/components/parameters/CreatedFrom'}
      - {$ref: '#/components/parameters/CreatedBefore'}
      - {in: query, name: search, schema: {type: string}, description: Task name or exact task/material/batch ID.}
      - {in: query, name: batch_id, schema: {type: integer, minimum: 1}}
      - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
      - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Exact server-paged scoped task results, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties: {errcode: {type: integer}, message: {type: string}, logid: {type: string}, data: {$ref: '#/components/schemas/ComposeTaskPage'}}
        '400': {description: Invalid filter (named compose_task_invalid).}
  /api/v1/compose-tasks/{task_id}:
    get:
      operationId: getComposeTask
      summary: Read one compose task with its snapshot and execution projection.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: ComposeTask.}
        '403': {description: Task is outside the actor's scope.}
        '404': {description: Task absent or outside the actor's scope.}
  /api/v1/compose-tasks/{task_id}/attempts:
    get:
      operationId: listComposeTaskAttempts
      summary: Read one compose task's per-attempt execution records, oldest first.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: '[ComposeTaskAttempt] — one row per attempt, newest last.'}
        '403': {description: Task is outside the actor's scope.}
        '404': {description: Task absent or outside the actor's scope.}
  /api/v1/compose-tasks/{task_id}/retry:
    post:
      operationId: retryComposeTask
      summary: Requeue one failed or cancelled compose task for another execution attempt.
      description: >-
        Senior operators and admins only. The task keeps its creation-time
        snapshot and its attempt history: status returns to pending, attempt
        numbering stays monotonic, and max_attempts is rebased to attempt_count
        plus the full automatic retry quota, so the authorized run again
        tolerates the same number of transient failures. The stale failure code
        and message are cleared (they stay on the closed attempt rows), an audit
        record is written, and a source=manual attempt row is opened. Accepted:
        a cancelled task, or a failed task other than execution_uncertain — an
        uncertain outcome has its own human verification path and must not be
        re-run around it. Anything else answers 409 (PRD §5.8.4/§5.8.5).
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: ComposeTask — status pending again.}
        '403': {description: "Task outside the actor's scope, or the actor is not a senior operator (named compose_task_forbidden)."}
        '404': {description: Task absent or outside the actor's scope.}
        '409': {description: Task is neither cancelled nor a failed task other than execution_uncertain (named compose_task_not_retryable).}
  /api/v1/compose-tasks/{task_id}/uncertain-review:
    post:
      operationId: resolveComposeUncertain
      summary: Verify an uncertain execution and retry the same task.
      description: Admins and same-team senior operators only. The reviewer must independently verify that the old FFmpeg process has
        stopped and no output has been committed, then provide a reviewable evidence note. A guarded transaction records the declaration,
        audit event and manual next attempt, and requeues only a currently failed/execution_uncertain task with no composite output. This
        endpoint does not claim to verify the external process automatically. An unverified task remains failed/execution_uncertain and
        cannot use ordinary retry.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResolveComposeUncertainInput'}}}
      responses:
        '200': {description: ComposeUncertainResolution with the current task projection and persisted review; a Worker may already have
            claimed the requeued task.}
        '400': {description: Missing verification declarations or invalid evidence note (named compose_task_invalid).}
        '403': {description: Actor is neither an admin nor a same-team senior operator (named compose_task_forbidden).}
        '404': {description: Task absent or outside the actor's scope.}
        '409': {description: 'Task changed, was already resolved, or has a committed output (named compose_task_not_retryable).'}
  /api/v1/compose-tasks/{task_id}/cancel:
    post:
      operationId: cancelComposeTask
      summary: Cancel a queued task now, or request cancellation of a running one.
      description: >-
        A pending task flips to cancelled in one write — no worker has claimed
        it, so there is no process to stop. A running task answers 200 with
        cancel_requested set: the worker terminates FFmpeg in a controlled
        stop and disposes temp files before the row becomes cancelled
        (spec §5.4); until then the task keeps reporting running. Only
        success, failed and cancelled tasks answer 409 (named
        compose_task_not_cancellable).
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: "ComposeTask — status cancelled, or status running with cancel_requested true."}
        '403': {description: Task is outside the actor's scope.}
        '404': {description: Task absent or outside the actor's scope.}
        '409': {description: "Task is terminal (success, failed or cancelled; named compose_task_not_cancellable)."}
  /api/v1/compose-output-materials:
    get:
      operationId: listComposeOutputMaterials
      summary: Group visible successful outputs by material ID across task batches.
      description: Authorization is applied before counts and pagination. Unknown-owner historical rows are visible only to authorized managers. Configuration
        and target platforms come from frozen task facts; storage keys are never returned.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - in: query
        name: material_id
        required: false
        description: Exact source material ID.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: batch_id
        required: false
        description: Exact original task batch ID.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: search
        required: false
        description: Stable output name, material title or exact output/material/batch ID.
        schema:
          type: string
      - in: query
        name: category_id
        required: false
        description: Exact category narrowing, never an authorization grant.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: category_ids
        required: false
        description: Comma-separated category IDs; intersected with category_id and authorized scope.
        schema:
          type: string
      - in: query
        name: team_id
        required: false
        description: Administrator target team; other roles remain within their team.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: operator_id
        required: false
        description: Responsible operator; ordinary operators remain pinned to themselves.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: operator_scope
        required: false
        description: mine, team or administrator-only all; unknown owners are manager-only.
        schema:
          type: string
      - in: query
        name: trigger_type
        required: false
        description: manual, immediate or scheduled.
        schema:
          type: string
          enum:
          - manual
          - immediate
          - scheduled
      - in: query
        name: platform
        required: false
        description: Frozen target platform; bilibili, baidu or xiaohongshu.
        schema:
          type: string
          enum:
          - bilibili
          - baidu
          - xiaohongshu
      - in: query
        name: video_status
        required: false
        description: Verified ready, failed or unknown. Device download facts are never Cloud filters.
        schema:
          type: string
          enum:
          - ready
          - failed
          - unknown
      - in: query
        name: created_from
        required: false
        description: Inclusive generation timestamp.
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        required: false
        description: Exclusive generation timestamp.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Authorized server page.
          content:
            application/json:
              schema:
                type: object
                required:
                - errcode
                - message
                - data
                - logid
                properties:
                  errcode:
                    type: integer
                  message:
                    type: string
                  logid:
                    type: string
                  data:
                    $ref: '#/components/schemas/ComposeOutputMaterialPage'
        '400':
          description: Invalid filter.
        '403':
          description: Requested scope is not authorized.
        '503':
          description: Storage verification could not complete; no guessed availability or total is returned.
  /api/v1/compose-outputs:
    get:
      operationId: listComposeOutputs
      summary: List visible output assets with verified availability.
      description: Authorization is applied before counts and pagination. Unknown-owner historical rows are visible only to authorized managers. Configuration
        and target platforms come from frozen task facts; storage keys are never returned.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - in: query
        name: material_id
        required: false
        description: Exact source material ID.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: batch_id
        required: false
        description: Exact original task batch ID.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: search
        required: false
        description: Stable output name, material title or exact output/material/batch ID.
        schema:
          type: string
      - in: query
        name: category_id
        required: false
        description: Exact category narrowing, never an authorization grant.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: category_ids
        required: false
        description: Comma-separated category IDs; intersected with category_id and authorized scope.
        schema:
          type: string
      - in: query
        name: team_id
        required: false
        description: Administrator target team; other roles remain within their team.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: operator_id
        required: false
        description: Responsible operator; ordinary operators remain pinned to themselves.
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: operator_scope
        required: false
        description: mine, team or administrator-only all; unknown owners are manager-only.
        schema:
          type: string
      - in: query
        name: trigger_type
        required: false
        description: manual, immediate or scheduled.
        schema:
          type: string
          enum:
          - manual
          - immediate
          - scheduled
      - in: query
        name: platform
        required: false
        description: Frozen target platform; bilibili, baidu or xiaohongshu.
        schema:
          type: string
          enum:
          - bilibili
          - baidu
          - xiaohongshu
      - in: query
        name: video_status
        required: false
        description: Verified ready, failed or unknown. Device download facts are never Cloud filters.
        schema:
          type: string
          enum:
          - ready
          - failed
          - unknown
      - in: query
        name: created_from
        required: false
        description: Inclusive generation timestamp.
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        required: false
        description: Exclusive generation timestamp.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Authorized server page.
          content:
            application/json:
              schema:
                type: object
                required:
                - errcode
                - message
                - data
                - logid
                properties:
                  errcode:
                    type: integer
                  message:
                    type: string
                  logid:
                    type: string
                  data:
                    $ref: '#/components/schemas/ComposeOutputPage'
        '400':
          description: Invalid filter.
        '403':
          description: Requested scope is not authorized.
        '503':
          description: Storage verification could not complete; no guessed availability or total is returned.
  /api/v1/compose-outputs/{output_id}:
    get:
      operationId: getComposeOutput
      summary: Read one compose output with its source traceability.
      description: >-
        The detail carries the full source chain the row was written with —
        material, material usage, the strategy binding with the task's frozen
        config snapshot, the task itself, and the file facts. Traceability is
        read-side projection only: the referenced rows answer as they are now,
        while template_code, template_version and the snapshot stay the frozen
        creation facts.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '200': {description: '{output: ComposeOutput, trace: ComposeOutputTrace}.'}
        '403': {description: Output is outside the actor's scope (named compose_output_forbidden).}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
        '503': {description: Storage verification failed (named compose_output_verification_failed); no guessed availability is returned.}
  /api/v1/compose-outputs/{output_id}/video-url:
    get:
      operationId: getComposeOutputVideoURL
      summary: Read a signed cloud address for a compose output's video.
      description: >-
        Same boundary as the material video-url: the only endpoint that hands
        out the address, checked against the actor's scope, a short-lived
        presigned GET for the one object, no expiry published here — a caller
        asks again rather than holding one. The object is verified with Stat before signing; missing objects are refused and storage errors are not treated as absence.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '200': {description: '{url: string} — a signed address, valid for the configured grant lifetime.'}
        '403': {description: Output is outside the actor's scope (named compose_output_forbidden).}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
        '409': {description: Output file is missing or unavailable (named compose_output_unavailable).}
        '503': {description: Storage verification failed (named compose_output_verification_failed).}
  /api/v1/compose-outputs/{output_id}/downloads:
    post:
      operationId: createOutputDownload
      summary: Create one current-session Local Agent user-download transfer task for a compose output.
      description: >-
        Same queue and Drawer as the material download (CHG-20261013-085): one
        `file_transfer_task` row with `asset_type=composite_output`, assigned to the
        actor's trusted Local Agent node. The object is checked before queueing. Unlike material input, missing output objects are not automatically regenerated. The scope gate
        is the page's own — absent and out-of-scope both answer the 404.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '202': {description: A pending local-agent file transfer task.}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
        '409': {description: 'No bound Local Agent node is available, or the output file is unavailable (named compose_output_unavailable).'}
        '503': {description: Storage verification failed (named compose_output_verification_failed).}
  /api/v1/materials:
    get:
      operationId: listMaterials
      summary: List the team's public material library, optionally narrowed by category and usage dimensions.
      description: The library is the team's public selection pool, not each operator's own working set. An ordinary or senior operator
        sees every material in their team regardless of which categories they are responsible for; a category is a filter, not a visibility
        boundary. An administrator must name the target team to read one team's library. Each material carries the viewer's own relation
        (`usage_status` / `added_at`), whether the viewer has produced a successful output from it (`my_usage`), and the team's known
        use (`usage`). Those three dimensions are independent and are also accepted as filters. Each material also names who put it into
        the library (`created_by`, `created_by_name`), a fact about the material that every role reads. "My Materials" remains the personal
        working set and is read from `/api/v1/my-materials`. Selector context enforces the strategy team and exact category even for administrators;
        defaults usage filters to all and never filters on local downloads or cloud readiness. Known inaccessible sources require a usable
        cloud input. The viewer success facts remain the actor even while selecting for another owner.
      security: [{sessionCookie: []}]
      parameters:
      - {in: query, name: search, required: false, description: 'Material ID, title, platform content ID or author name substring.', schema: {
          type: string, maxLength: 100}}
      - {in: query, name: team_id, required: false, description: Target team. Administrators may name any team; an ordinary or senior
          operator is pinned to their own team and naming another answers 403., schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: category_ids, required: false, description: 'One or more exact numeric category IDs, comma separated (at most
          50). Narrows the list; it does not restrict visibility.', schema: {type: string}}
      - {in: query, name: category_id, required: false, description: 'Exact category ID, combined with `category_ids` when both are present.',
        schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: joined, required: false, description: '`joined`: the viewer has an active material usage. `not_joined`: no active
          usage, which includes a relation that was removed.', schema: {type: string, enum: [joined, not_joined]}}
      - {in: query, name: my_usage, required: false, description: '`used`: the viewer is the operator of at least one successful composite
          output. `unused`: no such output.', schema: {type: string, enum: [used, unused]}}
      - {in: query, name: team_usage, required: false, description: '`used`: at least one successful composite output has a known operator.
          `unused`: no such output. Historical outputs without an operator count as an output but not as known use.', schema: {type: string,
          enum: [used, unused]}}
      - {in: query, name: video_status, required: false, description: Exact source-video preparation state., schema: {type: string, enum: [
            not_downloaded, downloading, ready, failed]}}
      - {in: query, name: sort_by, required: false, schema: {type: string, enum: [id, published_at, created_at, updated_at, view_count,
            like_count, favorite_count], default: published_at}}
      - {in: query, name: sort_order, required: false, schema: {type: string, enum: [asc, desc], default: desc}}
      - {in: query, name: strategy_id, schema: {type: integer, minimum: 1}, description: Authorized selector context; fixes team and exact
          category to this readable enabled strategy.}
      - {in: query, name: operator_id, schema: {type: integer, minimum: 1}, description: Required with strategy_id and must equal its
          valid assigned operator. Without selector context the field is forbidden.}
      - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
      - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      - {in: query, name: published_from, schema: {type: string, format: date-time}, description: Inclusive publication boundary.}
      - {in: query, name: published_before, schema: {type: string, format: date-time}, description: Exclusive publication boundary.}
      - {in: query, name: view_count_min, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never satisfy
          the bound.}
      - {in: query, name: view_count_max, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never satisfy
          the bound.}
      - {in: query, name: like_count_min, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never satisfy
          the bound.}
      - {in: query, name: like_count_max, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never satisfy
          the bound.}
      - {in: query, name: favorite_count_min, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never
          satisfy the bound.}
      - {in: query, name: favorite_count_max, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never
          satisfy the bound.}
      responses:
        '200':
          description: Server-paged matching rows and exact total, ordered by publication time descending by default.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties: {errcode: {type: integer}, message: {type: string}, logid: {type: string}, data: {$ref: '#/components/schemas/MaterialPage'}}
        '400': {description: Invalid filter value.}
        '403': {description: Actor is disabled or names another team.}
  /api/v1/materials/{material_id}:
    get:
      operationId: getMaterial
      summary: Read one visible material with the viewer's relation and the team's use summary.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: Visible material.}
        '403': {description: Material is outside the actor's team.}
        '404': {description: Material does not exist.}
  /api/v1/materials/{material_id}/usages:
    post:
      operationId: addMaterialUsage
      summary: Join or restore a personal material, or explicitly confirm authorized owner selection.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses: {'200': {description: Existing active usage returned.}, '201': {description: New or restored active usage returned.},
        '400': {description: Malformed selector context.}, '403': {description: 'Unauthorized owner, team or category context.'}, '409': {
          description: Material source unavailable and no usable cloud input.}}
      description: 'Without context this preserves the logged-in user join-only behavior and does not prepare video. With strategy_id/operator_id
        this confirms selection: verify strategy, owner, team and exact category, join or restore that owner relation, then ensure deduplicated
        Cloud preparation when needed. Cancellation and all reads produce no mutations. Local download permission remains scoped to the
        logged-in downloader.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              dependentRequired: {strategy_id: [operator_id], operator_id: [strategy_id]}
              properties: {strategy_id: {type: integer, minimum: 1}, operator_id: {type: integer, minimum: 1}}
  /api/v1/my-materials:
    get:
      operationId: listMyMaterialUsages
      summary: Read paged personal material relations, or an authorized strategy operator workset.
      description: Independent browsing remains the logged-in user only and defaults to active plus removed relations; usage_status narrows
        it. In selector context only active relations of the nominated strategy operator are returned. My-use facts always refer to the
        logged-in actor and team-use includes that actor. Reads never join materials or start preparation; owner context grants no local-file
        or download permission.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Server-paged matching rows and exact total, ordered by publication time descending by default.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties: {errcode: {type: integer}, message: {type: string}, logid: {type: string}, data: {$ref: '#/components/schemas/MaterialUsagePage'}}
      parameters:
      - {in: query, name: search, required: false, description: 'Material ID, title, platform content ID or author name substring.', schema: {
          type: string, maxLength: 100}}
      - {in: query, name: team_id, required: false, description: Target team. Administrators may name any team; an ordinary or senior
          operator is pinned to their own team and naming another answers 403., schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: category_ids, required: false, description: 'One or more exact numeric category IDs, comma separated (at most
          50). Narrows the list; it does not restrict visibility.', schema: {type: string}}
      - {in: query, name: category_id, required: false, description: 'Exact category ID, combined with `category_ids` when both are present.',
        schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: joined, required: false, description: '`joined`: the viewer has an active material usage. `not_joined`: no active
          usage, which includes a relation that was removed.', schema: {type: string, enum: [joined, not_joined]}}
      - {in: query, name: my_usage, required: false, description: '`used`: the viewer is the operator of at least one successful composite
          output. `unused`: no such output.', schema: {type: string, enum: [used, unused]}}
      - {in: query, name: team_usage, required: false, description: '`used`: at least one successful composite output has a known operator.
          `unused`: no such output. Historical outputs without an operator count as an output but not as known use.', schema: {type: string,
          enum: [used, unused]}}
      - {in: query, name: video_status, required: false, description: Exact source-video preparation state., schema: {type: string, enum: [
            not_downloaded, downloading, ready, failed]}}
      - {in: query, name: sort_by, required: false, schema: {type: string, enum: [id, published_at, created_at, updated_at, view_count,
            like_count, favorite_count], default: published_at}}
      - {in: query, name: sort_order, required: false, schema: {type: string, enum: [asc, desc], default: desc}}
      - {in: query, name: strategy_id, schema: {type: integer, minimum: 1}, description: Authorized selector context; fixes team and exact
          category to this readable enabled strategy.}
      - {in: query, name: operator_id, schema: {type: integer, minimum: 1}, description: Required with strategy_id and must equal its
          valid assigned operator. Without selector context the field is forbidden.}
      - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
      - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      - {in: query, name: published_from, schema: {type: string, format: date-time}, description: Inclusive publication boundary.}
      - {in: query, name: published_before, schema: {type: string, format: date-time}, description: Exclusive publication boundary.}
      - {in: query, name: view_count_min, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never satisfy
          the bound.}
      - {in: query, name: view_count_max, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never satisfy
          the bound.}
      - {in: query, name: like_count_min, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never satisfy
          the bound.}
      - {in: query, name: like_count_max, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never satisfy
          the bound.}
      - {in: query, name: favorite_count_min, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never
          satisfy the bound.}
      - {in: query, name: favorite_count_max, schema: {type: integer, minimum: 0}, description: Inclusive range; unknown counts never
          satisfy the bound.}
      - {in: query, name: usage_status, schema: {type: string, enum: [active, removed, all], default: all}, description: Normal personal
          browsing only. Selector context always uses active relations.}
  /api/v1/material-usages/{usage_id}:
    delete:
      operationId: removeMaterialUsage
      summary: Soft-remove the current user's active material usage.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/UsageID'}]
      responses:
        '204': {description: Usage removed without deleting material or history.}
  /api/v1/material-usages/{usage_id}/restore:
    post:
      operationId: restoreMaterialUsage
      summary: Put the current user's given-up material usage back into use.
      description: >-
        The inverse of removeMaterialUsage, on the same row: the relation returns
        to `active` and `removed_at` is cleared in one write. Addressed by usage
        id and scoped to the calling user, so another operator's row answers 404
        rather than being restored. Already being in use is not an error — the
        call asked for that state, and the second click of a double-click is the
        ordinary way to ask twice.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/UsageID'}]
      responses:
        '204': {description: "Usage in use again, with no removal timestamp."}
        '403': {description: The usage's material is outside the actor's scope.}
        '404': {description: No such usage for this user.}
  /api/v1/materials/{material_id}/video-url:
    get:
      operationId: getMaterialVideoURL
      summary: Read a signed cloud address for a prepared material's video.
      description: >-
        The only endpoint that hands out the cloud video address. The material
        list and the material body never carry it; the detail drawer asks here,
        after the actor's scope has been checked and only once the video is
        ready. The address is a short-lived presigned GET grant for the one
        object — the bucket refuses anonymous reads, so an unsigned address is
        one the server has already proven a browser cannot open. Because it
        expires, a caller must ask again rather than hold one: the drawer
        requests it on the click that opens it, rather than when the drawer
        opens. The lifetime is an operational setting, not part of this body,
        and no expiry is published here.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: '{url: string} — a signed address, valid for the configured grant lifetime.'}
        '403': {description: Material is outside the actor's scope.}
        '404': {description: Material does not exist.}
        '409': {description: The material's video is not prepared yet.}
  /api/v1/materials/{material_id}/downloads:
    post:
      operationId: createMaterialDownload
      summary: Create one current-session Local Agent user-download transfer task from the viewer's own working set.
      description: >-
        Downloading the original video is a personal action from "My Materials",
        not a library action. A material visible in the team's public library is
        not enough: the current user's material usage must be active, so a
        direct call without one fails closed with `material_usage_forbidden`.
        The Cloud worker's source-preparation path does not pass through this
        route and keeps working without a user.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '202': {description: A pending local-agent file transfer task.}
        '403': {description: "Material is outside the actor's team, or the actor has no active material usage (named material_usage_forbidden)."}
        '404': {description: Material does not exist.}
        '409': {description: "No prepared source is available and none can be prepared (named material_unavailable), or no bound Local Agent node is available."}
        # The refusal is the binding, not the heartbeat. A bound node whose machine is
        # asleep yields a queueing task instead: reachability is answered when a lease is
        # claimed, not guessed at click time. (It read "No fresh bound Local Agent node"
        # before 2026.09.27, which is what the Desktop bind/refresh button used to reset.)
  /api/v1/compose-tasks/batch-cancel:
    post:
      operationId: batchCancelComposeTasks
      summary: Cancel authorized tasks from a whole batch or explicit IDs.
      description: Exactly one scope is required. The server enumerates the complete batch independently of loaded pages, fixes the operation
        set and rechecks permission/state per task. Running cancellation is only a request until the worker confirms termination; retry
        retains task/batch identity and snapshots.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ComposeBulkInput'}}}
      responses:
        '200':
          description: Per-item accepted, skipped or failed outcomes.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties: {errcode: {type: integer}, message: {type: string}, logid: {type: string}, data: {$ref: '#/components/schemas/ComposeBulkResult'}}
        '400': {description: Invalid or ambiguous operation scope.}
        '404': {description: Batch outside actor scope.}
  /api/v1/compose-task-batches/{batch_id}:
    get:
      operationId: getComposeTaskBatch
      summary: Read batch identity, entire-batch status counts and allowed action counts.
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: batch_id, required: true, schema: {type: integer, minimum: 1}}]
      responses:
        '200':
          description: Batch with whole-batch progress facts and action counts.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties: {errcode: {type: integer}, message: {type: string}, logid: {type: string}, data: {$ref: '#/components/schemas/ComposeTaskBatchDetail'}}
        '404': {description: Batch absent or outside actor scope.}
  /api/v1/compose-tasks/batch-retry:
    post:
      operationId: batchRetryComposeTasks
      summary: Retry authorized tasks from a whole batch or explicit IDs.
      description: Exactly one scope is required. The server enumerates the complete batch independently of loaded pages, fixes the operation
        set and rechecks permission/state per task. Running cancellation is only a request until the worker confirms termination; retry
        retains task/batch identity and snapshots.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ComposeBulkInput'}}}
      responses:
        '200':
          description: Per-item accepted, skipped or failed outcomes.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties: {errcode: {type: integer}, message: {type: string}, logid: {type: string}, data: {$ref: '#/components/schemas/ComposeBulkResult'}}
        '400': {description: Invalid or ambiguous operation scope.}
        '404': {description: Batch outside actor scope.}
  /api/v1/compose-task-batches:
    get:
      operationId: listComposeTaskBatches
      summary: Read authorized task batches with server paging and whole-batch counts.
      security: [{sessionCookie: []}]
      parameters:
      - {in: query, name: status, required: false, schema: {type: string, enum: [pending, running, success, failed, cancelled]}}
      - {in: query, name: trigger_type, required: false, schema: {type: string, enum: [manual, immediate, scheduled]}}
      - {in: query, name: compose_strategy_id, required: false, schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: team_id, required: false, description: Administrators may narrow to one team; operators and seniors are pinned
          to their own., schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: operator_id, required: false, description: Exact responsible operator. Ordinary operators may only name themselves.,
        schema: {type: integer, format: int64, minimum: 1}}
      - {in: query, name: operator_scope, required: false, description: 'mine matches the assigned operator, or the creator of a historical
          unassigned row; team drops the operator narrowing inside the actor''s team; all is administrator-only.', schema: {type: string,
          enum: [mine, team, all]}}
      - {$ref: '#/components/parameters/CreatedFrom'}
      - {$ref: '#/components/parameters/CreatedBefore'}
      - {in: query, name: search, schema: {type: string}, description: Task name or exact task/material/batch ID.}
      - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
      - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Matching real batches and full-batch task counts; local task filters do not alter counts.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties: {errcode: {type: integer}, message: {type: string}, logid: {type: string}, data: {$ref: '#/components/schemas/ComposeTaskBatchPage'}}
        '400': {description: Invalid filters.}
components:
  schemas:
    ComposeTemplate:
      type: object
      additionalProperties: false
      required: [id, code, name, version, schema, status]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        version: {type: integer, minimum: 1}
        schema:
          type: object
          description: Versioned JSON Schema. Each property may declare editable; absent or false means fixed. Required and range validation remains server-side.
          properties:
            properties: {type: object, additionalProperties: {$ref: '#/components/schemas/ComposeTemplateParameter'}}
        status: {type: string, enum: [active, inactive]}
    ComposeOutputSetting:
      type: object
      additionalProperties: false
      description: Independent output group; array order is execution order. Platforms label each copy and do not multiply output count. All parameters are frozen per task.
      required: [name, platforms, copies, params]
      properties:
        key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$', description: "Unique stable group key. Omission generates group_N; reads always include the normalized key."}
        name: {type: string, minLength: 1, maxLength: 120}
        platforms: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {type: string, enum: [bilibili, baidu, xiaohongshu]}}
        copies: {type: integer, minimum: 1, maximum: 20}
        params: {type: object, description: "Complete template config; only parameters explicitly declared editable may differ from template defaults. Fixed values and unknown keys are rejected by the server."}
    ComposeTemplateParameter:
      type: object
      description: Versioned JSON Schema parameter definition. Missing editable means fixed; disabled UI controls do not grant override permission.
      properties:
        type: {type: string}
        title: {type: string}
        description: {type: string}
        default: {}
        minimum: {type: number}
        maximum: {type: number}
        editable: {type: boolean, default: false}
    ComposeConditionDecision:
      type: object
      additionalProperties: false
      required: [field, operator, expected, state]
      properties:
        field: {type: string, enum: [published_at, like_count, favorite_count]}
        operator: {type: string, enum: [eq, gte, lte, lt, recent_hours, recent_days]}
        expected: {oneOf: [{type: integer}, {type: string, format: date-time}]}
        actual: {oneOf: [{type: integer}, {type: string, format: date-time}], description: "Omitted for unknown facts; missing counts are never substituted with zero."}
        state: {type: string, enum: [matched, not_matched, unknown]}
    ComposePreviewMaterial:
      type: object
      additionalProperties: false
      required: [material_id, title, selected, reason]
      properties:
        material_id: {type: integer, format: int64}
        title: {type: string}
        selected: {type: boolean}
        reason: {type: string, description: "Specific selection or refusal reason such as matched, filtered, no_match, metrics_missing, already_executed, operator_unavailable, template_unavailable, per_run_limit or daily_limit. Conditions preserve the exact metric values and comparisons."}
        priority: {type: integer, minimum: 1, description: "Decisive rule priority when applicable. Filters always apply before match rules."}
        conditions: {type: array, items: {$ref: '#/components/schemas/ComposeConditionDecision'}}
    ComposeExecutionPreview:
      type: object
      additionalProperties: false
      required: [strategy, selected_count, estimated_output_count, single_limit, daily_remaining, settings, materials, active_batch, preview_token]
      properties:
        strategy: {$ref: '#/components/schemas/ComposeStrategy'}
        selected_count: {type: integer, minimum: 0, description: "Selected source materials; limits count materials rather than expanded tasks."}
        estimated_output_count: {type: integer, minimum: 0, description: "selected_count multiplied by the sum of setting copies; platforms do not multiply it."}
        single_limit: {type: integer, minimum: 1, maximum: 100}
        daily_remaining: {type: [integer, 'null'], minimum: 0, description: "Null for manual strategies, which have no daily quota. Scheduled run-now shares the scheduled daily material quota."}
        settings: {type: array, items: {$ref: '#/components/schemas/ComposeOutputSetting'}}
        materials: {type: array, items: {$ref: '#/components/schemas/ComposePreviewMaterial'}}
        active_batch: {oneOf: [{$ref: '#/components/schemas/ComposeTaskBatch'}, {type: 'null'}], description: "Existing unfinished batch blocks immediate execution."}
        preview_token: {type: string, description: "Opaque confirmation token for this exact read-only result. Empty when execution is blocked by an active batch. Confirm must revalidate facts and quotas."}
    ComposeTaskBatch:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - team_id
      - category_id
      - operator_id
      - compose_strategy_id
      - trigger_type
      - created_by
      - config_snapshot
      - created_at
      - counts
      - operator_name
      - strategy_name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        team_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
          minimum: 1
        operator_id:
          type:
          - integer
          - 'null'
          format: int64
        compose_strategy_id:
          type: integer
          format: int64
        trigger_type:
          type: string
          enum:
          - manual
          - immediate
          - scheduled
          description: Manual material creation, immediate strategy execution, or scheduled strategy execution.
        created_by:
          type: integer
          format: int64
        config_snapshot:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/ComposeOutputSetting'
          - type: object
            required:
            - settings
            - acceptance
            properties:
              settings:
                type: array
                items:
                  $ref: '#/components/schemas/ComposeOutputSetting'
              acceptance:
                type: array
                items:
                  type: object
                  required:
                  - material_id
                  - code
                  - message
                  properties:
                    material_id:
                      type: integer
                      minimum: 1
                    code:
                      type: string
                    message:
                      type: string
              source_output_id:
                type: integer
                minimum: 1
              source_task_id:
                type: integer
                minimum: 1
          description: Frozen settings and optional manual acceptance outcomes. Guide addresses are redacted; legacy batches may return an empty array.
        created_at:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/ComposeBatchCounts'
        operator_name:
          type: string
          description: Resolved owner display name; empty if unknown.
        strategy_name:
          type: string
          description: Resolved strategy display name.
    BasicCutV1Config:
      type: object
      additionalProperties: false
      required: [start_seconds, end_seconds]
      properties:
        start_seconds: {type: integer, minimum: 0}
        end_seconds: {type: integer, minimum: 1, description: Must exceed start_seconds.}
    GuideV1Config:
      type: object
      additionalProperties: false
      required: [guide_video_url, insert_seconds, guide_duration_seconds, max_duration_seconds]
      properties:
        guide_video_url: {type: string, format: uri, description: Public downloadable HTTPS URL frozen in the task snapshot.}
        insert_seconds: {type: integer, minimum: 0}
        guide_duration_seconds: {type: integer, minimum: 0, description: Zero uses the whole guide video.}
        max_duration_seconds: {type: integer, minimum: 0, description: Zero has no output duration limit.}
    ComposeOperatorOption:
      type: object
      additionalProperties: false
      required: [id, username, nickname, display_name]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        nickname: {type: string}
        display_name: {type: string, description: "Nickname when set, otherwise username."}
    ComposeStrategy:
      type: object
      required: [id, team_id, category_id, operator_id, operator_name, name, compose_template_id, compose_template_version, config, output_settings, execution_mode, schedule, priority_rules, single_limit, daily_limit, next_run_at, status, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        team_id: {type: integer, format: int64}
        category_id: {type: integer, format: int64, minimum: 1}
        operator_id: {type: [integer, 'null'], format: int64, description: Null on historical rows written before assignment existed; never backfilled from created_by.}
        operator_name: {type: string, description: Display name resolved from operator_id; empty when unassigned or no longer resolvable.}
        name: {type: string}
        compose_template_id: {type: integer, format: int64}
        compose_template_version: {type: integer, minimum: 1}
        config:
          oneOf:
            - {$ref: '#/components/schemas/BasicCutV1Config'}
            - {$ref: '#/components/schemas/GuideV1Config'}
        output_settings: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/ComposeOutputSetting'}, description: "Independent groups in saved order. When omitted by legacy requests config supplies one default group; each group stores complete template parameters."}
        execution_mode: {type: string, enum: [manual, immediate, scheduled]}
        schedule:
          oneOf:
            - {$ref: '#/components/schemas/ComposeSchedule'}
            - {type: 'null'}
        priority_rules: {type: array, items: {$ref: '#/components/schemas/ComposePriorityRule'}}
        single_limit: {type: integer, minimum: 1, maximum: 100}
        daily_limit: {type: integer, minimum: 0, maximum: 1000, description: "Required positive for scheduled strategies; manual strategies have no daily limit and persist zero."}
        next_run_at: {type: [string, 'null'], format: date-time, description: UTC time; null unless the enabled strategy uses scheduled execution.}
        status: {type: string, enum: [enabled, disabled]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ComposeSchedule:
      type: object
      additionalProperties: false
      required: [mode, timezone]
      properties:
        mode: {type: string, enum: [interval, daily]}
        interval_minutes: {type: integer, minimum: 1, maximum: 1440, description: Required for interval mode; absent for other modes.}
        daily_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Required for daily mode; absent for other modes.}
        timezone: {type: string, description: "IANA timezone, default Asia/Shanghai in the editor."}
    ComposePriorityRule:
      type: object
      description: All filter groups apply first regardless of priority; match groups then run in ascending priority. Missing facts use three-valued all/any logic and never become zero.
      additionalProperties: false
      required: [priority, action, logic, conditions]
      properties:
        priority: {type: integer, minimum: 1}
        action: {type: string, enum: [match, filter]}
        logic: {type: string, enum: [all, any]}
        conditions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ComposeCondition'}}
    ComposeCondition:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field: {type: string, enum: [published_at, like_count, favorite_count]}
        operator: {type: string, enum: [eq, gte, lte, lt, recent_hours, recent_days], description: Server validates allowed operators by field.}
        value: {oneOf: [{type: integer, minimum: 0}, {type: string, format: date-time}], description: "Integer for counts, recent_hours (1-8760) or recent_days (1-365); RFC3339 date-time for published_at gte/lt. Recent intervals roll backward from the execution instant."}
    ComposeMaterialState:
      type: object
      additionalProperties: false
      required: [material_id, success_count, active_count, failed_count, cancelled_count, last_task_at]
      properties: {material_id: {type: integer, format: int64}, success_count: {type: integer, minimum: 0}, active_count: {type: integer,
          minimum: 0}, failed_count: {type: integer, minimum: 0}, cancelled_count: {type: integer, minimum: 0}, last_task_at: {type: [string,
            'null'], format: date-time}}
      description: Read-only history for confirmation; previous production may be made again using a new command and batch.
    ComposeScheduleRun:
      type: object
      required: [batch_id, run_key, compose_strategy_id, trigger_type, schedule_slot, candidate_count, created_count, skipped, created_at]
      properties:
        batch_id: {type: [integer, 'null'], format: int64, description: "Actual created batch ID; null for zero-task or historical runs."}
        run_key: {type: string}
        compose_strategy_id: {type: integer, format: int64}
        trigger_type: {type: string, enum: [manual, immediate, scheduled]}
        schedule_slot: {type: string, format: date-time}
        candidate_count: {type: integer, minimum: 0}
        created_count: {type: integer, minimum: 0}
        skipped:
          type: array
          items:
            type: object
            required: [material_id, reason]
            properties:
              material_id: {type: integer, format: int64}
              reason: {type: string}
        created_at: {type: string, format: date-time}
    ComposeScheduleRunHistoryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ComposeScheduleRunHistoryItem'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 50}
    ComposeScheduleRunHistoryItem:
      allOf:
        - {$ref: '#/components/schemas/ComposeScheduleRun'}
        - {type: object, required: [failed_count], properties: {failed_count: {type: integer, minimum: 0}}}
    ComposeBatchCounts:
      type: object
      required: [pending, running, success, failed, cancelled]
      properties:
        pending: {type: integer, minimum: 0, description: Tasks of this run still waiting for a worker.}
        running: {type: integer, minimum: 0, description: Tasks of this run currently executing.}
        success: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        cancelled: {type: integer, minimum: 0}
      description: Counts over every authorized task in the real batch, independent of local filters. Ended progress is (success+failed+cancelled)/total;
        success rate remains separate.
    ComposeBatchView:
      type: object
      required: [run, tasks, counts]
      properties:
        run: {$ref: '#/components/schemas/ComposeScheduleRun'}
        tasks: {type: array, items: {$ref: '#/components/schemas/ComposeTask'}, description: 'Every task the run created for its slot, ordered by material_id.'}
        counts: {$ref: '#/components/schemas/ComposeBatchCounts'}
    CreateComposeStrategy:
      type: object
      additionalProperties: false
      required: [category_id, operator_id, name, compose_template_id, compose_template_version, execution_mode, schedule, priority_rules, single_limit]
      anyOf: [{required: [output_settings]}, {required: [config]}]
      allOf:
        - if: {properties: {execution_mode: {const: scheduled}}}
          then: {required: [daily_limit], properties: {daily_limit: {minimum: 1}}}
      properties:
        team_id: {type: integer, format: int64, description: Required for administrators; senior operators use their own team.}
        category_id: {type: integer, format: int64, minimum: 1}
        operator_id: {type: integer, format: int64, minimum: 1, description: An enabled operator or senior_operator on the team who is responsible for the category.}
        name: {type: string}
        compose_template_id: {type: integer, format: int64}
        compose_template_version: {type: integer, minimum: 1}
        config:
          oneOf:
            - {$ref: '#/components/schemas/BasicCutV1Config'}
            - {$ref: '#/components/schemas/GuideV1Config'}
        output_settings: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/ComposeOutputSetting'}, description: "Independent groups in saved order. When omitted by legacy requests config supplies one default group; each group stores complete template parameters."}
        execution_mode: {type: string, enum: [manual, immediate, scheduled]}
        schedule: {oneOf: [{$ref: '#/components/schemas/ComposeSchedule'}, {type: 'null'}]}
        priority_rules: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ComposePriorityRule'}}
        single_limit: {type: integer, minimum: 1, maximum: 100}
        daily_limit: {type: integer, minimum: 0, maximum: 1000, description: "Required positive for scheduled strategies; manual strategies have no daily limit and persist zero."}
    UpdateComposeStrategy:
      type: object
      additionalProperties: false
      required: [name, execution_mode, schedule, priority_rules, single_limit]
      allOf:
        - if: {properties: {execution_mode: {const: scheduled}}}
          then: {required: [daily_limit], properties: {daily_limit: {minimum: 1}}}
      properties:
        operator_id: {type: integer, format: int64, minimum: 1, description: Optional reassignment; omitted keeps the current operator. An enabled strategy must end the edit with a valid assignee.}
        name: {type: string}
        config:
          oneOf:
            - {$ref: '#/components/schemas/BasicCutV1Config'}
            - {$ref: '#/components/schemas/GuideV1Config'}
        output_settings: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/ComposeOutputSetting'}, description: "Independent groups in saved order. When omitted existing stored groups are preserved; legacy single-config strategies use config as the default group. Each group stores complete template parameters."}
        execution_mode: {type: string, enum: [manual, immediate, scheduled]}
        schedule: {oneOf: [{$ref: '#/components/schemas/ComposeSchedule'}, {type: 'null'}]}
        priority_rules: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ComposePriorityRule'}}
        single_limit: {type: integer, minimum: 1, maximum: 100}
        daily_limit: {type: integer, minimum: 0, maximum: 1000, description: "Required positive for scheduled strategies; manual strategies have no daily limit and persist zero."}
    CopyComposeStrategy:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
    ComposeStrategyStatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [enabled, disabled]}
    CreateComposeTasks:
      type: object
      additionalProperties: false
      required:
      - name
      oneOf:
      - required:
        - strategy_id
        - request_key
        - material_ids
        not:
          anyOf:
          - required:
            - source_output_id
          - required:
            - items
      - required:
        - strategy_id
        - items
        not:
          anyOf:
          - required:
            - source_output_id
          - required:
            - material_ids
      - required:
        - request_key
        - source_output_id
        - remake_confirmed
        properties:
          remake_confirmed:
            const: true
        not:
          anyOf:
          - required:
            - material_ids
          - required:
            - items
          - required:
            - config_override
      properties:
        strategy_id:
          type: integer
          format: int64
          minimum: 1
        operator_id:
          type: integer
          format: int64
          minimum: 1
          description: Optional echo of the valid strategy owner; cannot reassign it.
        name:
          type: string
          minLength: 1
          maxLength: 60
        request_key:
          type: string
          minLength: 8
          maxLength: 64
          description: Whole-command idempotency key scoped to the actor. Same key and content replay; different content conflicts.
        material_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
        setting_overrides:
          type: array
          items:
            $ref: '#/components/schemas/ComposeSettingOverride'
        remake_confirmed:
          type: boolean
          default: false
          description: Explicitly acknowledge previous successful or unfinished production before creating another batch.
        config_override:
          type: object
          deprecated: true
          description: Legacy parameter override for a single setting; cannot be combined with setting_overrides. Editable parameter validation still applies.
        items:
          type: array
          minItems: 1
          maxItems: 50
          deprecated: true
          description: Legacy material/request_key adapter; cannot be combined with material_ids.
          items:
            $ref: '#/components/schemas/CreateComposeTaskItem'
        source_output_id:
          type: integer
          format: int64
          minimum: 1
          description: Remake from one authorized original output/task group and template version; exactly one copy. Incompatible with material_ids/items/config_override.
            The server derives source owner/strategy/material and validates any echoes.
      description: Normal manual creation expands the strategy groups. source_output_id remakes exactly the original group as one copy with its final frozen
        parameters; only explicit editable original-template parameters may be overridden. New requests revalidate active strategy, unchanged owner/team/category
        and deployable original template. Idempotent replay precedes mutable current-state checks.
    CreateComposeTaskItem:
      type: object
      additionalProperties: false
      required: [material_id, request_key]
      properties:
        material_id: {type: integer, format: int64}
        request_key: {type: string, minLength: 8, maxLength: 64, description: Client-generated idempotency key; globally unique once stored.}
    ComposeOutput:
