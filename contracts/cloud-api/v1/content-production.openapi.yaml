openapi: 3.1.0
info:
  title: WT Media Cloud Content Production API
  version: 2026.10.17.1
  description: Cloud content production API. Every response uses the Cloud errcode/message/data/logid envelope.
paths:
  /api/v1/compose-templates:
    get:
      operationId: listComposeTemplates
      summary: Read published active compose template versions.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Published active template versions.}
        '403': {description: Actor cannot read the template catalog.}
  /api/v1/compose-strategies:
    get:
      operationId: listComposeStrategies
      summary: List strategies in the actor's team and game scope; operators see only enabled strategies.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Visible strategies with their fixed template version and current config.}
    post:
      operationId: createComposeStrategy
      summary: Senior operator creates a strategy bound to one active template version.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateComposeStrategy'}
      responses:
        '201': {description: Created strategy, read back from storage.}
        '400': {description: Invalid input or config outside the bound template schema.}
        '403': {description: Actor cannot manage the target team or game.}
        '409': {description: Template version is inactive or not executable.}
  /api/v1/compose-strategies/{strategy_id}:
    get:
      operationId: getComposeStrategy
      summary: Read one visible strategy.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200': {description: Strategy in the actor's scope.}
        '404': {description: Strategy absent or outside the actor's scope.}
    put:
      operationId: updateComposeStrategy
      summary: Senior operator updates the current config, execution settings and conditions without changing the bound template version.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateComposeStrategy'}
      responses:
        '200': {description: Updated current strategy.}
        '400': {description: Invalid input or config outside the bound template schema.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-strategies/{strategy_id}/copy:
    post:
      operationId: copyComposeStrategy
      summary: Senior operator copies a strategy while retaining its template binding and config.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopyComposeStrategy'}
      responses:
        '201': {description: New independent strategy.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
        '409': {description: Bound template version is no longer active.}
  /api/v1/compose-strategies/{strategy_id}/status:
    patch:
      operationId: setComposeStrategyStatus
      summary: Senior operator enables or disables a strategy.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComposeStrategyStatusChange'}
      responses:
        '200': {description: Strategy with updated status.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-strategies/next-run-preview:
    post:
      operationId: previewComposeStrategyNextRun
      summary: Compute the next execution time from a draft plan using the scheduler algorithm, without saving it.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComposeSchedule'}
      responses:
        '200': {description: Object with next_run_at computed at request time.}
        '400': {description: Invalid schedule fields.}
        '403': {description: Actor cannot manage strategies.}
  /api/v1/compose-strategies/{strategy_id}/run-now:
    post:
      operationId: runComposeStrategyNow
      summary: Start one immediate selection and queue pass without moving next_run_at.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_key]
              properties:
                request_key: {type: string, minLength: 8, maxLength: 64, description: Stable client idempotency key for this command.}
      responses:
        '200': {description: ComposeScheduleRun with per-material skip reasons.}
        '400': {description: Invalid request or strategy has no plan.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-strategies/{strategy_id}/runs:
    get:
      operationId: listComposeStrategyRuns
      summary: Read the latest 20 schedule runs and per-material skip reasons in the actor's strategy scope.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200':
          description: Latest persisted schedule runs, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ComposeScheduleRun'}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-strategies/{strategy_id}/material-states:
    get:
      operationId: listComposeStrategyMaterialStates
      summary: Read what one strategy has done with each of the given materials, for the create drawer's 未使用过/已使用过 split.
      description: >-
        The decision behind the split is "does this strategy already have a task
        row for this material", whatever that task's status: any of the four
        counts above zero reads as 已使用过 and stays read-only, and all four at
        zero is the only shape a create accepts — running a pair again is the
        retry action on its task. A pair never used at all is answered with
        zeros, so the response always holds one entry per requested id,
        ascending by material_id — a caller must never read "missing" as "never
        used". Read-only; it neither blocks nor reserves a create.
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/StrategyID'}
        - in: query
          name: material_ids
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$'}
          description: Comma-separated material ids, deduplicated by the server. 1-200 ids.
      responses:
        '200':
          description: One entry per requested id, ascending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ComposeMaterialState'}
        '400': {description: material_ids missing, malformed, empty or over 200 ids (named compose_strategy_invalid).}
        '404': {description: Strategy absent or outside the actor's scope (named compose_strategy_not_found).}
  /api/v1/compose-tasks:
    post:
      operationId: createComposeTasks
      summary: Create one queued compose task per material from an active strategy binding.
      description: >-
        One command, one task per item, no shared batch row (PRD §5.4.4/§5.6.5).
        Each item carries a client-generated request_key; a key the server has
        already stored answers the existing task instead of creating a second
        one, so a retried submission is safe. A failed item never stops the
        others — the response splits created from failed per item. The task row
        freezes strategy_id, template_code, template_version and the merged,
        schema-validated config_snapshot at creation; later strategy edits and
        template versions never reach it (ADR-0021). A material whose pair with
        this strategy already has a task row — pending, running, succeeded,
        failed or cancelled — is refused per item (named compose_task_conflict):
        a pair is produced once, and running it again is the retry action on the
        existing task. The drawer's 已使用过 read applies the same rule, so what
        it offers is exactly what the server accepts.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateComposeTasks'}
      responses:
        '200': {description: '{created: [ComposeTask], failed: [{material_id, request_key, errcode, error, message}]}'}
        '400': {description: Command body invalid (named compose_task_invalid).}
        '403': {description: Strategy or a material is outside the actor's scope (named compose_task_forbidden).}
        '404': {description: Strategy absent or outside the actor's scope (named compose_task_not_found).}
        '409': {description: The strategy's bound template version is unavailable (named compose_template_unavailable).}
    get:
      operationId: listComposeTasks
      summary: List compose tasks visible in the current user's scope.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: status, required: false, schema: {type: string, enum: [pending, running, success, failed, cancelled]}}
        - {in: query, name: trigger_type, required: false, schema: {type: string, enum: [manual, scheduled]}}
        - {in: query, name: compose_strategy_id, required: false, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CreatedFrom'}
        - {$ref: '#/components/parameters/CreatedBefore'}
      responses:
        '200': {description: '[ComposeTask] — newest first, at most 200 matches after scoped filters.'}
        '400': {description: Invalid filter (named compose_task_invalid).}
  /api/v1/compose-tasks/{task_id}:
    get:
      operationId: getComposeTask
      summary: Read one compose task with its snapshot and execution projection.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: ComposeTask.}
        '403': {description: Task is outside the actor's scope.}
        '404': {description: Task absent or outside the actor's scope.}
  /api/v1/compose-tasks/{task_id}/attempts:
    get:
      operationId: listComposeTaskAttempts
      summary: Read one compose task's per-attempt execution records, oldest first.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: '[ComposeTaskAttempt] — one row per attempt, newest last.'}
        '403': {description: Task is outside the actor's scope.}
        '404': {description: Task absent or outside the actor's scope.}
  /api/v1/compose-tasks/{task_id}/retry:
    post:
      operationId: retryComposeTask
      summary: Requeue one failed or cancelled compose task for another execution attempt.
      description: >-
        Senior operators and admins only. The task keeps its creation-time
        snapshot and its attempt history: status returns to pending, attempt
        numbering stays monotonic, and max_attempts is rebased to attempt_count
        plus the full automatic retry quota, so the authorized run again
        tolerates the same number of transient failures. The stale failure code
        and message are cleared (they stay on the closed attempt rows), an audit
        record is written, and a source=manual attempt row is opened. Accepted:
        a cancelled task, or a failed task other than execution_uncertain — an
        uncertain outcome has its own administrator verification path and must
        not be re-run around it. Anything else answers 409 (PRD §5.8.4/§5.8.5).
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: ComposeTask — status pending again.}
        '403': {description: Task outside the actor's scope, or the actor is not a senior operator (named compose_task_forbidden).}
        '404': {description: Task absent or outside the actor's scope.}
        '409': {description: Task is neither cancelled nor a failed task other than execution_uncertain (named compose_task_not_retryable).}
  /api/v1/compose-tasks/{task_id}/uncertain-review:
    get:
      operationId: listComposeUncertainReviews
      summary: Read administrator verification records for one visible task.
      description: Admin only. Returns records in attempt order; an empty list means the execution_uncertain failure is still awaiting verification. Records are human declarations, not automated process checks.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: '[ComposeUncertainReview] for the task.'}
        '403': {description: Actor is not an admin (named compose_task_forbidden).}
        '404': {description: Task absent or outside the actor's scope.}
    post:
      operationId: resolveComposeUncertain
      summary: Administrator verifies an uncertain execution and retries the same task.
      description: >-
        Admin only. The administrator must independently verify that the old FFmpeg
        process has stopped and no output has been committed, then provide a
        reviewable evidence note. A guarded transaction records the declaration,
        audit event and manual next attempt, and requeues only a currently
        failed/execution_uncertain task with no composite output. This endpoint
        does not claim to verify the external process automatically. An unverified
        task remains failed/execution_uncertain and cannot use ordinary retry.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveComposeUncertainInput'}
      responses:
        '200': {description: ComposeUncertainResolution with the current task projection and persisted review; a Worker may already have claimed the requeued task.}
        '400': {description: Missing verification declarations or invalid evidence note (named compose_task_invalid).}
        '403': {description: Actor is not an admin (named compose_task_forbidden).}
        '404': {description: Task absent or outside the actor's scope.}
        '409': {description: Task changed, was already resolved, or has a committed output (named compose_task_not_retryable).}
  /api/v1/compose-tasks/{task_id}/cancel:
    post:
      operationId: cancelComposeTask
      summary: Cancel a queued task now, or request cancellation of a running one.
      description: >-
        A pending task flips to cancelled in one write — no worker has claimed
        it, so there is no process to stop. A running task answers 200 with
        cancel_requested set: the worker terminates FFmpeg in a controlled
        stop and disposes temp files before the row becomes cancelled
        (spec §5.4); until then the task keeps reporting running. Only
        success, failed and cancelled tasks answer 409 (named
        compose_task_not_cancellable).
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: ComposeTask — status cancelled, or status running with cancel_requested true.}
        '403': {description: Task is outside the actor's scope.}
        '404': {description: Task absent or outside the actor's scope.}
        '409': {description: Task is terminal (success, failed or cancelled; named compose_task_not_cancellable).}
  /api/v1/compose-outputs:
    get:
      operationId: listComposeOutputs
      summary: List compose outputs visible in the current user's scope.
      description: >-
        The my-outputs page. Scope follows the compose-task shape — admins see
        everything, senior operators their team-and-game scope, operators only
        outputs they created. The response never carries an object address;
        previews go through the video-url endpoint.
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/OutputStatus'}
        - {in: query, name: source, required: false, description: Exact material ID when numeric or material title substring; numeric text also matches titles., schema: {type: string, maxLength: 100}}
        - {$ref: '#/components/parameters/CreatedFrom'}
        - {$ref: '#/components/parameters/CreatedBefore'}
      responses:
        '200': {description: '[ComposeOutput] — newest first, optional source and time filters.'}
        '400': {description: Invalid filter (named compose_output_invalid).}
  /api/v1/compose-outputs/{output_id}:
    get:
      operationId: getComposeOutput
      summary: Read one compose output with its source traceability.
      description: >-
        The detail carries the full source chain the row was written with —
        material, material usage, the strategy binding with the task's frozen
        config snapshot, the task itself, and the file facts. Traceability is
        read-side projection only: the referenced rows answer as they are now,
        while template_code, template_version and the snapshot stay the frozen
        creation facts.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '200': {description: '{output: ComposeOutput, trace: ComposeOutputTrace}.'}
        '403': {description: Output is outside the actor's scope (named compose_output_forbidden).}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
  /api/v1/compose-outputs/{output_id}/archive:
    post:
      operationId: archiveComposeOutput
      summary: Archive a pending-publish compose output.
      description: >-
        One conditional write flips pending_publish to archived. A published
        output refuses (its publish facts belong to the publication domain) and
        an already-archived output refuses the second write; both answer 409
        (named compose_output_not_archivable). Archiving never deletes the
        object or the row.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '200': {description: The archived ComposeOutput, read back from storage.}
        '403': {description: Output is outside the actor's scope (named compose_output_forbidden).}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
        '409': {description: Output is published or already archived (named compose_output_not_archivable).}
  /api/v1/compose-outputs/{output_id}/video-url:
    get:
      operationId: getComposeOutputVideoURL
      summary: Read a signed cloud address for a compose output's video.
      description: >-
        Same boundary as the material video-url: the only endpoint that hands
        out the address, checked against the actor's scope, a short-lived
        presigned GET for the one object, no expiry published here — a caller
        asks again rather than holding one. Every output row already has a
        verified object behind it, so there is no not-prepared refusal.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '200': {description: '{url: string} — a signed address, valid for the configured grant lifetime.'}
        '403': {description: Output is outside the actor's scope (named compose_output_forbidden).}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
  /api/v1/compose-outputs/{output_id}/downloads:
    post:
      operationId: createOutputDownload
      summary: Create one current-session Local Agent user-download transfer task for a compose output.
      description: >-
        Same queue and Drawer as the material download (CHG-20261013-085): one
        `file_transfer_task` row with `asset_type=composite_output`, assigned to the
        actor's trusted Local Agent node. An output always has a verified object behind
        it, so unlike the material there is no cloud-prepare dependency. The scope gate
        is the page's own — absent and out-of-scope both answer the 404.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '202': {description: A pending local-agent file transfer task.}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
        '409': {description: No bound Local Agent node is available.}
  /api/v1/materials:
    get:
      operationId: listMaterials
      summary: List materials visible in the current user's team and game scope.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Visible materials and their video preparation projection.}
  /api/v1/materials/{material_id}:
    get:
      operationId: getMaterial
      summary: Read one visible material.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: Visible material.}
        '403': {description: Material is outside the actor's scope.}
        '404': {description: Material does not exist.}
  /api/v1/materials/{material_id}/usages:
    post:
      operationId: addMaterialUsage
      summary: Idempotently create or restore the current user's material usage.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: Existing active usage returned.}
        '201': {description: New or restored active usage returned.}
  /api/v1/my-materials:
    get:
      operationId: listMyMaterialUsages
      summary: List the current user's material usages, in both states.
      description: >-
        Every relation the user has with a material, not only the ones in use.
        A given-up relation is returned as such — `status: removed` with the
        moment it was given up — because that row is what "My Materials" renders
        as 已放弃 and what its 恢复使用 action addresses. `material` is embedded on
        each usage, so the page needs no second request.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: The user's usages, active and removed, each with its material.}
  /api/v1/material-usages/{usage_id}:
    delete:
      operationId: removeMaterialUsage
      summary: Soft-remove the current user's active material usage.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/UsageID'}]
      responses:
        '204': {description: Usage removed without deleting material or history.}
  /api/v1/material-usages/{usage_id}/restore:
    post:
      operationId: restoreMaterialUsage
      summary: Put the current user's given-up material usage back into use.
      description: >-
        The inverse of removeMaterialUsage, on the same row: the relation returns
        to `active` and `removed_at` is cleared in one write. Addressed by usage
        id and scoped to the calling user, so another operator's row answers 404
        rather than being restored. Already being in use is not an error — the
        call asked for that state, and the second click of a double-click is the
        ordinary way to ask twice.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/UsageID'}]
      responses:
        '204': {description: Usage in use again, with no removal timestamp.}
        '403': {description: The usage's material is outside the actor's scope.}
        '404': {description: No such usage for this user.}
  /api/v1/materials/{material_id}/video-url:
    get:
      operationId: getMaterialVideoURL
      summary: Read a signed cloud address for a prepared material's video.
      description: >-
        The only endpoint that hands out the cloud video address. The material
        list and the material body never carry it; the detail drawer asks here,
        after the actor's scope has been checked and only once the video is
        ready. The address is a short-lived presigned GET grant for the one
        object — the bucket refuses anonymous reads, so an unsigned address is
        one the server has already proven a browser cannot open. Because it
        expires, a caller must ask again rather than hold one: the drawer
        requests it on the click that opens it, rather than when the drawer
        opens. The lifetime is an operational setting, not part of this body,
        and no expiry is published here.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: '{url: string} — a signed address, valid for the configured grant lifetime.'}
        '403': {description: Material is outside the actor's scope.}
        '404': {description: Material does not exist.}
        '409': {description: The material's video is not prepared yet.}
  /api/v1/materials/{material_id}/downloads:
    post:
      operationId: createMaterialDownload
      summary: Create one current-session Local Agent user-download transfer task.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '202': {description: A pending local-agent file transfer task.}
        # The refusal is the binding, not the heartbeat. A bound node whose machine is
        # asleep yields a queueing task instead: reachability is answered when a lease is
        # claimed, not guessed at click time. (It read "No fresh bound Local Agent node"
        # before 2026.09.27, which is what the Desktop bind/refresh button used to reset.)
        '409': {description: No bound Local Agent node is available.}
components:
  schemas:
    ComposeTemplate:
      type: object
      additionalProperties: false
      required: [id, code, name, version, schema, status]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        version: {type: integer, minimum: 1}
        schema: {type: object}
        status: {type: string, enum: [active, inactive]}
    BasicCutV1Config:
      type: object
      additionalProperties: false
      required: [start_seconds, end_seconds]
      properties:
        start_seconds: {type: integer, minimum: 0}
        end_seconds: {type: integer, minimum: 1, description: Must exceed start_seconds.}
    GuideV1Config:
      type: object
      additionalProperties: false
      required: [guide_video_url, insert_seconds, guide_duration_seconds, max_duration_seconds]
      properties:
        guide_video_url: {type: string, format: uri, description: Public downloadable HTTPS URL frozen in the task snapshot.}
        insert_seconds: {type: integer, minimum: 0}
        guide_duration_seconds: {type: integer, minimum: 0, description: Zero uses the whole guide video.}
        max_duration_seconds: {type: integer, minimum: 0, description: Zero has no output duration limit.}
    ComposeStrategy:
      type: object
      required: [id, team_id, game_id, name, compose_template_id, compose_template_version, config, execution_mode, schedule, priority_rules, single_limit, daily_limit, next_run_at, status, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        team_id: {type: integer, format: int64}
        game_id: {type: string}
        name: {type: string}
        compose_template_id: {type: integer, format: int64}
        compose_template_version: {type: integer, minimum: 1}
        config:
          oneOf:
            - {$ref: '#/components/schemas/BasicCutV1Config'}
            - {$ref: '#/components/schemas/GuideV1Config'}
        execution_mode: {type: string, enum: [manual, scheduled]}
        schedule:
          oneOf:
            - {$ref: '#/components/schemas/ComposeSchedule'}
            - {type: 'null'}
        priority_rules: {type: array, items: {$ref: '#/components/schemas/ComposePriorityRule'}}
        single_limit: {type: integer, minimum: 1, maximum: 100}
        daily_limit: {type: integer, minimum: 1, maximum: 1000}
        next_run_at: {type: [string, 'null'], format: date-time, description: UTC time; null unless the enabled strategy uses scheduled execution.}
        status: {type: string, enum: [enabled, disabled]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ComposeSchedule:
      type: object
      additionalProperties: false
      required: [mode, timezone]
      properties:
        mode: {type: string, enum: [interval, daily]}
        interval_minutes: {type: integer, minimum: 1, maximum: 1440, description: Required for interval mode; absent for other modes.}
        daily_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Required for daily mode; absent for other modes.}
        timezone: {type: string, description: IANA timezone, default Asia/Shanghai in the editor.}
    ComposePriorityRule:
      type: object
      additionalProperties: false
      required: [priority, action, logic, conditions]
      properties:
        priority: {type: integer, minimum: 1}
        action: {type: string, enum: [match, filter]}
        logic: {type: string, enum: [all, any]}
        conditions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ComposeCondition'}}
    ComposeCondition:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field: {type: string, enum: [published_at, like_count, favorite_count]}
        operator: {type: string, enum: [eq, gte, lte, lt, recent_hours, recent_days], description: Server validates allowed operators by field.}
        value: {oneOf: [{type: integer, minimum: 0}, {type: string, format: date-time}], description: Integer for counts, recent_hours (1-8760) or recent_days (1-365); RFC3339 date-time for published_at gte/lt. Recent intervals roll backward from the execution instant.}
    ComposeMaterialState:
      type: object
      additionalProperties: false
      required: [material_id, success_count, active_count, failed_count, cancelled_count, last_task_at]
      properties:
        material_id: {type: integer, format: int64}
        success_count: {type: integer, minimum: 0, description: Tasks of this (strategy, material) that reached success. Above zero means the pair is 已使用过.}
        active_count: {type: integer, minimum: 0, description: Tasks of this (strategy, material) still pending or running — the drawer marks the row 排队中 and the create endpoint refuses a new one.}
        failed_count: {type: integer, minimum: 0, description: Failed tasks, shown as 上次失败 in the drawer. Above zero means the pair is 已使用过 and waits for 重试 on its task.}
        cancelled_count: {type: integer, minimum: 0, description: Cancelled tasks, shown as 已取消 in the drawer. Above zero means the pair is 已使用过; re-running it is 重试 on the cancelled task.}
        last_task_at: {type: [string, 'null'], format: date-time, description: Creation time of the newest task of this pair; null when there is none.}
    ComposeScheduleRun:
      type: object
      required: [run_key, compose_strategy_id, trigger_type, schedule_slot, candidate_count, created_count, skipped, created_at]
      properties:
        run_key: {type: string}
        compose_strategy_id: {type: integer, format: int64}
        trigger_type: {type: string, enum: [manual, scheduled]}
        schedule_slot: {type: string, format: date-time}
        candidate_count: {type: integer, minimum: 0}
        created_count: {type: integer, minimum: 0}
        skipped:
          type: array
          items:
            type: object
            required: [material_id, reason]
            properties:
              material_id: {type: integer, format: int64}
              reason: {type: string}
        created_at: {type: string, format: date-time}
    CreateComposeStrategy:
      type: object
      additionalProperties: false
      required: [game_id, name, compose_template_id, compose_template_version, config, execution_mode, schedule, priority_rules, single_limit, daily_limit]
      properties:
        team_id: {type: integer, format: int64, description: Required for administrators; senior operators use their own team.}
        game_id: {type: string}
        name: {type: string}
        compose_template_id: {type: integer, format: int64}
        compose_template_version: {type: integer, minimum: 1}
        config:
          oneOf:
            - {$ref: '#/components/schemas/BasicCutV1Config'}
            - {$ref: '#/components/schemas/GuideV1Config'}
        execution_mode: {type: string, enum: [manual, scheduled]}
        schedule: {oneOf: [{$ref: '#/components/schemas/ComposeSchedule'}, {type: 'null'}]}
        priority_rules: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ComposePriorityRule'}}
        single_limit: {type: integer, minimum: 1, maximum: 100}
        daily_limit: {type: integer, minimum: 1, maximum: 1000}
    UpdateComposeStrategy:
      type: object
      additionalProperties: false
      required: [name, config, execution_mode, schedule, priority_rules, single_limit, daily_limit]
      properties:
        name: {type: string}
        config:
          oneOf:
            - {$ref: '#/components/schemas/BasicCutV1Config'}
            - {$ref: '#/components/schemas/GuideV1Config'}
        execution_mode: {type: string, enum: [manual, scheduled]}
        schedule: {oneOf: [{$ref: '#/components/schemas/ComposeSchedule'}, {type: 'null'}]}
        priority_rules: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ComposePriorityRule'}}
        single_limit: {type: integer, minimum: 1, maximum: 100}
        daily_limit: {type: integer, minimum: 1, maximum: 1000}
    CopyComposeStrategy:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
    ComposeStrategyStatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [enabled, disabled]}
    CreateComposeTasks:
      type: object
      additionalProperties: false
      required: [strategy_id, items]
      properties:
        strategy_id: {type: integer, format: int64}
        name:
          type: string
          maxLength: 60
          description: >-
            Optional label for the whole command. When present, every created
            task is named `<name>-<n>` in submission order, or exactly `name`
            when the command carries a single item; when absent or blank, each
            task keeps its derived material · strategy name.
        config_override:
          type: object
          description: >-
            Optional per-command parameter overrides, merged over the strategy
            config and validated against the bound template version's schema;
            the merge, not the override alone, is what the snapshot stores.
            guide_video_url belongs to the strategy and cannot be overridden by a task.
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/CreateComposeTaskItem'}
    CreateComposeTaskItem:
      type: object
      additionalProperties: false
      required: [material_id, request_key]
      properties:
        material_id: {type: integer, format: int64}
        request_key: {type: string, minLength: 8, maxLength: 64, description: Client-generated idempotency key; globally unique once stored.}
    ComposeOutput:
      type: object
      additionalProperties: false
      required: [id, team_id, game_id, material_id, material_usage_id, compose_task_id, compose_strategy_id, template_code, template_version, file_size_bytes, sha256, media, publish_status, created_by, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        team_id: {type: integer, format: int64}
        game_id: {type: string}
        material_id: {type: integer, format: int64}
        material_usage_id: {type: integer, format: int64}
        compose_task_id: {type: integer, format: int64}
        compose_strategy_id: {type: integer, format: int64}
        template_code: {type: string}
        template_version: {type: integer, minimum: 1}
        file_size_bytes: {type: integer, format: int64, minimum: 1}
        sha256: {type: string}
        media: {type: object, description: 'Media facts the executor verified, currently {duration_ms}.'}
        publish_status: {type: string, enum: [pending_publish, published, archived]}
        created_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ComposeOutputTrace:
      type: object
      additionalProperties: false
      required: [material, material_usage, strategy, compose_task]
      properties:
        material: {type: object, required: [id, title], properties: {id: {type: integer, format: int64}, title: {type: string}}}
        material_usage: {type: object, required: [id, status], properties: {id: {type: integer, format: int64}, status: {type: string, description: active or removed — the usage is history, not a live requirement.}}}
        strategy: {type: object, required: [id, name, template_code, template_version, config_snapshot], properties: {id: {type: integer, format: int64}, name: {type: string}, template_code: {type: string}, template_version: {type: integer, minimum: 1}, config_snapshot: {type: object, description: The task's frozen snapshot, not the strategy's current config.}}}
        compose_task: {type: object, required: [id, status, config_snapshot, created_at], properties: {id: {type: integer, format: int64}, status: {type: string}, config_snapshot: {type: object}, created_at: {type: string, format: date-time}}}
    ComposeOutputDetail:
      type: object
      additionalProperties: false
      required: [output, trace]
      properties:
        output: {$ref: '#/components/schemas/ComposeOutput'}
        trace: {$ref: '#/components/schemas/ComposeOutputTrace'}
    ComposeTask:
      type: object
      required: [id, team_id, game_id, trigger_type, material_id, material_usage_id, compose_strategy_id, template_code, template_version, config_snapshot, status, created_by, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        display_name: {type: string, description: Creation-time material title and strategy name; empty for legacy tasks that cannot be safely reconstructed.}
        team_id: {type: integer, format: int64}
        game_id: {type: string}
        trigger_type: {type: string, enum: [manual, scheduled]}
        material_id: {type: integer, format: int64}
        material_usage_id: {type: integer, format: int64}
        compose_strategy_id: {type: integer, format: int64}
        template_code: {type: string}
        template_version: {type: integer, minimum: 1}
        config_snapshot: {type: object, description: Frozen execution settings projected for readers; guide_video_url is replaced with a redaction label while the stored execution snapshot stays unchanged.}
        status: {type: string, enum: [pending, running, success, failed, cancelled]}
        cancel_requested: {type: boolean, description: A cancel was requested while running; the task stays running until the worker confirms the controlled stop.}
        stage: {type: string, description: Worker phase projection from the bounded set validating_input, waiting_input, cutting, uploading, committing; a pending task carries an empty stage.}
        progress: {type: integer, minimum: 0, maximum: 100}
        error_code: {type: string}
        error_message: {type: string, description: Fixed human-readable error category; raw FFmpeg output, paths and signed URLs are never returned.}
        attempt_count: {type: integer, minimum: 0}
        started_at: {type: string, format: date-time, nullable: true, description: Null until execution starts.}
        finished_at: {type: string, format: date-time, nullable: true, description: Null until the terminal transition.}
        composite_output_id: {type: integer, format: int64, nullable: true, description: Set only after the success transaction commits a verified output; never an object address.}
        created_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ComposeTaskAttempt:
      type: object
      required: [id, compose_task_id, attempt, source, started_at, outcome, stage, error_code, error_message, steps, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        compose_task_id: {type: integer, format: int64}
        attempt: {type: integer, minimum: 1, description: Matches the task's attempt_count for that run.}
        source: {type: string, enum: [auto, manual], description: auto — the worker's own transient retry; manual — an authorized human retry.}
        started_at: {type: string, format: date-time, nullable: true, description: Null until the worker claims the attempt.}
        finished_at: {type: string, format: date-time, nullable: true, description: Null while the attempt is pending or running.}
        outcome: {type: string, enum: [pending, running, success, failed, cancelled]}
        stage: {type: string, description: Last projected phase of the attempt; empty until the worker reports progress.}
        error_code: {type: string}
        error_message: {type: string, description: Fixed human-readable error category; raw FFmpeg output, paths and signed URLs are never returned.}
        steps:
          type: array
          description: >-
            The steps this attempt completed or failed on, in execution order.
            Server-authored labels and allowlisted metrics only — never a source
            address, a storage key, a local path or raw FFmpeg output.
          items: {$ref: '#/components/schemas/ComposeTaskAttemptStep'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ComposeTaskAttemptStep:
      type: object
      additionalProperties: false
      required: [step, label, outcome, started_at, finished_at, duration_ms, error_code, error_label, metrics]
      properties:
        step: {type: string, enum: [validate_input, prepare_input, fetch_guide, cut, upload, commit]}
        label: {type: string, description: Server-authored Chinese label for the step key.}
        outcome: {type: string, enum: [success, failed]}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        duration_ms: {type: integer, minimum: 0}
        error_code: {type: string, description: Empty on a successful step; the bounded failure code on a failed one.}
        error_label: {type: string, description: Fixed human-readable failure category, empty on a successful step.}
        metrics: {$ref: '#/components/schemas/ComposeTaskAttemptStepMetrics'}
    ComposeTaskAttemptStepMetrics:
      type: object
      additionalProperties: false
      properties:
        size_bytes: {type: integer, format: int64, minimum: 1, description: Bytes this step staged or stored.}
        sha256: {type: string, description: Digest of the verified output; 64 lowercase hex characters.}
        output_duration_ms: {type: integer, format: int64, minimum: 1, description: Duration of the composed output the executor reported.}
        output_id: {type: integer, format: int64, minimum: 1, description: Row id of the composite output committed by this step.}
    ResolveComposeUncertainInput:
      type: object
      additionalProperties: false
      required: [old_execution_stopped, no_output_committed, evidence]
      properties:
        old_execution_stopped: {type: boolean, const: true, description: Administrator verified the old FFmpeg process is stopped.}
        no_output_committed: {type: boolean, const: true, description: Administrator verified no output was committed.}
        evidence: {type: string, minLength: 20, maxLength: 2000, description: Reviewable verification note; do not include credentials or signed URLs.}
    ComposeUncertainReview:
      type: object
      additionalProperties: false
      required: [id, compose_task_id, attempt, actor_user_id, evidence, created_at]
      properties:
        id: {type: integer, format: int64}
        compose_task_id: {type: integer, format: int64}
        attempt: {type: integer, minimum: 1, description: The uncertain attempt reviewed before manual retry.}
        actor_user_id: {type: integer, format: int64}
        evidence: {type: string, description: Administrator's verification note, not automated proof.}
        created_at: {type: string, format: date-time}
    ComposeUncertainResolution:
      type: object
      additionalProperties: false
      required: [task, review]
      properties:
        task: {$ref: '#/components/schemas/ComposeTask'}
        review: {$ref: '#/components/schemas/ComposeUncertainReview'}
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  parameters:
    MaterialID: {in: path, name: material_id, required: true, schema: {type: integer, format: int64}}
    UsageID: {in: path, name: usage_id, required: true, schema: {type: integer, format: int64}}
    StrategyID: {in: path, name: strategy_id, required: true, schema: {type: integer, format: int64}}
    TaskID: {in: path, name: task_id, required: true, schema: {type: integer, format: int64}}
    OutputID: {in: path, name: output_id, required: true, schema: {type: integer, format: int64}}
    OutputStatus: {in: query, name: publish_status, required: false, schema: {type: string, enum: [pending_publish, published, archived]}}
    CreatedFrom: {in: query, name: created_from, required: false, description: Inclusive RFC3339 timestamp., schema: {type: string, format: date-time}}
    CreatedBefore: {in: query, name: created_before, required: false, description: Exclusive RFC3339 timestamp; must follow created_from., schema: {type: string, format: date-time}}
