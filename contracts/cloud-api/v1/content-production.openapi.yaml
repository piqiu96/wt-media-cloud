openapi: 3.1.0
info:
  title: WT Media Cloud Content Production API
  version: 2026.10.13.4
  description: Cloud content production API. Every response uses the Cloud errcode/message/data/logid envelope.
paths:
  /api/v1/compose-templates:
    get:
      operationId: listComposeTemplates
      summary: Read published active compose template versions.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Published active template versions.}
        '403': {description: Actor cannot read the template catalog.}
  /api/v1/compose-strategies:
    get:
      operationId: listComposeStrategies
      summary: List strategies in the actor's team and game scope; operators see only active strategies.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Visible strategies with their fixed template version and current config.}
    post:
      operationId: createComposeStrategy
      summary: Senior operator creates a strategy bound to one active template version.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateComposeStrategy'}
      responses:
        '201': {description: Created strategy, read back from storage.}
        '400': {description: Invalid input or config outside the bound template schema.}
        '403': {description: Actor cannot manage the target team or game.}
        '409': {description: Template version is inactive or not executable.}
  /api/v1/compose-strategies/{strategy_id}:
    get:
      operationId: getComposeStrategy
      summary: Read one visible strategy.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200': {description: Strategy in the actor's scope.}
        '404': {description: Strategy absent or outside the actor's scope.}
    put:
      operationId: updateComposeStrategy
      summary: Senior operator updates the current config without changing the bound template version.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateComposeStrategy'}
      responses:
        '200': {description: Updated current strategy.}
        '400': {description: Invalid input or config outside the bound template schema.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-strategies/{strategy_id}/copy:
    post:
      operationId: copyComposeStrategy
      summary: Senior operator copies a strategy while retaining its template binding and config.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopyComposeStrategy'}
      responses:
        '201': {description: New independent strategy.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
        '409': {description: Bound template version is no longer active.}
  /api/v1/compose-strategies/{strategy_id}/status:
    patch:
      operationId: setComposeStrategyStatus
      summary: Senior operator enables or disables a strategy.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComposeStrategyStatusChange'}
      responses:
        '200': {description: Strategy with updated status.}
        '403': {description: Actor cannot manage this strategy.}
        '404': {description: Strategy absent or outside the actor's scope.}
  /api/v1/compose-tasks:
    post:
      operationId: createComposeTasks
      summary: Create one queued compose task per material from an active strategy binding.
      description: >-
        One command, one task per item, no shared batch row (PRD §5.4.4/§5.6.5).
        Each item carries a client-generated request_key; a key the server has
        already stored answers the existing task instead of creating a second
        one, so a retried submission is safe. A failed item never stops the
        others — the response splits created from failed per item. The task row
        freezes strategy_id, template_code, template_version and the merged,
        schema-validated config_snapshot at creation; later strategy edits and
        template versions never reach it (ADR-0021).
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateComposeTasks'}
      responses:
        '200': {description: '{created: [ComposeTask], failed: [{material_id, request_key, errcode, error, message}]}'}
        '400': {description: Command body invalid (named compose_task_invalid).}
        '403': {description: Strategy or a material is outside the actor's scope (named compose_task_forbidden).}
        '404': {description: Strategy absent or outside the actor's scope (named compose_task_not_found).}
        '409': {description: The strategy's bound template version is unavailable (named compose_template_unavailable).}
    get:
      operationId: listComposeTasks
      summary: List compose tasks visible in the current user's scope.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: '[ComposeTask] — newest first, optional status and strategy filters.'}
  /api/v1/compose-tasks/{task_id}:
    get:
      operationId: getComposeTask
      summary: Read one compose task with its snapshot and execution projection.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: ComposeTask.}
        '403': {description: Task is outside the actor's scope.}
        '404': {description: Task absent or outside the actor's scope.}
  /api/v1/compose-tasks/{task_id}/cancel:
    post:
      operationId: cancelComposeTask
      summary: Cancel a queued task now, or request cancellation of a running one.
      description: >-
        A pending task flips to cancelled in one write — no worker has claimed
        it, so there is no process to stop. A running task answers 200 with
        cancel_requested set: the worker terminates FFmpeg in a controlled
        stop and disposes temp files before the row becomes cancelled
        (spec §5.4); until then the task keeps reporting running. Only
        success, failed and cancelled tasks answer 409 (named
        compose_task_not_cancellable).
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      responses:
        '200': {description: ComposeTask — status cancelled, or status running with cancel_requested true.}
        '403': {description: Task is outside the actor's scope.}
        '404': {description: Task absent or outside the actor's scope.}
        '409': {description: Task is terminal (success, failed or cancelled; named compose_task_not_cancellable).}
  /api/v1/compose-outputs:
    get:
      operationId: listComposeOutputs
      summary: List compose outputs visible in the current user's scope.
      description: >-
        The my-outputs page. Scope follows the compose-task shape — admins see
        everything, senior operators their team-and-game scope, operators only
        outputs they created. The response never carries an object address;
        previews go through the video-url endpoint.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputStatus'}]
      responses:
        '200': {description: '[ComposeOutput] — newest first, optional publish_status filter.'}
  /api/v1/compose-outputs/{output_id}:
    get:
      operationId: getComposeOutput
      summary: Read one compose output with its source traceability.
      description: >-
        The detail carries the full source chain the row was written with —
        material, material usage, the strategy binding with the task's frozen
        config snapshot, the task itself, and the file facts. Traceability is
        read-side projection only: the referenced rows answer as they are now,
        while template_code, template_version and the snapshot stay the frozen
        creation facts.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '200': {description: '{output: ComposeOutput, trace: ComposeOutputTrace}.'}
        '403': {description: Output is outside the actor's scope (named compose_output_forbidden).}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
  /api/v1/compose-outputs/{output_id}/archive:
    post:
      operationId: archiveComposeOutput
      summary: Archive a pending-publish compose output.
      description: >-
        One conditional write flips pending_publish to archived. A published
        output refuses (its publish facts belong to the publication domain) and
        an already-archived output refuses the second write; both answer 409
        (named compose_output_not_archivable). Archiving never deletes the
        object or the row.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '200': {description: The archived ComposeOutput, read back from storage.}
        '403': {description: Output is outside the actor's scope (named compose_output_forbidden).}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
        '409': {description: Output is published or already archived (named compose_output_not_archivable).}
  /api/v1/compose-outputs/{output_id}/video-url:
    get:
      operationId: getComposeOutputVideoURL
      summary: Read a signed cloud address for a compose output's video.
      description: >-
        Same boundary as the material video-url: the only endpoint that hands
        out the address, checked against the actor's scope, a short-lived
        presigned GET for the one object, no expiry published here — a caller
        asks again rather than holding one. Every output row already has a
        verified object behind it, so there is no not-prepared refusal.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '200': {description: '{url: string} — a signed address, valid for the configured grant lifetime.'}
        '403': {description: Output is outside the actor's scope (named compose_output_forbidden).}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
  /api/v1/compose-outputs/{output_id}/downloads:
    post:
      operationId: createOutputDownload
      summary: Create one current-session Local Agent user-download transfer task for a compose output.
      description: >-
        Same queue and Drawer as the material download (CHG-20261013-085): one
        `file_transfer_task` row with `asset_type=composite_output`, assigned to the
        actor's trusted Local Agent node. An output always has a verified object behind
        it, so unlike the material there is no cloud-prepare dependency. The scope gate
        is the page's own — absent and out-of-scope both answer the 404.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/OutputID'}]
      responses:
        '202': {description: A pending local-agent file transfer task.}
        '404': {description: Output absent or outside the actor's scope (named compose_output_not_found).}
        '409': {description: No bound Local Agent node is available.}
  /api/v1/materials:
    get:
      operationId: listMaterials
      summary: List materials visible in the current user's team and game scope.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Visible materials and their video preparation projection.}
  /api/v1/materials/{material_id}:
    get:
      operationId: getMaterial
      summary: Read one visible material.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: Visible material.}
        '403': {description: Material is outside the actor's scope.}
        '404': {description: Material does not exist.}
  /api/v1/materials/{material_id}/usages:
    post:
      operationId: addMaterialUsage
      summary: Idempotently create or restore the current user's material usage.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: Existing active usage returned.}
        '201': {description: New or restored active usage returned.}
  /api/v1/my-materials:
    get:
      operationId: listMyMaterialUsages
      summary: List the current user's material usages, in both states.
      description: >-
        Every relation the user has with a material, not only the ones in use.
        A given-up relation is returned as such — `status: removed` with the
        moment it was given up — because that row is what "My Materials" renders
        as 已放弃 and what its 恢复使用 action addresses. `material` is embedded on
        each usage, so the page needs no second request.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: The user's usages, active and removed, each with its material.}
  /api/v1/material-usages/{usage_id}:
    delete:
      operationId: removeMaterialUsage
      summary: Soft-remove the current user's active material usage.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/UsageID'}]
      responses:
        '204': {description: Usage removed without deleting material or history.}
  /api/v1/material-usages/{usage_id}/restore:
    post:
      operationId: restoreMaterialUsage
      summary: Put the current user's given-up material usage back into use.
      description: >-
        The inverse of removeMaterialUsage, on the same row: the relation returns
        to `active` and `removed_at` is cleared in one write. Addressed by usage
        id and scoped to the calling user, so another operator's row answers 404
        rather than being restored. Already being in use is not an error — the
        call asked for that state, and the second click of a double-click is the
        ordinary way to ask twice.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/UsageID'}]
      responses:
        '204': {description: Usage in use again, with no removal timestamp.}
        '403': {description: The usage's material is outside the actor's scope.}
        '404': {description: No such usage for this user.}
  /api/v1/materials/{material_id}/video-url:
    get:
      operationId: getMaterialVideoURL
      summary: Read a signed cloud address for a prepared material's video.
      description: >-
        The only endpoint that hands out the cloud video address. The material
        list and the material body never carry it; the detail drawer asks here,
        after the actor's scope has been checked and only once the video is
        ready. The address is a short-lived presigned GET grant for the one
        object — the bucket refuses anonymous reads, so an unsigned address is
        one the server has already proven a browser cannot open. Because it
        expires, a caller must ask again rather than hold one: the drawer
        requests it on the click that opens it, rather than when the drawer
        opens. The lifetime is an operational setting, not part of this body,
        and no expiry is published here.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: '{url: string} — a signed address, valid for the configured grant lifetime.'}
        '403': {description: Material is outside the actor's scope.}
        '404': {description: Material does not exist.}
        '409': {description: The material's video is not prepared yet.}
  /api/v1/materials/{material_id}/downloads:
    post:
      operationId: createMaterialDownload
      summary: Create one current-session Local Agent user-download transfer task.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '202': {description: A pending local-agent file transfer task.}
        # The refusal is the binding, not the heartbeat. A bound node whose machine is
        # asleep yields a queueing task instead: reachability is answered when a lease is
        # claimed, not guessed at click time. (It read "No fresh bound Local Agent node"
        # before 2026.09.27, which is what the Desktop bind/refresh button used to reset.)
        '409': {description: No bound Local Agent node is available.}
components:
  schemas:
    ComposeTemplate:
      type: object
      additionalProperties: false
      required: [id, code, name, version, schema, status]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        version: {type: integer, minimum: 1}
        schema: {type: object}
        status: {type: string, enum: [active, inactive]}
    BasicCutV1Config:
      type: object
      additionalProperties: false
      required: [start_seconds, end_seconds]
      properties:
        start_seconds: {type: integer, minimum: 0}
        end_seconds: {type: integer, minimum: 1, description: Must exceed start_seconds.}
    ComposeStrategy:
      type: object
      required: [id, team_id, game_id, name, compose_template_id, compose_template_version, config, status, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        team_id: {type: integer, format: int64}
        game_id: {type: string}
        name: {type: string}
        compose_template_id: {type: integer, format: int64}
        compose_template_version: {type: integer, minimum: 1}
        config: {$ref: '#/components/schemas/BasicCutV1Config'}
        status: {type: string, enum: [active, inactive]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateComposeStrategy:
      type: object
      additionalProperties: false
      required: [game_id, name, compose_template_id, compose_template_version, config]
      properties:
        team_id: {type: integer, format: int64, description: Required for administrators; senior operators use their own team.}
        game_id: {type: string}
        name: {type: string}
        compose_template_id: {type: integer, format: int64}
        compose_template_version: {type: integer, minimum: 1}
        config: {$ref: '#/components/schemas/BasicCutV1Config'}
    UpdateComposeStrategy:
      type: object
      additionalProperties: false
      required: [name, config]
      properties:
        name: {type: string}
        config: {$ref: '#/components/schemas/BasicCutV1Config'}
    CopyComposeStrategy:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
    ComposeStrategyStatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [active, inactive]}
    CreateComposeTasks:
      type: object
      additionalProperties: false
      required: [strategy_id, items]
      properties:
        strategy_id: {type: integer, format: int64}
        config_override:
          type: object
          description: >-
            Optional per-command parameter overrides, merged over the strategy
            config and validated against the bound template version's schema;
            the merge, not the override alone, is what the snapshot stores.
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/CreateComposeTaskItem'}
    CreateComposeTaskItem:
      type: object
      additionalProperties: false
      required: [material_id, request_key]
      properties:
        material_id: {type: integer, format: int64}
        request_key: {type: string, minLength: 8, maxLength: 64, description: Client-generated idempotency key; globally unique once stored.}
    ComposeOutput:
      type: object
      additionalProperties: false
      required: [id, team_id, game_id, material_id, material_usage_id, compose_task_id, compose_strategy_id, template_code, template_version, file_size_bytes, sha256, media, publish_status, created_by, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        team_id: {type: integer, format: int64}
        game_id: {type: string}
        material_id: {type: integer, format: int64}
        material_usage_id: {type: integer, format: int64}
        compose_task_id: {type: integer, format: int64}
        compose_strategy_id: {type: integer, format: int64}
        template_code: {type: string}
        template_version: {type: integer, minimum: 1}
        file_size_bytes: {type: integer, format: int64, minimum: 1}
        sha256: {type: string}
        media: {type: object, description: 'Media facts the executor verified, currently {duration_ms}.'}
        publish_status: {type: string, enum: [pending_publish, published, archived]}
        created_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ComposeOutputTrace:
      type: object
      additionalProperties: false
      required: [material, material_usage, strategy, compose_task]
      properties:
        material: {type: object, required: [id, title], properties: {id: {type: integer, format: int64}, title: {type: string}}}
        material_usage: {type: object, required: [id, status], properties: {id: {type: integer, format: int64}, status: {type: string, description: active or removed — the usage is history, not a live requirement.}}}
        strategy: {type: object, required: [id, name, template_code, template_version, config_snapshot], properties: {id: {type: integer, format: int64}, name: {type: string}, template_code: {type: string}, template_version: {type: integer, minimum: 1}, config_snapshot: {type: object, description: The task's frozen snapshot, not the strategy's current config.}}}
        compose_task: {type: object, required: [id, status, config_snapshot, created_at], properties: {id: {type: integer, format: int64}, status: {type: string}, config_snapshot: {type: object}, created_at: {type: string, format: date-time}}}
    ComposeOutputDetail:
      type: object
      additionalProperties: false
      required: [output, trace]
      properties:
        output: {$ref: '#/components/schemas/ComposeOutput'}
        trace: {$ref: '#/components/schemas/ComposeOutputTrace'}
    ComposeTask:
      type: object
      required: [id, team_id, game_id, trigger_type, material_id, material_usage_id, compose_strategy_id, template_code, template_version, config_snapshot, status, created_by, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        team_id: {type: integer, format: int64}
        game_id: {type: string}
        trigger_type: {type: string, enum: [manual, scheduled]}
        material_id: {type: integer, format: int64}
        material_usage_id: {type: integer, format: int64}
        compose_strategy_id: {type: integer, format: int64}
        template_code: {type: string}
        template_version: {type: integer, minimum: 1}
        config_snapshot: {type: object}
        status: {type: string, enum: [pending, running, success, failed, cancelled]}
        cancel_requested: {type: boolean, description: A cancel was requested while running; the task stays running until the worker confirms the controlled stop.}
        stage: {type: string, description: Worker phase projection from the bounded set validating_input, waiting_input, cutting, uploading, committing; a pending task carries an empty stage.}
        progress: {type: integer, minimum: 0, maximum: 100}
        error_code: {type: string}
        error_message: {type: string}
        attempt_count: {type: integer, minimum: 0}
        created_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  parameters:
    MaterialID: {in: path, name: material_id, required: true, schema: {type: integer, format: int64}}
    UsageID: {in: path, name: usage_id, required: true, schema: {type: integer, format: int64}}
    StrategyID: {in: path, name: strategy_id, required: true, schema: {type: integer, format: int64}}
    TaskID: {in: path, name: task_id, required: true, schema: {type: integer, format: int64}}
    OutputID: {in: path, name: output_id, required: true, schema: {type: integer, format: int64}}
    OutputStatus: {in: query, name: publish_status, required: false, schema: {type: string, enum: [pending_publish, published, archived]}}
