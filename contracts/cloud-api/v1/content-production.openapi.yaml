openapi: 3.1.0
info:
  title: WT Media Cloud Content Production API
  version: 2026.10.12.1
  description: Cloud content production API. Every response uses the Cloud errcode/message/data/logid envelope.
paths:
  /api/v1/compose-templates:
    get:
      operationId: listComposeTemplates
      summary: Read the Cloud-maintained versioned template catalog.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Supported templates and parameter choices.}
  /api/v1/compose-strategies:
    get:
      operationId: listComposeStrategies
      summary: List active strategies in the actor's team and game scope; senior operators also see inactive strategies.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Visible strategies.}
    post:
      operationId: createComposeStrategy
      summary: Create a strategy and immutable version 1 in one transaction.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComposeStrategyInput'}
      responses:
        '201': {description: Created strategy.}
        '400': {description: Invalid template, parameters, or scope.}
        '403': {description: Actor cannot manage this team and game.}
  /api/v1/compose-strategies/{strategy_id}:
    get:
      operationId: getComposeStrategy
      summary: Read one visible strategy.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200': {description: Strategy at its current version.}
        '404': {description: Missing or outside actor scope.}
    put:
      operationId: updateComposeStrategy
      summary: Replace editable fields and append an immutable version; expected_version prevents lost updates.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComposeStrategyUpdate'}
      responses:
        '200': {description: Updated strategy and new version.}
        '403': {description: Actor cannot manage this strategy.}
        '409': {description: Strategy changed since expected_version.}
  /api/v1/compose-strategies/{strategy_id}/copy:
    post:
      operationId: copyComposeStrategy
      summary: Copy a visible strategy into a new independent strategy at version 1.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: {name: {type: string, minLength: 1, maxLength: 120}}
      responses:
        '201': {description: Independent copied strategy.}
        '403': {description: Actor cannot manage strategies.}
        '404': {description: Source missing or outside actor scope.}
  /api/v1/compose-strategies/{strategy_id}/versions:
    get:
      operationId: listComposeStrategyVersions
      summary: Read immutable versions of a visible strategy.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/StrategyID'}]
      responses:
        '200': {description: Historical snapshots, newest first.}
        '404': {description: Strategy missing or outside actor scope.}
  /api/v1/materials:
    get:
      operationId: listMaterials
      summary: List materials visible in the current user's team and game scope.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Visible materials and their video preparation projection.}
  /api/v1/materials/{material_id}:
    get:
      operationId: getMaterial
      summary: Read one visible material.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: Visible material.}
        '403': {description: Material is outside the actor's scope.}
        '404': {description: Material does not exist.}
  /api/v1/materials/{material_id}/usages:
    post:
      operationId: addMaterialUsage
      summary: Idempotently create or restore the current user's material usage.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: Existing active usage returned.}
        '201': {description: New or restored active usage returned.}
  /api/v1/my-materials:
    get:
      operationId: listMyMaterialUsages
      summary: List the current user's material usages, in both states.
      description: >-
        Every relation the user has with a material, not only the ones in use.
        A given-up relation is returned as such — `status: removed` with the
        moment it was given up — because that row is what "My Materials" renders
        as 已放弃 and what its 恢复使用 action addresses. `material` is embedded on
        each usage, so the page needs no second request.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: The user's usages, active and removed, each with its material.}
  /api/v1/material-usages/{usage_id}:
    delete:
      operationId: removeMaterialUsage
      summary: Soft-remove the current user's active material usage.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/UsageID'}]
      responses:
        '204': {description: Usage removed without deleting material or history.}
  /api/v1/material-usages/{usage_id}/restore:
    post:
      operationId: restoreMaterialUsage
      summary: Put the current user's given-up material usage back into use.
      description: >-
        The inverse of removeMaterialUsage, on the same row: the relation returns
        to `active` and `removed_at` is cleared in one write. Addressed by usage
        id and scoped to the calling user, so another operator's row answers 404
        rather than being restored. Already being in use is not an error — the
        call asked for that state, and the second click of a double-click is the
        ordinary way to ask twice.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/UsageID'}]
      responses:
        '204': {description: Usage in use again, with no removal timestamp.}
        '403': {description: The usage's material is outside the actor's scope.}
        '404': {description: No such usage for this user.}
  /api/v1/materials/{material_id}/video-url:
    get:
      operationId: getMaterialVideoURL
      summary: Read a signed cloud address for a prepared material's video.
      description: >-
        The only endpoint that hands out the cloud video address. The material
        list and the material body never carry it; the detail drawer asks here,
        after the actor's scope has been checked and only once the video is
        ready. The address is a short-lived presigned GET grant for the one
        object — the bucket refuses anonymous reads, so an unsigned address is
        one the server has already proven a browser cannot open. Because it
        expires, a caller must ask again rather than hold one: the drawer
        requests it on the click that opens it, rather than when the drawer
        opens. The lifetime is an operational setting, not part of this body,
        and no expiry is published here.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '200': {description: '{url: string} — a signed address, valid for the configured grant lifetime.'}
        '403': {description: Material is outside the actor's scope.}
        '404': {description: Material does not exist.}
        '409': {description: The material's video is not prepared yet.}
  /api/v1/materials/{material_id}/downloads:
    post:
      operationId: createMaterialDownload
      summary: Create one current-session Local Agent user-download transfer task.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/MaterialID'}]
      responses:
        '202': {description: A pending local-agent file transfer task.}
        # The refusal is the binding, not the heartbeat. A bound node whose machine is
        # asleep yields a queueing task instead: reachability is answered when a lease is
        # claimed, not guessed at click time. (It read "No fresh bound Local Agent node"
        # before 2026.09.27, which is what the Desktop bind/refresh button used to reset.)
        '409': {description: No bound Local Agent node is available.}
components:
  schemas:
    ComposeStrategyInput:
      type: object
      additionalProperties: false
      required: [team_id, game_id, name, content_type, template_key, template_version, parameters, status]
      properties:
        team_id: {type: integer, format: int64}
        game_id: {type: string}
        name: {type: string, minLength: 1, maxLength: 120}
        content_type: {type: string, minLength: 1, maxLength: 64}
        template_key: {type: string, enum: [basic_cut]}
        template_version: {type: string, enum: ['1.0']}
        parameters:
          type: object
          additionalProperties: false
          required: [video_ratio]
          properties:
            video_ratio: {type: string, enum: ['16:9', '9:16']}
            subtitle: {type: boolean, enum: [false]}
            bgm: {type: boolean, enum: [false]}
            outro: {type: boolean, enum: [false]}
        allowed_overrides: {type: array, items: {type: string, enum: [video_ratio]}}
        status: {type: string, enum: [active, inactive]}
    ComposeStrategyUpdate:
      type: object
      additionalProperties: false
      required: [expected_version, strategy]
      properties:
        expected_version: {type: integer, minimum: 1}
        strategy: {$ref: '#/components/schemas/ComposeStrategyInput'}
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  parameters:
    StrategyID: {in: path, name: strategy_id, required: true, schema: {type: integer, format: int64}}
    MaterialID: {in: path, name: material_id, required: true, schema: {type: integer, format: int64}}
    UsageID: {in: path, name: usage_id, required: true, schema: {type: integer, format: int64}}
