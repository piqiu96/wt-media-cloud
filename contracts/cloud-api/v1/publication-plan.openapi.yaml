      required: true
      schema: *id001
    put:
      operationId: updatePublicationPlanStructure
      description: Only before first start. Stable batch IDs must belong to this own
        plan; external owner/plan mutation forbidden. Preserve terminated history;
        no resurrecting it. Revalidate affected candidates after goal changes; atomic
        rollback on nonconservation.
      responses:
        '200':
          description: PlanDetail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errcode:
                    type: integer
                    const: 0
                  message:
                    type: string
                    maxLength: 2000
                    minLength: 0
                  data:
                    $ref: '#/components/schemas/PlanDetail'
                  logid:
                    type: string
                    maxLength: 200
                    minLength: 0
                required:
                - errcode
