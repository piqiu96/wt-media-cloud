  /api/v1/publication-plan/{id}/confirm-next:
    parameters:
    - in: path
      name: id
      required: true
      schema: *id001
    post:
      operationId: confirmPublicationPlanNext
      description: Under plan lock compare fresh canonical basis including all started
        prefix task revisions/status/attempts, check stop/expiry and latest manual
        facts, current/next batch. Recheck all gates after comparing. No unresolved/verification-required
        task may be bypassed. failed*10 <= published+reviewing+failed automatically
        hands off without extra batch finish; >10 requires continue; zero denominator
        requires skip. Cancelled/abandoned excluded. Batch own pause still blocks.
        Atomically handoff and next batch start/cursor; old batch retry forbidden.
        Original key+digest immutable receipt replay; changed facts/input conflict.
        Frozen selection cannot be replaced.
      responses:
        '200':
          description: AdvanceResult
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errcode:
                    type: integer
                    const: 0
                  message:
                    type: string
                    maxLength: 2000
                    minLength: 0
                  data:
                    $ref: '#/components/schemas/AdvanceResult'
                  logid:
                    type: string
                    maxLength: 200
                    minLength: 0
                required:
                - errcode
                - message
                - data
                - logid
        '400':
          description: 'publication_invalid: invalid structure or exact selection.'
        '401':
          description: Session required.
        '404':
          description: 'publication_not_found: absent or outside authorized scope.'
        '409':
          description: 'publication_conflict/parent_blocked/shortfall_changed/output_occupied:
            no partial writes; reload current facts. Only a fully valid original
            request with no matching immutable receipt, checked under the plan lock,
            and expected_revision strictly below the monotonic current revision may
            return details.command_applied=false. Matching original key+digest replays
            success first; changed input, corrupt/missing receipt data, ordinary resource
            conflicts and unavailable reads do not prove non-application. This result
            binds only this command/key/revision; no winning key or digest is exposed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'publication_unavailable: preserve original key and input;
            never assume non-application.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmNextInput'
  /api/v1/publication-plan/{id}/takeover:
    parameters:
    - in: path
      name: id
      required: true
      schema: *id001
    post:
      operationId: takeoverPublicationPlan
      description: Only self current position in an already first-started plan. Atomically
        pause plan future progression and permit current batch legal control using
        frozen selection. Cannot bypass full-plan first start or start a future batch.
        Only a running plan with its already-started current running/paused batch,
        complete frozen selection and no stop/end/handoff is eligible. It pauses subsequent
        plan advancement and takes over existing execution; it does not create tasks/attempts,
        rerun batch start or issue duplicate authorization. Already manually paused
        plans use original batch controls without another takeover.
      responses:
        '200':
          description: PlanDetail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errcode:
                    type: integer
