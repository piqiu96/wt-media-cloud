            schema:
              $ref: '#/components/schemas/StructureInput'
  /api/v1/publication-plan/{id}/start:
    parameters:
    - in: path
      name: id
      required: true
      schema: *id001
    post:
      operationId: startPublicationPlan
      description: First legal unstarted position after explicit acknowledgement of
        preceding terminated history. Require every remaining batch ready and exact
        revision/selection/shortfall. Reject duplicate (platform,output_id) across
        included rows, locating both batches/rows. Freeze plan and all configurations/selected
        scopes; create first batch tasks, occupancy, authorization and cursor in one
        transaction using batch start core. Future occupancy is not taken. Persist
        immutable original-key/digest receipt; same key+input replays receipt before
        checking mutable resources; different input conflicts, unknown response requires
        original key and original input, never row-key matching. Every pending batch
        needs internally complete confirmed content; current first batch resources
        must be valid. Future resources are rechecked when its frozen selection starts;
        later conflict waits for the same resource, never silently reduces target,
        substitutes output or skips position.
      responses:
        '200':
          description: StartPlanResult
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errcode:
                    type: integer
                    const: 0
                  message:
                    type: string
                    maxLength: 2000
                    minLength: 0
                  data:
                    $ref: '#/components/schemas/StartPlanResult'
                  logid:
                    type: string
                    maxLength: 200
                    minLength: 0
                required:
                - errcode
                - message
                - data
                - logid
        '400':
          description: 'publication_invalid: invalid structure or exact selection.'
        '401':
          description: Session required.
        '404':
          description: 'publication_not_found: absent or outside authorized scope.'
        '409':
          description: 'publication_conflict/parent_blocked/shortfall_changed/output_occupied:
            no partial writes; reload current facts. Only a fully valid original
            request with no matching immutable receipt, checked under the plan lock,
            and expected_revision strictly below the monotonic current revision may
            return details.command_applied=false. Matching original key+digest replays
            success first; changed input, corrupt/missing receipt data, ordinary resource
            conflicts and unavailable reads do not prove non-application. This result
            binds only this command/key/revision; no winning key or digest is exposed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'publication_unavailable: preserve original key and input;
            never assume non-application.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPlanInput'
