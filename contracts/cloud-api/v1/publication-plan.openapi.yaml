      required: true
      schema: *id001
    post:
      operationId: finishPublicationPlan
      description: Under plan lock require all existing batches processed and no unresolved
        or reviewing/verification-required result. Recompute exact per-cell public
        shortfalls, no cross-cell offset. achieved requires every cell met; unmet
        requires reason note. Preserve target, records and occupation. Late public
        results update statistics only, never reopen or replay.
