    post:
      operationId: recommendPublicationPlan
      description: Real configured DeepSeek after self/category authorization; server
        derives authorized resource counts. Send goals, counts, existing arrangement
        and instruction only, no credentials/account/Profile identifiers/video/resource
        snapshots. No deterministic fake AI or autosave/adoption. Complete output
        must pass conservation/group/order validation. Deadline180s; disconnect cancels;
        model unavailable explicit failure; manual editing remains usable.
      responses:
        '200':
          description: Bounded SSE; only complete validated item_result can be adopted;
            terminal done or error.
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-events:
                start:
                  schema:
                    type: object
                    required:
                    - row_key
                    - input_revision
                    - total
                    - logid
                    properties:
                      row_key: &id003
                        type: string
                      input_revision: *id003
                      total: &id004
                        type: integer
                        minimum: 0
                      logid: *id003
                progress:
                  schema:
                    type: object
                    required:
                    - row_key
                    - input_revision
                    - stage
                    - completed
                    - total
                    properties:
                      row_key: *id003
                      input_revision: *id003
                      stage: *id003
                      completed: *id004
                      total: *id004
                item_result:
                  schema:
                    type: object
                    required:
                    - row_key
                    - input_revision
                    - result
                    properties:
                      row_key: *id003
                      input_revision: *id003
                      result:
                        $ref: '#/components/schemas/RecommendationResult'
                item_error:
                  schema:
                    type: object
                    required:
                    - row_key
                    - input_revision
                    - message
                    - details
                    - logid
                    properties:
                      row_key: *id003
                      input_revision: *id003
                      message: *id003
                      details: {}
                      logid: *id003
                done:
                  schema:
                    type: object
                    required:
                    - total
                    - success
                    - failed
                    properties:
                      total: *id004
                      success: *id004
                      failed: *id004
                error:
                  schema:
                    type: object
                    required:
                    - message
                    - logid
                    properties:
                      message: *id003
                      logid: *id003
        '400':
          description: 'publication_invalid: invalid structure or exact selection.'
        '401':
          description: Session required.
        '404':
          description: 'publication_not_found: absent or outside authorized scope.'
        '409':
          description: 'publication_conflict/parent_blocked/shortfall_changed/output_occupied:
            no partial writes; reload current facts.'
        '503':
          description: 'publication_unavailable: preserve original key and input;
            never assume non-application.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationInput'
