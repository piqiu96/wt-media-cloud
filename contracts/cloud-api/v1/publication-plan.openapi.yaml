openapi: 3.1.0
info:
  title: WT Media Publication Plan
  version: 2026.11.26.2
  description: Session-owned orchestration of prepared batches. No public automatic
    advance, makeup, cross-user authorization or parallel workflow engine. IDs/revisions
    decimal strings and timestamps RFC3339. All mutations audit; transaction locks
    plan then batches by ID, required files/Profile, task, attempt. External model/files/browser
    outside DB transaction.
security:
- sessionCookie: []
paths:
  /api/v1/publication-plan:
    get:
      operationId: listPublicationPlans
      description: Scope before filtering/count/pagination. Operator own plans; senior
        own team/category scope; admin read-only across teams. Exact request_key is
        creator scoped and ignores other filters.
      responses:
        '200':
          description: PlanPage
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errcode:
                    type: integer
                    const: 0
                  message:
                    type: string
                    maxLength: 2000
                    minLength: 0
                  data:
                    $ref: '#/components/schemas/PlanPage'
                  logid:
                    type: string
                    maxLength: 200
                    minLength: 0
                required:
                - errcode
                - message
                - data
                - logid
        '400':
          description: 'publication_invalid: invalid structure or exact selection.'
        '401':
          description: Session required.
        '404':
          description: 'publication_not_found: absent or outside authorized scope.'
        '409':
          description: 'publication_conflict/parent_blocked/shortfall_changed/output_occupied:
            no partial writes; reload current facts.'
        '503':
          description: 'publication_unavailable: preserve original key and input;
            never assume non-application.'
      parameters:
      - in: query
        name: page
        schema: &id002
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - in: query
        name: status
        description: User-facing running includes running and paused before scoped
          count and pagination; manual pause remains progress manual_paused without
          changing persisted status or resume behavior. Legacy paused remains an exact
          filter; other statuses remain exact. Exact request_key ignores this filter.
        schema: &id017
          type: string
          enum:
          - not_started
          - running
          - paused
          - stopping
          - ended
      - in: query
        name: platform
        schema:
          type: string
          maxLength: 30
          minLength: 0
      - in: query
        name: category_id
        schema: &id001
          type: string
          pattern: ^[1-9][0-9]*$
      - in: query
        name: request_key
        schema:
          $ref: '#/components/schemas/RequestKey'
    post:
      operationId: createPublicationPlan
      description: Enabled operator/senior creates only for self. Atomically plan,
        ordered batch skeletons and audit; zero tasks/attempts/occupancy/authorization.
        Per-cell sums equal goals; contiguous platform groups and stable row keys.
        Same creator/key+canonical input returns original object, different input
        conflicts.
      responses:
        '200':
          description: PlanDetail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errcode:
                    type: integer
                    const: 0
                  message:
                    type: string
                    maxLength: 2000
                    minLength: 0
                  data:
                    $ref: '#/components/schemas/PlanDetail'
                  logid:
                    type: string
                    maxLength: 200
                    minLength: 0
                required:
                - errcode
                - message
                - data
                - logid
        '400':
          description: 'publication_invalid: invalid structure or exact selection.'
        '401':
          description: Session required.
        '404':
          description: 'publication_not_found: absent or outside authorized scope.'
        '409':
          description: 'publication_conflict/parent_blocked/shortfall_changed/output_occupied:
            no partial writes; reload current facts.'
        '503':
          description: 'publication_unavailable: preserve original key and input;
            never assume non-application.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanInput'
  /api/v1/publication-plan/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema: *id001
    get:
      operationId: getPublicationPlan
      description: Returns authoritative goal matrix, actual progress, original batch
        actions/blockers and current handoff basis. Public means matched publicly
        accessible linked work only.
      responses:
        '200':
          description: PlanDetail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errcode:
                    type: integer
                    const: 0
                  message:
                    type: string
                    maxLength: 2000
                    minLength: 0
                  data:
                    $ref: '#/components/schemas/PlanDetail'
                  logid:
                    type: string
                    maxLength: 200
                    minLength: 0
                required:
                - errcode
                - message
                - data
                - logid
        '400':
          description: 'publication_invalid: invalid structure or exact selection.'
        '401':
          description: Session required.
        '404':
          description: 'publication_not_found: absent or outside authorized scope.'
        '409':
          description: 'publication_conflict/parent_blocked/shortfall_changed/output_occupied:
            no partial writes; reload current facts.'
        '503':
          description: 'publication_unavailable: preserve original key and input;
            never assume non-application.'
