      - total
      - page
      - page_size
    CommandNotApplied:
      type: object
      additionalProperties: false
      description: Authoritative non-application for this original valid request only.
        Receipt replay takes priority. Issued under the plan lock only when the request
        key has no original receipt and expected_revision is strictly less than the
        monotonic current_revision. Omission means unknown, never false by implication.
      properties:
        command_applied:
          type: boolean
          const: false
        command:
          type: string
          enum: [start, confirm-next]
        request_key:
          $ref: '#/components/schemas/RequestKey'
        expected_revision: *id001
        current_revision: *id001
      required:
      - command_applied
      - command
      - request_key
      - expected_revision
      - current_revision
    Error:
      type: object
      additionalProperties: false
      properties:
        errcode:
          type: integer
        message:
          type: string
          maxLength: 2000
          minLength: 0
        data:
          type: 'null'
        logid:
          type: string
          maxLength: 200
          minLength: 0
        error:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              maxLength: 100
            retryable:
              type: boolean
            recovery_action:
              type: string
              maxLength: 100
            field_errors: {}
            code:
              type: string
              maxLength: 100
              minLength: 0
            details:
              oneOf:
              - $ref: '#/components/schemas/CommandNotApplied'
              - type: object
                additionalProperties: true
                not:
                  required: [command_applied]
          anyOf:
          - required: [code]
          - required: [type]
      required:
      - errcode
      - message
      - data
      - logid
      - error
