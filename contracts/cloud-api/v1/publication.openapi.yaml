openapi: 3.1.0
info:
  title: WT Media Publication Task
  version: 2026.11.26.2
  description: Administrators manage Cloud records only. Senior operators execute and copy only their own tasks and create with their own accounts. Managers may cancel unclaimed tasks; stopping a claimed scene or verifying an uncertain scene belongs to the task operator. Managers supplement reviewing results or abandon failed tasks only against the exact original recorded safe disposition, checked by the existing transaction. Task platform_submission_id/target_url contain original receipts; platform_work_id/work_url/work_id only identify verified public work (ADR-0035). Standalone creation requires separate revision-bound start authorization. Batch tasks receive formal authorization at first batch start and dispatch only through their current fixed group and parent control. Baidu task preparation is available. IDs and revisions are decimal strings; timestamps RFC3339. Uses errcode/message/data/logid.
paths:
  /api/v1/publication/platform-rules:
    get:
      operationId: getPublicationPlatformRules
      security: [{sessionCookie: []}]
      description: Fixed provider-owned rules and deployment availability. Defaults apply only to new content, never overwrite drafts or saved explicit values. Bilibili remains disabled by default until explicitly enabled in the acceptance deployment; availability is also checked by write and execution services.
      responses:
        '200':
          description: Rules in the standard response envelope.
          content:
            application/json:
              schema:
                type: object
                required: [errcode, message, data, logid]
                properties:
                  errcode: {type: integer}
                  message: {type: string}
                  logid: {type: string}
                  data:
                    type: object
                    required: [revision, platforms]
                    properties:
                      revision: {type: string}
                      platforms:
                        type: array
                        items: {$ref: '#/components/schemas/PlatformRule'}
        '401': {description: Authentication required.}
  /api/v1/publication/generate:
    post:
      operationId: generatePublicationContent
      security: [{sessionCookie: []}]
      description: Generate complete DeepSeek JSON suggestions for one or multiple rows after authorizing the actual output and the caller's publication category. Does not adopt, confirm, create tasks or publish. No automatic POST replay. Selected fields only; declarations are never generated. Client applies each field only when row/input/field revision and latest request still match. Deadline 180 seconds, connection close cancels unfinished work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/GenerationInput'}
                - type: object
                  additionalProperties: false
                  required: [items]
                  properties:
                    items:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items: {$ref: '#/components/schemas/GenerationInput'}
      responses:
        '200':
          description: 'SSE start/progress/item_result or item_error/done. Each batch item echoes row_key/input_revision/field_revisions. Batch items have unique row_key. Structural errors reject the request before streaming and unavailable row resources produce item_error. Deadline may emit a terminal error with completed item counts. item_result.result contains content (exact selected fields) and field_revisions. Partial, malformed, extra or overlong model output is an item_error; current inputs remain unchanged.'
          content:
            text/event-stream: {schema: {type: string}}
        '400': {description: 'Invalid fields or generation basis.'}
        '401': {description: 'Authentication required.'}
        '404': {description: 'Output absent or outside actor scope.'}
        '429': {description: 'Generation concurrency limit reached before opening stream.'}
        '503': {description: 'DeepSeek credentials or model unavailable before opening stream.'}
  /api/v1/publication/request:
    get:
      operationId: findPublicationByRequest
      security: [{sessionCookie: []}]
      summary: Find the current creator's original task after a lost creation reply.
      parameters:
        - {in: query, name: request_key, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: 'Original Publication, still subject to current account/team/category read permissions.'}
        '400': {description: 'Invalid request key.'}
        '404': {description: 'No accessible original task for this creator and key.'}
  /api/v1/publication:
    get:
      operationId: listPublications
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: search, schema: {type: string, maxLength: 100}}
        - {in: query, name: platform, schema: {type: string, enum: [baidu, bilibili, xiaohongshu]}}
        - {in: query, name: category_id, schema: {$ref: '#/components/schemas/ID'}}
        - {in: query, name: created_from, schema: {type: string, format: date-time}}
        - {in: query, name: created_before, schema: {type: string, format: date-time}}
        - {in: query, name: status, schema: {type: string, enum: [pending, queued, running, awaiting_human, uncertain, reviewing, failed, published, cancelled, abandoned]}}
      responses:
        '200': {description: '{items:[Publication],total,page,page_size,summary:{all,awaiting_human,running,uncertain}}. Summary uses the same non-status filters and actor scope, independent of pagination. Scope uses account owner, team and category; creator is audit only.'}
        '400': {description: 'Invalid query.'}
    post:
      operationId: createPublication
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_key, platform, category_id, media_account_id, composite_output_id, content]
              properties:
                request_key: {type: string, minLength: 1, maxLength: 64}
                platform: {type: string, enum: [baidu, bilibili]}
                category_id: {$ref: '#/components/schemas/ID'}
                media_account_id: {$ref: '#/components/schemas/ID'}
                composite_output_id: {$ref: '#/components/schemas/ID'}
                content: {$ref: '#/components/schemas/Content'}
                not_before: {type: [string, 'null'], format: date-time}
      responses:
        '201': {description: 'Pending Publication, without authorization or attempt. Same creator/key/input returns the original record even if resources later change.'}
        '400': {description: 'Invalid content or unavailable resource.'}
        '404': {description: 'Resource missing or outside actor scope.'}
        '409': {description: 'Same key with different input, output occupied on this platform, or unsupported platform.'}
        '503': {description: 'Storage or persistence unavailable; retry with the same key and input.'}
  /api/v1/publication/output:
    get:
      operationId: listPublicationOutputCandidates
      security: [{sessionCookie: []}]
      description: Publication narrows the actor's production output scope to permitted publication categories before count and pagination. Publication adds an exact decimal composite_output_id alias and occupied for the selected platform, from all tasks still holding formal occupancy, including terminal states and irrespective of occupying task owner. The generated occupied_output_id column releases abandoned tasks, matching the existing create uniqueness constraint. Occupied rows remain visible with a reason; no occupying task identity is returned. This read creates no reservation and the existing atomic create uniqueness remains authoritative.
      parameters:
        - {in: query, name: platform, required: true, schema: {type: string, enum: [baidu, bilibili, xiaohongshu]}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
        - {in: query, name: search, schema: {type: string, maxLength: 100}}
        - {in: query, name: category_id, schema: {$ref: '#/components/schemas/ID'}}
        - {in: query, name: output_ids, schema: {type: string, pattern: '^[1-9][0-9]*(,[1-9][0-9]*)*$'}, description: Comma-separated distinct IDs (up to 1000). Applies along with filters before pagination.}
      responses:
        '200':
          description: Existing compose-output read projection plus a decimal-string composite_output_id and a required boolean occupied on every row; total/page/page_size retain the production page. No task details, credentials or additional grants.
          content:
            application/json:
              schema:
                type: object
                description: Standard errcode/message/data/logid envelope.
                properties:
                  data:
                    type: object
                    required: [items, total, page, page_size]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          description: Existing authorized compose-output projection extended only with occupied.
                          required: [id, occupied]
                          properties:
                            id: {type: integer}
                            occupied: {type: boolean}
                      total: {type: integer}
                      page: {type: integer}
                      page_size: {type: integer}
        '400': {description: 'Invalid platform or pagination/filter input.'}
        '404': {description: 'Production authorization denied.'}
        '503': {description: 'Candidate or occupancy read failed; no candidates are returned as available.'}
  /api/v1/publication/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}
    get:
      operationId: getPublication
      security: [{sessionCookie: []}]
      responses:
        '200': {description: 'Publication with saved content and safe resource snapshot. No cookies, signed grants or bucket secrets.'}
        '404': {description: 'Task absent or outside actor scope.'}
  /api/v1/publication/{id}/content:
    parameters:
      - {in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}
    put:
      operationId: editPublicationContent
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, content]
              properties:
                expected_revision: {$ref: '#/components/schemas/ID'}
                content: {$ref: '#/components/schemas/Content'}
                not_before: {type: [string, 'null'], format: date-time}
      responses:
        '200': {description: 'Updated Publication, revision incremented. Platform/account/output/category remain fixed.'}
        '400': {description: 'Invalid or unconfirmed content.'}
        '404': {description: 'Task absent or outside actor scope.'}
        '409': {description: 'Revision changed, task claimed or authorized, task no longer pending, or parent configuration is frozen. Reload before editing.'}
  /api/v1/publication/{id}/start:
    post:
      operationId: startPublication
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [expected_revision], additionalProperties: false, properties: {expected_revision: {$ref: '#/components/schemas/ID'}}}}}}
      responses:
        '200': {description: 'Authorized task, pending until not_before or queued when due. Never creates an attempt; frozen inputs cannot subsequently be edited.'}
        '409': {description: 'Revision/state conflict, parent or group forbids separate authorization, unavailable resource or platform not open.'}
  /api/v1/publication/{id}/attempt:
    get:
      operationId: getPublicationAttemptHistory
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}]
      responses:
        '200': {description: 'Scope-checked original attempt history, including assigned execution_group_no for each batch attempt, without credentials, signed grants or mutable old input.'}
  /api/v1/publication/{id}/resolve:
    post:
      operationId: resolvePublication
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResultResolution'}}}}
      responses:
        '200': {description: 'Revision-checked current-attempt verification, preserving the original result. The task owner may record all four conclusions for uncertain or reviewing; management of another owner remains limited to published supplement for reviewing. Every manual conclusion including uncertain updates latest_manual_verification and preserves the immutable original receipt/result and occupancy. Normal reviewing participates in plan handoff but blocks final finish; stopped/expired automatic checking without newer effective explicit manual verification blocks plan handoff as verification_required. Time expiry is computed at transaction current time, not delayed until sweep. Published requires exact public identity, actual published_at and explicit public/content evidence. Work deduplication and task association are atomic. The original submission ID is preserved separately from public work ID. Failure requires explicit no-publishable-work and closed-scene evidence from the original account, not merely a missing submit flag.'}
        '409': {description: 'Stale revision/attempt, active scene, unsafe or unsupported conclusion. No input, occupancy or original result is changed.'}
  /api/v1/publication/{id}/retry:
    post:
      operationId: retryPublication
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [expected_revision], additionalProperties: false, properties: {expected_revision: {$ref: '#/components/schemas/ID'}}}}}}
      responses:
        '200': {description: 'Same failed task becomes eligible after original-attempt, resource, current revision and parent checks. Input, output occupancy and history are retained. A batch retry waits for eligible group dispatch. Only claim creates the next attempt.'}
        '409': {description: 'Stale revision, unresolved or publishable old scene, disallowed parent control, stopped task or unavailable original resources.'}
  /api/v1/publication/{id}/cancel:
    post:
      operationId: cancelPublication
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [expected_revision, reason], additionalProperties: false, properties: {expected_revision: {$ref: '#/components/schemas/ID'}, reason: {type: string, minLength: 1, maxLength: 200}}}}}}
      responses:
        '200': {description: 'Unclaimed pending/queued task cancelled atomically against claim. Running original attempt without issued submission permission receives a stop request and remains running until verified original safe-close/unsubmitted completion projects cancelled. Unknown completion remains uncertain. Retains output occupancy, authorization history and immutable original attempt result. Task read models include advisory boolean can_cancel; command always rechecks atomically alongside the parent stop, claim and submit fences.'}
        '409': {description: 'Stale revision, issued submission permission, prior stop request or unsafe state. Missing submission timestamp never proves safe closure.'}
  /api/v1/publication/{id}/abandon:
    post:
      operationId: abandonPublication
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Abandonment'}}}}
      responses:
        '200': {description: 'Explicitly abandons the current safely failed original attempt and releases only this task output occupancy. Original input, result and verification remain immutable.'}
        '409': {description: 'Stale revision/attempt, mismatched original account, unknown/publishable/open scene or state other than failed.'}
  /api/v1/publication/{id}/copy:
    get:
      operationId: copyPublication
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}
        - {in: query, name: expected_revision, required: true, schema: {$ref: '#/components/schemas/ID'}}
      responses:
        '200':
          description: 'Read-only reusable new-form input after scope and current revision checks. Published/cancelled/abandoned allowed; failed requires the exact original safely resolved unsubmitted attempt. Does not create a task, authorize execution or acquire occupancy. New resources and human confirmation required.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [platform, category_id, content]
                    additionalProperties: false
                    properties:
                      platform: {type: string}
                      category_id: {$ref: '#/components/schemas/ID'}
                      content:
                        type: object
                        required: [description, topics, declaration]
                        additionalProperties: false
                        properties:
                          description: {type: string}
                          topics: {type: string}
                          declaration: {type: string}
                          title: {type: string}
                          bilibili: {$ref: '#/components/schemas/BilibiliOptions'}
        '409': {description: 'Stale revision, unsafe original attempt or state that cannot be copied.'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  schemas:
    GenerationInput:
      type: object
      additionalProperties: false
      required: [row_key, input_revision, platform, category_id, composite_output_id, fields, field_revisions, content]
      properties:
        row_key: {type: string, minLength: 1, maxLength: 64}
        input_revision: {type: string, pattern: '^[1-9][0-9]*$'}
        platform: {type: string, enum: [baidu, bilibili]}
        category_id: {$ref: '#/components/schemas/ID'}
        composite_output_id: {$ref: '#/components/schemas/ID'}
        fields: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {type: string, enum: [title, description, cover_title, topics, tags]}, description: Baidu allows description/cover_title/topics. Bilibili allows title/description/cover_title/tags. No statements, source or rights generation.}
        field_revisions: {type: object, additionalProperties: {type: string, pattern: '^(0|[1-9][0-9]*)$'}, description: Exactly the selected fields.}
        content: {type: object, additionalProperties: false, properties: {title: {type: string, maxLength: 1000}, description: {type: string, maxLength: 2000}, cover_title: {type: string, maxLength: 2000}, topics: {type: string, maxLength: 200}, tags: {type: string, maxLength: 2000, description: Bilibili tags use newline-separated strings for generation only. Adoption parses into the Content.bilibili.tags array after validation; never split or truncate silently.}}}
        instruction: {type: string, maxLength: 500}
    ResultResolution:
      type: object
      additionalProperties: false
      required: [attempt_id, expected_revision, conclusion, evidence]
      properties:
        attempt_id: {$ref: '#/components/schemas/ID'}
        expected_revision: {$ref: '#/components/schemas/ID'}
        conclusion: {type: string, enum: [failed, uncertain, reviewing, published]}
        platform_submission_id: {type: string, maxLength: 255}
        target_url: {type: string, maxLength: 2048}
        platform_work_id: {type: string, maxLength: 255}
        work_url: {type: string, maxLength: 2048}
        published_at: {type: [string, 'null'], format: date-time}
        evidence:
          type: object
          additionalProperties: false
          required: [platform_uid, reason, basis, scene_closed, no_publishable_work]
          properties:
            platform_uid: {type: string, minLength: 1, maxLength: 255}
            reason: {type: string, minLength: 1, maxLength: 200}
            basis: {type: string, minLength: 10, maxLength: 2000}
            scene_closed: {type: boolean}
            no_publishable_work: {type: boolean}
            work_matched: {type: boolean}
            publicly_accessible: {type: boolean}
      allOf:
        - if: {properties: {conclusion: {const: failed}}}
          then:
            properties:
              evidence:
                properties:
                  scene_closed: {const: true}
                  no_publishable_work: {const: true}
              platform_submission_id: {const: ''}
              target_url: {const: ''}
              platform_work_id: {const: ''}
              work_url: {const: ''}
              published_at: {type: 'null'}
        - if: {properties: {conclusion: {enum: [reviewing, published]}}}
          then:
            required: [platform_submission_id]
            properties:
              platform_submission_id: {type: string, pattern: '^[1-9][0-9]*$'}
              evidence:
                required: [work_matched]
                properties:
                  scene_closed: {const: true}
                  work_matched: {const: true}
                  no_publishable_work: {const: false}
        - if: {properties: {conclusion: {const: published}}}
          then:
            required: [platform_work_id, work_url, published_at]
            properties:
              platform_work_id: {type: string, pattern: '^[1-9][0-9]*$'}
              work_url: {type: string, format: uri}
              published_at: {type: string, format: date-time}
              evidence:
                required: [publicly_accessible]
                properties:
                  publicly_accessible: {const: true}
        - if: {properties: {conclusion: {const: uncertain}}}
          then:
            properties:
              platform_submission_id: {const: ''}
              target_url: {const: ''}
              platform_work_id: {const: ''}
              work_url: {const: ''}
              published_at: {type: 'null'}
        - if: {properties: {conclusion: {const: reviewing}}}
          then:
            properties:
              platform_work_id: {const: ''}
              work_url: {const: ''}
              published_at: {type: 'null'}
    LatestManualVerification:
      type: object
      readOnly: true
      required: [verified_at, conclusion, attempt_id, task_revision]
      properties:
        verified_at: {type: string, format: date-time}
        conclusion: {enum: [failed, uncertain, reviewing, published]}
        attempt_id: {$ref: '#/components/schemas/ID'}
        task_revision: {$ref: '#/components/schemas/ID'}
    Abandonment:
      type: object
      additionalProperties: false
      required: [attempt_id, expected_revision, evidence]
      properties:
        attempt_id: {$ref: '#/components/schemas/ID'}
        expected_revision: {$ref: '#/components/schemas/ID'}
        evidence:
          type: object
          additionalProperties: false
          required: [platform_uid, reason, basis, scene_closed, no_publishable_work]
          properties:
            platform_uid: {type: string, minLength: 1, maxLength: 255}
            reason: {type: string, minLength: 1, maxLength: 200}
            basis: {type: string, minLength: 10, maxLength: 2000}
            scene_closed: {type: boolean, const: true}
            no_publishable_work: {type: boolean, const: true}
    ID: {type: string, pattern: '^[1-9][0-9]*$'}
    # Formal generated artifacts require matching cover_render even after the original template is disabled.
    CoverRender:
      type: object
      additionalProperties: false
      required: [template_id, published_revision, title, background_image_asset_id, background_output_id, render_input_hash]
      properties:
        template_id: {$ref: '#/components/schemas/ID'}
        published_revision: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 2000}
        background_image_asset_id: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        background_output_id: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        render_input_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    PlatformRule:
      type: object
      additionalProperties: false
      required: [platform, name, enabled, title_max_length, description_max_length, tags_max_count, tag_max_length, length_unit, statement_options, source_max_length, visibility_options, cover, secondary_cover, defaults]
      properties:
        platform: {type: string, enum: [baidu, bilibili]}
        name: {type: string}
        enabled: {type: boolean}
        title_max_length: {type: integer, minimum: 1}
        description_max_length: {type: integer, minimum: 0}
        tags_max_count: {type: integer, minimum: 0}
        tag_max_length: {type: integer, minimum: 0}
        length_unit: {type: string, enum: [unicode_code_points, utf16_code_units], description: Baidu keeps Unicode code-point counting; Bilibili upload input bounds count UTF-16 code units. Neither client nor Agent may silently truncate confirmed values.}
        statement_options: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        source_max_length: {type: integer, minimum: 0}
        source_required_statement: {type: string}
        visibility_options: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [public, private]}}
        cover: {$ref: '#/components/schemas/CoverRule'}
        secondary_cover: {$ref: '#/components/schemas/CoverRule'}
        defaults:
          type: object
          description: Only safe new-content defaults. No implicit originality, authorship, marketing declaration or source claim.
          additionalProperties: true
    CoverRule:
      type: object
      additionalProperties: false
      required: [field, width_ratio, height_ratio, max_bytes, required, formats]
      properties:
        field: {type: string, enum: [cover_file_id, portrait_cover_file_id, space_cover_file_id]}
        width_ratio: {type: integer, minimum: 1}
        height_ratio: {type: integer, minimum: 1}
        max_bytes: {type: integer, minimum: 1}
        required: {type: boolean}
        formats: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [png, jpeg, webp]}, description: Bilibili accepts PNG/JPEG only; do not automatically transcode or change confirmed cover resources.}
    Content:
      oneOf:
        - {$ref: '#/components/schemas/BaiduContent'}
        - {$ref: '#/components/schemas/BilibiliContent'}
      description: Platform is taken from the enclosing task or batch. Baidu retains the original description-as-title semantics and portrait cover. Bilibili uses title plus optional description and a separate space cover. Cross-platform field combinations are invalid.
    BilibiliContent:
      type: object
      additionalProperties: false
      required: [title, description, cover_file_id, space_cover_file_id, bilibili, confirmed]
      properties:
        title: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 2000}
        cover_file_id: {$ref: '#/components/schemas/ID'}
        cover_render: {$ref: '#/components/schemas/CoverRender'}
        space_cover_file_id: {$ref: '#/components/schemas/ID'}
        space_cover_render: {$ref: '#/components/schemas/CoverRender'}
        portrait_cover_file_id: {type: string, const: '0', description: Legacy serialization field; never a Bilibili resource.}
        topics: {type: string, const: ''}
        declaration: {type: string, const: ''}
        bilibili: {$ref: '#/components/schemas/BilibiliOptions'}
        confirmed: {type: boolean, const: true}
    BilibiliOptions:
      type: object
      additionalProperties: false
      required: [partition_id, partition_name, tags, statement, visibility]
      properties:
        partition_id: {type: integer, minimum: 1}
        partition_name: {type: string, minLength: 1, maxLength: 100}
        tags: {type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 20}}
        rights_reserved: {type: boolean, default: false, description: Explicit optional self-made/non-reproduction rights assertion. Never inferred or AI generated.}
        source: {type: string, maxLength: 200, description: Source/time/place explanation when statement is 内容为转载; empty for other statements.}
        statement: {type: string, enum: [内容无需标注, 含AI生成内容, 含虚构演绎内容, 内容含营销信息, 个人观点，仅供参考, 内容为转载], description: Explicit content statement, independent of rights choice. Current acceptance profile must verify available labels before enabling.}
        visibility: {type: string, enum: [public, private], description: Private submissions never count as verified public work.}
      allOf:
        - if: {properties: {statement: {const: 内容为转载}}}
          then: {required: [source], properties: {source: {type: string, minLength: 1, maxLength: 200}, rights_reserved: {const: false}}}
    BaiduContent:
      type: object
      additionalProperties: false
      description: Baidu description plus one separating space plus nonempty topics must fit 50 Unicode characters. Never truncate confirmed text.
      required: [description, cover_file_id, portrait_cover_file_id, declaration, confirmed]
      properties:
        description: {type: string, minLength: 1, maxLength: 50}
        portrait_cover_render: {$ref: '#/components/schemas/CoverRender'}
        portrait_cover_file_id: {$ref: '#/components/schemas/ID'}
        cover_render: {$ref: '#/components/schemas/CoverRender'}
        cover_file_id: {$ref: '#/components/schemas/ID'}
        topics: {type: string, maxLength: 200}
        declaration: {type: string, enum: [无需声明]}
        confirmed: {type: boolean, const: true}
    TaskStatus:
      type: string
      enum: [pending, queued, running, awaiting_human, uncertain, reviewing, failed, published, cancelled, abandoned]
    Publication:
      type: object
      required: [id, platform, status, revision, content, resources, operator_id, composite_output_id]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        platform: {type: string}
        status: {$ref: '#/components/schemas/TaskStatus'}
        revision: {$ref: '#/components/schemas/ID'}
        batch_id: {type: [string, 'null'], pattern: '^[1-9][0-9]*$', description: Null for standalone tasks.}
        row_key: {type: string, description: Frozen saved row identity for a batch task.}
        task_order: {type: integer, minimum: 0}
        execution_group_no: {type: [integer, 'null'], minimum: 1}
        execution_stage: {type: [string, 'null'], enum: [claimed, preparing, ready, submitting, awaiting_human, connection_lost, finished, null]}
        execution_block:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        allowed_actions:
          type: array
          items: {type: string, enum: [edit, start, cancel, retry, resume, resolve, abandon, copy]}
        operator_id: {$ref: '#/components/schemas/ID'}
        composite_output_id: {$ref: '#/components/schemas/ID'}
        content: {$ref: '#/components/schemas/Content'}
        resources: {type: object}
        verification_required: {type: boolean, readOnly: true, description: 'Computed from original receipt, check stop/expiry at current time and latest effective manual conclusion. Neither timeout nor a note proves failure or public success.'}
        latest_manual_verification:
          oneOf:
            - {$ref: '#/components/schemas/LatestManualVerification'}
            - {type: 'null'}
        check_stopped_at: {type: [string, 'null'], format: date-time, readOnly: true}
        last_checked_at: {type: [string, 'null'], format: date-time, readOnly: true, description: Most recent independent original-submission observation time; never the platform publication time.}
        last_check_message: {type: [string, 'null'], readOnly: true, description: Latest read-only observation reason. Incomplete evidence keeps the task reviewing.}
