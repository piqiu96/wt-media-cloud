openapi: 3.0.3
info:
  title: WT Media Cloud Identity API
  version: 2026.07.14.1
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated; sets the HttpOnly wt_media_session cookie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Session invalidated.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/auth/change-password:
    post:
      operationId: changeOwnPassword
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '200': {description: Password changed and existing session invalidated.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/users:
    post:
      operationId: createUser
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Username already exists.}
  /api/v1/users/{user_id}:
    patch:
      operationId: updateUserAccess
      security: [{sessionCookie: []}]
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200':
          description: User access updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/users/{user_id}/reset-password:
    post:
      operationId: resetUserPassword
      security: [{sessionCookie: []}]
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {description: Password reset and sessions invalidated.}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wt_media_session
  responses:
    AuthenticationRequired:
      description: Missing, invalid, or superseded session.
    Forbidden:
      description: Current role cannot perform the operation.
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, format: password, minLength: 12}
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, format: password, minLength: 12}
        role: {type: string, enum: [operator, senior_operator, technician]}
        game_ids: {type: array, items: {type: string}}
    UpdateUserRequest:
      type: object
      required: [role, game_ids]
      properties:
        role: {type: string, enum: [operator, senior_operator, technician]}
        status: {type: string, enum: [enabled, disabled]}
        game_ids: {type: array, items: {type: string}}
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string, format: password}
        new_password: {type: string, format: password, minLength: 12}
    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password: {type: string, format: password, minLength: 12}
    PublicUser:
      type: object
      required: [id, username, role, status, game_ids]
      properties:
        id: {type: string}
        username: {type: string}
        role: {type: string, enum: [operator, senior_operator, technician]}
        status: {type: string, enum: [enabled, disabled]}
        game_ids: {type: array, items: {type: string}}
    UserResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/PublicUser'}
