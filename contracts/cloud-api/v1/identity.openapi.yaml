openapi: 3.0.3
info:
  title: WT Media Cloud Identity API
  version: 2026.10.23.1
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      description: >
        Authenticates and creates a `user_sessions` row, which is the only login fact.
        The session's client_type (desktop/web) is inferred server-side from the Origin
        header: requests whose Origin is http://tauri.localhost, https://tauri.localhost
        or tauri://localhost (the packaged Desktop WebView) become desktop sessions;
        anything else becomes web. It is NOT a client-declared field and cannot be
        spoofed from a browser, where Origin is a forbidden header.

        Web: every successful login creates a session and invalidates nothing — one user
        may hold several web sessions at once, so `replace_existing` is ignored.

        Desktop: one user may hold at most one valid desktop session. When one already
        exists and `replace_existing` is false, the login returns
        `DESKTOP_LOGIN_CONFLICT` (errcode 20010, HTTP 409) with
        `error.details.active_session_id`, and writes nothing. Confirming means
        resending the same credentials with `replace_existing: true` and
        `replace_session_id` equal to that id; the old row is invalidated with reason
        `desktop_replaced` and a new session is inserted. A stale `replace_session_id`
        (another Desktop confirmed in between) returns the conflict again with the
        current id. Concurrent confirmations are serialized on the user row, so exactly
        one succeeds. Password verification happens before any conflict decision.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: >
            Authenticated. Sets the HttpOnly wt_media_session cookie; a desktop session
            additionally returns {user, token} so the WebView can carry it in the
            X-Session-Token header (the cross-site cookie does not round-trip).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '409':
          description: >
            DESKTOP_LOGIN_CONFLICT (errcode 20010). `error.details.active_session_id` is
            the valid desktop session the confirmation would replace. No authentication
            state is written when this is returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionError'}
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
    patch:
      operationId: updateOwnProfile
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OwnProfileRequest'}
      responses:
        '200':
          description: Updated current user profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '400': {description: Nickname or avatar choice is invalid.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: >
            The current session row is invalidated with reason `logout`. Other sessions of
            the same user, web or desktop, are untouched.
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/auth/change-password:
    post:
      operationId: changeOwnPassword
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '200':
          description: >
            Password changed. Every session of this user is invalidated in the same
            transaction with reason `password_changed`; the caller must log in again.
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
  /api/v1/users:
    get:
      operationId: listUsers
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: uid, schema: {type: integer, format: int64}}
        - {in: query, name: username, schema: {type: string}}
        - {in: query, name: role, schema: {$ref: '#/components/schemas/Role'}}
        - {in: query, name: team_id, schema: {type: integer, format: int64}}
        - {in: query, name: status, schema: {type: string, enum: [enabled, disabled]}}
        - {in: query, name: game_id, schema: {type: string}}
      responses:
        '200':
          description: Filtered user list; never contains password material.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserListResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createUser
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: User created; the submitted initial password is returned only in this response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserCreatedResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Username already exists.}
  /api/v1/users/{user_id}:
    patch:
      operationId: updateUserAccess
      security: [{sessionCookie: []}]
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200':
          description: >
            User access updated. Setting `status: disabled` invalidates every session of
            the user with reason `user_disabled` in the same transaction.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      operationId: deleteUser
      security: [{sessionCookie: []}]
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {description: Unreferenced user deleted.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: User still has sessions, audit, or business references.}
  /api/v1/users/{user_id}/reset-password:
    post:
      operationId: resetUserPassword
      security: [{sessionCookie: []}]
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200':
          description: Password reset and all of the user's sessions invalidated (reason `admin_reset`); plaintext returned only in this response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordResetResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/users/{user_id}/force-logout:
    post:
      operationId: forceLogoutUser
      security: [{sessionCookie: []}]
      description: >
        Administrator action. Invalidates every session of the user in one transaction with
        reason `force_logout` and records an audit entry. It does not disable the user, and
        re-enabling a disabled user never revives an invalidated session.
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {description: All sessions of the user invalidated.}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/operation-teams:
    get:
      operationId: listOperationTeams
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: keyword, schema: {type: string}, description: Team name substring, or exact team ID when numeric.}
      responses:
        '200':
          description: Flat operation-team list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamListResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createOperationTeam
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamRequest'}
      responses:
        '201':
          description: Team created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Team name already exists.}
  /api/v1/operation-teams/{team_id}:
    parameters:
      - in: path
        name: team_id
        required: true
        schema: {type: integer, format: int64}
    patch:
      operationId: renameOperationTeam
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamRequest'}
      responses:
        '200':
          description: Team renamed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      operationId: deleteOperationTeam
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Unreferenced team deleted.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Team is referenced by users or historical business objects.}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wt_media_session
  responses:
    AuthenticationRequired:
      description: >
        Missing, invalid, expired, or invalidated session. `error.code` distinguishes the
        cases: `AUTH_SESSION_INVALID`, `AUTH_SESSION_INVALIDATED`, `AUTH_SESSION_EXPIRED`
        and — for a desktop session replaced by another computer — `AUTH_DESKTOP_REPLACED`.
        Each carries `retryable: false` and a `recovery_action`.
    Forbidden:
      description: Current role cannot perform the operation.
  schemas:
    SessionError:
      type: object
      required: [errcode, message, error]
      properties:
        errcode: {type: integer, description: 20010 for DESKTOP_LOGIN_CONFLICT.}
        message: {type: string}
        logid: {type: string}
        error:
          type: object
          required: [type, code, retryable, recovery_action]
          properties:
            type: {type: string}
            code: {type: string, enum: [DESKTOP_LOGIN_CONFLICT]}
            retryable: {type: boolean, const: false}
            recovery_action: {type: string, const: confirm_desktop_takeover}
            details:
              type: object
              properties:
                active_session_id: {type: string}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, format: password, minLength: 12}
        replace_existing:
          type: boolean
          default: false
          description: >
            Desktop only. True confirms replacing the currently valid desktop session;
            web logins ignore it.
        replace_session_id:
          type: string
          description: >
            Required when `replace_existing` is true: the `active_session_id` the conflict
            response named. A value that no longer matches returns the conflict again.
    CreateUserRequest:
      type: object
      required: [username, password, role, game_ids]
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, format: password, minLength: 12}
        role: {$ref: '#/components/schemas/Role'}
        team_id: {type: integer, format: int64, nullable: true}
        game_ids: {type: array, items: {type: string}}
    UpdateUserRequest:
      type: object
      required: [role, game_ids]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        team_id: {type: integer, format: int64, nullable: true}
        status: {type: string, enum: [enabled, disabled]}
        game_ids: {type: array, items: {type: string}}
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string, format: password}
        new_password: {type: string, format: password, minLength: 12}
    OwnProfileRequest:
      type: object
      required: [nickname, avatar_id]
      properties:
        nickname: {type: string, minLength: 1, maxLength: 64}
        avatar_id: {type: string, enum: [sky, ocean, sun, mountain, flower, star]}
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password: {type: string, format: password, minLength: 12}
    PublicUser:
      type: object
      required: [id, username, nickname, avatar_id, role, status, team_id, team_name, game_ids]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        nickname: {type: string}
        avatar_id: {type: string, enum: [sky, ocean, sun, mountain, flower, star]}
        role: {$ref: '#/components/schemas/Role'}
        status: {type: string, enum: [enabled, disabled]}
        team_id: {type: integer, format: int64, nullable: true}
        team_name: {type: string}
        game_ids: {type: array, items: {type: string}}
    Role:
      type: string
      enum: [admin, senior_operator, operator]
    OperationTeam:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, maxLength: 64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TeamRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
    UserResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/PublicUser'}
    UserCreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, one_time_password]
          properties:
            user: {$ref: '#/components/schemas/PublicUser'}
            one_time_password: {type: string}
    PasswordResetResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [one_time_password]
          properties:
            one_time_password: {type: string}
    UserListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/PublicUser'}}
    TeamResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/OperationTeam'}
    TeamListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/OperationTeam'}}
