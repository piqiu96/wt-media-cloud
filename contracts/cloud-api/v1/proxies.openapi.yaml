openapi: 3.0.3
info:
  title: WT Media Cloud Proxy API
  version: 2026.10.29.2
  description: >
    Proxy resources belong to a team. Operators and senior operators read and write
    their own team only; admins may read every team and must name the target team
    when creating or importing. Health checks run inside Cloud against the saved
    connection, so they do not depend on a local Agent or a running workstation.
paths:
  /api/v1/proxies:
    get:
      operationId: listProxies
      summary: List proxies visible to the caller.
      description: >
        Operators and senior operators always read their own team; passing another
        team_id is refused. Admins without team_id read every team.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: team_id, schema: {type: integer, format: int64}, description: Admin-only team filter.}
        - {in: query, name: enabled, schema: {type: boolean}}
        - {in: query, name: supplier, schema: {type: string}}
        - {in: query, name: region, schema: {type: string}}
        - {in: query, name: search, schema: {type: string}, description: Substring over name, host and supplier.}
      responses:
        '200':
          description: Secret-free proxy views. Username and password never appear in list responses.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ProxyView'}}
        '400': {description: The requested team does not exist.}
        '403': {description: The caller may not read the requested team.}
    post:
      operationId: createProxy
      summary: Create one proxy resource in the caller's team.
      description: >
        Admins must supply team_id; other roles are forced onto their own team and
        an explicit team_id is ignored. A new static proxy stays unassignable until
        a successful check.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyWriteInput'}
      responses:
        '201':
          description: Created proxy view without credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyView'}
        '400': {description: Invalid fields, missing target team, or an unknown team.}
        '403': {description: The caller may not write the target team.}
  /api/v1/proxies/recommendations:
    get:
      operationId: listProxyRecommendations
      summary: List assignable proxies for a set of browser windows.
      description: >
        Candidates come from the caller's team scope and exclude resources that are
        paused, expired, unchecked, failed, or short on remaining capacity after
        accounting for the selected windows.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: profile_ids, required: true, schema: {type: string}, description: Comma-separated Cloud Profile ids owned by the caller.}
      responses:
        '200':
          description: Secret-free assignable proxy views.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ProxyView'}}
        '400': {description: No window was selected.}
        '403': {description: A selected window is not owned by the caller, or the caller has no team.}
  /api/v1/proxies/{proxy_id}:
    get:
      operationId: getProxy
      summary: Read one proxy, including credentials.
      description: Username and password are returned only by this detail operation.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/ProxyID'}]
      responses:
        '200':
          description: Proxy detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyView'}
        '403': {description: The proxy belongs to another team.}
        '404': {description: Proxy does not exist.}
    delete:
      operationId: deleteProxy
      summary: Physically delete a proxy that no window formally references.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/ProxyID'}]
      responses:
        '204': {description: Deleted.}
        '403': {description: Only a senior operator or admin may delete this proxy.}
        '404': {description: Proxy does not exist.}
        '409': {description: A browser window still formally references this proxy; pause it instead.}
    patch:
      operationId: updateProxy
      summary: Update a proxy under the caller's field scope.
      description: >
        Operators may change name, region, supplier, tags and remark. Senior
        operators and admins may additionally change source type, connection,
        credentials, extraction URL, expiry and quota. Omitting credentials or the
        extraction URL keeps the stored value. A changed connection clears the last
        check result, so the proxy needs a new successful check before assignment.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/ProxyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyWriteInput'}
      responses:
        '200':
          description: Updated proxy view without credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyView'}
        '400': {description: Invalid fields or a quota below current usage.}
        '403': {description: The proxy belongs to another team or the field needs a governor.}
        '404': {description: Proxy does not exist.}
  /api/v1/proxies/{proxy_id}/check:
    post:
      operationId: checkProxy
      summary: Probe the saved proxy connection from Cloud.
      description: >
        Cloud connects to the stored protocol, host and port directly and records
        ok, conn_failed, auth_failed, timeout or invalid_params. The result is
        written only if the connection has not changed since the probe started; a
        late result for an edited connection is discarded and reported as
        invalid_params with a retry reason. The response carries the refreshed view,
        whose assignment_blocker includes the check reason.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/ProxyID'}]
      responses:
        '200':
          description: Proxy view after the check, without credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyView'}
        '403': {description: The proxy belongs to another team.}
        '404': {description: Proxy does not exist.}
  /api/v1/proxies/parse:
    post:
      operationId: parseProxyAddress
      summary: Parse one static proxy address without persisting a proxy record.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyAddressRequest'}
      responses:
        '200':
          description: Parsed canonical proxy fields.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyAddress'}
        '400': {description: The address format is invalid.}
  /api/v1/proxies/import/preview:
    post:
      operationId: previewProxyImport
      summary: Parse bulk proxy lines and mark duplicates without persisting them.
      description: >
        Line numbers count the submitted non-empty lines from 1. A row is a
        duplicate when its normalized connection (protocol, host, port) matches an
        existing proxy of the target team or an earlier submitted row.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyImportPreviewInput'}
      responses:
        '200':
          description: Per-line parse results and duplicate markers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyImportPreviewResult'}
        '400': {description: Missing or unknown target team.}
        '403': {description: The caller may not write the target team.}
  /api/v1/proxies/import:
    post:
      operationId: importProxies
      summary: Import the selected rows of a previewed bulk input.
      description: >
        Every previewed row is submitted with its selected flag so the result can
        be reconciled line by line. Unselected, duplicate and invalid rows are
        reported as skipped or failed and never silently dropped.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyImportInput'}
      responses:
        '201':
          description: Import result with total, imported, failed and skipped counts and per-row outcomes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyImportResult'}
        '400': {description: No row was selected, or the target team is missing or unknown.}
        '403': {description: The caller may not write the target team.}
  /api/v1/proxies/{proxy_id}/bindings:
    get:
      operationId: listProxyBindings
      summary: List browser windows formally bound to one proxy under the caller's existing Profile visibility.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/ProxyID'}]
      responses:
        '200':
          description: Secret-free bound browser-window summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ProxyBindingSummary'}
        '403': {description: The proxy belongs to another team.}
        '404': {description: Proxy does not exist.}
  /api/v1/proxies/{proxy_id}/refresh:
    post:
      operationId: startDynamicProxyRefresh
      summary: Return the saved extraction intent for execution by the operator's Desktop.
      description: >
        Cloud never fetches the provider URL itself. The authenticated Desktop
        sends this intent to its Local Agent, then posts the parsed address to
        the result route. No proxy row is changed by this first call.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/ProxyID'}]
      responses:
        '200':
          description: Extraction intent for the Desktop/Agent hop.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyRefreshIntent'}
        '400': {description: Proxy is not an API source or has no extraction URL.}
        '403': {description: Only a senior operator or admin may govern this proxy.}
  /api/v1/proxies/{proxy_id}/refresh/result:
    post:
      operationId: finishDynamicProxyRefresh
      summary: Store the locally extracted address, re-check it in Cloud, and return the refreshed proxy.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/ProxyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyExtractionResult'}
      responses:
        '200':
          description: Extracted address saved and checked; bound windows may require later resynchronization.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyView'}
        '400': {description: Extracted address is invalid.}
        '403': {description: Only a senior operator or admin may govern this proxy.}
components:
  parameters:
    ProxyID:
      in: path
      name: proxy_id
      required: true
      schema: {type: string}
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  schemas:
    ProxyWriteInput:
      type: object
      additionalProperties: false
      properties:
        team_id: {type: integer, format: int64, description: Create only. Required for admins; other roles are forced onto their own team. Ignored on update.}
        name: {type: string, maxLength: 64}
        source: {type: string, enum: [static, api], default: static}
        protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string}
        password: {type: string, writeOnly: true}
        region: {type: string}
        supplier: {type: string}
        tags: {type: array, items: {type: string}}
        extract_url: {type: string, format: uri, writeOnly: true, description: Required when creating an api source; never returned.}
        expires_at: {type: string, format: date-time}
        remark: {type: string}
        max_profiles: {type: integer, minimum: 1, description: Required on create; omitted on update keeps the stored quota.}
    ProxyView:
      type: object
      required: [id, team_id, name, source, protocol, enabled, max_profiles, tags, expired, created_at, updated_at]
      properties:
        id: {type: string}
        team_id: {type: integer, format: int64}
        team_name: {type: string}
        name: {type: string}
        source: {type: string, enum: [static, api]}
        protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer}
        username: {type: string, description: Only the detail operation returns it.}
        password: {type: string, description: Only the detail operation returns it.}
        region: {type: string}
        supplier: {type: string}
        tags: {type: array, items: {type: string}}
        extract_url_configured: {type: boolean, description: Whether an API source has a stored extraction URL.}
        expires_at: {type: string, format: date-time, nullable: true}
        enabled: {type: boolean}
        max_profiles: {type: integer}
        last_check_at: {type: string, format: date-time, nullable: true}
        last_check_result: {type: string, enum: [ok, conn_failed, auth_failed, timeout, invalid_params]}
        last_check_message: {type: string}
        assigned_profile_count: {type: integer, description: Windows currently holding a formal relation.}
        remaining_profile_count: {type: integer, description: max_profiles minus assigned_profile_count, never negative.}
        remark: {type: string}
        expired: {type: boolean, description: Derived at read time from expires_at; not a stored status.}
        assignment_blocker: {type: string, description: Why the proxy cannot be assigned right now; absent when assignable.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProxyAddressRequest:
      type: object
      required: [proxy_address]
      additionalProperties: false
      properties:
        proxy_address: {type: string, description: 'host:port, host:port:username:password, or protocol://username:password@host:port'}
    ProxyRefreshIntent:
      type: object
      required: [proxy_id, extract_url, protocol]
      properties:
        proxy_id: {type: string}
        extract_url: {type: string, format: uri}
        protocol: {type: string, enum: [http, https, socks5]}

    ProxyExtractionResult:
      type: object
      additionalProperties: false
      required: [protocol, host, port]
      properties:
        protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string}
        password: {type: string, writeOnly: true}
    ProxyAddress:
      type: object
      required: [protocol, host, port]
      properties:
        protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string}
        password: {type: string, description: Only returned to the authorized draft request; never returned by proxy list or detail endpoints.}
    ProxyBindingSummary:
      type: object
      required: [id, bit_profile_id, bit_name, user_id, local_state]
      properties:
        id: {type: string}
        bit_profile_id: {type: string}
        bit_name: {type: string}
        user_id: {type: integer}
        local_state: {type: string}
    ProxyImportPreviewInput:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        team_id: {type: integer, format: int64, description: Required for admins; ignored for other roles.}
        lines: {type: array, items: {type: string}}
    ProxyImportPreviewResult:
      type: object
      required: [rows, total]
      properties:
        total: {type: integer}
        rows:
          type: array
          items:
            type: object
            required: [line, raw, duplicate]
            properties:
              line: {type: integer}
              raw: {type: string}
              parsed: {$ref: '#/components/schemas/ProxyWriteInput'}
              error: {type: string}
              duplicate: {type: boolean}
              duplicate_reason: {type: string, description: The existing resource or earlier line occupying the same connection.}
    ProxyImportInput:
      type: object
      required: [rows]
      additionalProperties: false
      properties:
        team_id: {type: integer, format: int64, description: Required for admins; ignored for other roles.}
        rows:
          type: array
          items:
            type: object
            required: [line, raw, selected]
            properties:
              line: {type: integer}
              raw: {type: string}
              selected: {type: boolean}
    ProxyImportResult:
      type: object
      required: [total, imported, failed, skipped, rows]
      properties:
        total: {type: integer}
        imported: {type: integer}
        failed: {type: integer}
        skipped: {type: integer}
        rows:
          type: array
          items:
            type: object
            required: [line, raw, status]
            properties:
              line: {type: integer}
              raw: {type: string}
              status: {type: string, enum: [imported, failed, skipped]}
              reason: {type: string}
              proxy_id: {type: string}
