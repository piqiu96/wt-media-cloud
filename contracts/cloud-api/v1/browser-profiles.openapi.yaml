openapi: 3.0.3
info: {title: WT Media Cloud Browser Profile API, version: 2026.09.04.1}
paths:
  /api/v1/bit-browser/profile-scans:
    post:
      operationId: submitProfileScan
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SnapshotInput'}}}
      responses:
        '201': {description: Secret-free scan staged; formal Profile data is unchanged.}
        '409': {description: Empty, mixed, missing, or mismatched BitBrowser main identity.}
  /api/v1/bit-browser/profile-scans/{scan_id}:
    get:
      operationId: getProfileScan
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: scan_id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Current user's staged scan and Diff.}
        '404': {description: Scan not found.}
  /api/v1/bit-browser/profile-scans/{scan_id}/confirm:
    post:
      operationId: confirmProfileScan
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: scan_id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmProfileScanInput'}}}
      responses:
        '200': {description: Trusted Desktop accepted local changes and formal Profile mirror was applied transactionally.}
        '409': {description: Scan not ready or identity mismatch.}
        '410': {description: Scan expired.}
  /api/v1/bit-browser/main-identity:
    post:
      operationId: confirmBitBrowserMainIdentity
      summary: Confirm the current user's BitBrowser main account without applying Profile Diff.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MainIdentityInput'}}}
      responses:
        '200': {description: User main account identity confirmed; formal Profile mirror is unchanged.}
        '409': {description: Empty or mismatched BitBrowser main identity.}
  /api/v1/browser-profiles:
    get:
      operationId: listBrowserProfiles
      security: [{sessionCookie: []}]
      parameters: [{in: query, name: user_id, schema: {type: integer, format: int64}, description: Admin-only explicit owner filter.}]
      responses:
        '200':
          description: Visible confirmed Profile mirrors, including a formal proxy_id only after successful Agent read-back.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/BrowserProfile'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  schemas:
    SnapshotInput:
      type: object
      required: [main_user_id, profiles]
      properties:
        main_user_id: {type: string, description: Normalized from BitBrowser mainUserId.}
        node_id: {type: string, description: Trusted Desktop node id.}
        profiles: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ProfileInput'}}
    ConfirmProfileScanInput:
      type: object
      required: [node_id]
      additionalProperties: false
      properties:
        node_id: {type: string, description: Trusted Desktop node id required before applying local scan changes.}
    MainIdentityInput:
      type: object
      required: [main_user_id]
      additionalProperties: false
      properties:
        main_user_id: {type: string, description: Normalized from BitBrowser mainUserId read by Desktop through Local Agent.}
    ProfileInput:
      type: object
      required: [bit_profile_id, main_user_id, profile_user_id]
      additionalProperties: false
      properties:
        bit_profile_id: {type: string}
        main_user_id: {type: string, description: Must equal the snapshot main_user_id.}
        profile_user_id: {type: string, description: Normalized from BitBrowser userId for Profile/sub-account audit.}
        name: {type: string}
        seq: {type: integer}
        group_id: {type: string}
        group_name: {type: string}
        bit_status: {type: string}
        bit_updated_at: {type: string}
    BrowserProfile:
      type: object
      required: [id, bit_profile_id, local_status]
      properties:
        id: {type: string}
        bit_profile_id: {type: string}
        name: {type: string}
        local_status: {type: string, enum: [active, local_missing, archived]}
        proxy_id: {type: string, nullable: true, description: Cloud formal relation, updated only after Agent write/read-back verification.}
        proxy_type: {type: string, nullable: true}
        proxy_host: {type: string, nullable: true}
        proxy_port: {type: integer, nullable: true}
