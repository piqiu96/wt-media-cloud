openapi: 3.0.3
info:
  title: WT Media Cloud Media Account API
  version: 2026.10.29.1
paths:
  /api/v1/media-accounts:
    get:
      operationId: listMediaAccounts
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: user_id, schema: {type: integer, format: int64}}
        - {in: query, name: category_ids, schema: {type: string}, description: Comma-separated numeric category IDs; an account matches any selected category.}
        - {in: query, name: platform, schema: {$ref: '#/components/schemas/Platform'}}
        - {in: query, name: any_tags, schema: {type: string}, description: Comma-separated tags; at least one must match.}
        - {in: query, name: all_tags, schema: {type: string}, description: Comma-separated tags; every tag must match.}
        - {in: query, name: exclude_tags, schema: {type: string}, description: Comma-separated tags; none may match.}
      responses:
        '200':
          description: Accounts visible to the current user. Cookie fields are never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountListResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createMediaAccount
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMediaAccountRequest'}
      responses:
        '201':
          description: Pending-identification account created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/media-accounts/{account_id}:
    parameters:
      - in: path
        name: account_id
        required: true
        schema: {type: string}
    get:
      operationId: getMediaAccount
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Visible media account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateMediaAccountStatus
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMediaAccountRequest'}
      responses:
        '200':
          description: Business and/or login status updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/media-accounts/{account_id}/identify:
    post:
      operationId: identifyMediaAccount
      security: [{sessionCookie: []}]
      parameters:
        - in: path
          name: account_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentifyMediaAccountRequest'}
      responses:
        '200':
          description: Account identity backfilled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Duplicate identity exists for this user and platform; candidate is marked duplicate.}
  /api/v1/media-accounts/{account_id}/check:
    post:
      operationId: startMediaAccountCheck
      description: >-
        Authorizes a local account check and returns the task the Desktop sidecar
        must run. Operators may check the accounts they own; senior operators only
        the accounts they created; admins cannot start local work.
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: account_id, required: true, schema: {type: string}}]
      responses:
        '201':
          description: Sensitive task authorized for the local agent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountCheckStartResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Binding window is unavailable or belongs to another user.}
  /api/v1/media-accounts/{account_id}/cookies/read:
    post:
      operationId: readMediaAccountCookies
      description: >-
        Queues a local cookie read through the cloud agent worker. Uses the same
        role and ownership gate as the synchronous read: operators own their
        accounts, senior operators only accounts they created, admins cannot start
        local work.
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: account_id, required: true, schema: {type: string}}]
      responses:
        '201': {description: Cookie-read task queued.}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Account has no binding window.}
  /api/v1/media-accounts/{account_id}/cookies/read-sync:
    post:
      operationId: readMediaAccountCookiesSync
      description: >-
        Authorizes a synchronous local cookie read. Operators may read cookies
        from their own accounts; senior operators only the accounts they created;
        admins cannot start local work.
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: account_id, required: true, schema: {type: string}}]
      responses:
        '201':
          description: Sensitive task authorized for the local agent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountCookieReadStartResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Binding window is unavailable or belongs to another user.}
  /api/v1/media-accounts/tags/add:
    post:
      operationId: addMediaAccountTags
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TagsRequest'}
      responses:
        '200': {description: Tags added idempotently.}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/media-accounts/tags/remove:
    post:
      operationId: removeMediaAccountTags
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TagsRequest'}
      responses:
        '200': {description: Tags removed idempotently.}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/media-accounts/{account_id}/profile:
    patch:
      operationId: bindMediaAccountProfile
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: account_id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [browser_profile_id]
              properties: {browser_profile_id: {type: string}}
      responses:
        '200': {description: Same-user active Profile bound to the account.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Profile unavailable or already used by this platform.}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  responses:
    AuthenticationRequired: {description: Missing, invalid, or superseded session.}
    Forbidden: {description: User ownership, role, or category scope forbids the operation.}
    InvalidRequest: {description: Invalid media account request.}
    NotFound: {description: Media account not found.}
  schemas:
    Platform: {type: string, enum: [douyin, bilibili, baidu]}
    BusinessStatus: {type: string, enum: [enabled, disabled, retired]}
    LoginStatus: {type: string, enum: [unknown, normal, not_logged_in, verification_needed, expired, restricted, account_mismatch, environment_error]}
    IdentificationStatus: {type: string, enum: [pending_identification, identified, duplicate]}
    CreateMediaAccountRequest:
      type: object
      required: [platform]
      properties:
        user_id: {type: integer, format: int64, description: Admin-only target; otherwise omitted or current user.}
        category_ids: {type: array, items: {type: integer, format: int64, minimum: 1}, description: Omit or pass an empty array when the account is not classified yet. Selected categories must share one type.}
        name: {type: string, maxLength: 255}
        platform: {$ref: '#/components/schemas/Platform'}
        browser_profile_id: {type: string}
        remark: {type: string, maxLength: 500}
        tags: {type: array, items: {type: string, maxLength: 64}}
        original_cookie: {type: string, format: password, writeOnly: true}
    UpdateMediaAccountRequest:
      type: object
      properties:
        business_status: {$ref: '#/components/schemas/BusinessStatus'}
        login_status: {$ref: '#/components/schemas/LoginStatus'}
        category_ids: {type: array, items: {type: integer, format: int64, minimum: 1}, description: Present with an empty array to clear all categories. Selected categories must share one type.}
        name: {type: string, maxLength: 255}
        remark: {type: string, maxLength: 500}
      minProperties: 1
    IdentifyMediaAccountRequest:
      type: object
      required: [platform_account_id, login_status]
      properties:
        platform_account_id: {type: string, maxLength: 255}
        name: {type: string, maxLength: 255}
        avatar_url: {type: string, maxLength: 2048}
        login_status: {$ref: '#/components/schemas/LoginStatus'}
    TagsRequest:
      type: object
      required: [account_ids, tags]
      properties:
        account_ids: {type: array, minItems: 1, items: {type: string}}
        tags: {type: array, minItems: 1, items: {type: string, maxLength: 64}}
    MediaAccount:
      type: object
      required: [id, user_id, user_name, team_id, category_ids, platform, identification_status, business_status, login_status, tags, created_at, updated_at]
      properties:
        id: {type: string}
        user_id: {type: integer, format: int64}
        user_name: {type: string, description: 'Owner display name (nickname, falling back to username) resolved by the read query; empty when the user row is missing. Read-only projection, never written.'}
        team_id: {type: integer, format: int64, nullable: true}
        category_ids: {type: array, items: {type: integer, format: int64, minimum: 1}, description: May be empty when the account is not classified yet.}
        platform: {$ref: '#/components/schemas/Platform'}
        platform_account_id: {type: string}
        name: {type: string}
        avatar_url: {type: string}
        browser_profile_id: {type: string, description: Nullable browser-profile reference.}
        remark: {type: string}
        identification_status: {$ref: '#/components/schemas/IdentificationStatus'}
        duplicate_of_account_id: {type: string}
        business_status: {$ref: '#/components/schemas/BusinessStatus'}
        login_status: {$ref: '#/components/schemas/LoginStatus'}
        cookie_status: {type: string}
        active_cookie_updated_at: {type: string, format: date-time}
        last_checked_at: {type: string, format: date-time}
        tags: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MediaAccountResponse:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/MediaAccount'}}
    MediaAccountListResponse:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/MediaAccount'}}}
    MediaAccountCheckStart:
      type: object
      required: [task_id, account_id, browser_profile_id, bit_profile_id, platform, login_status]
      properties:
        task_id: {type: string}
        account_id: {type: string}
        browser_profile_id: {type: string}
        bit_profile_id: {type: string}
        platform: {$ref: '#/components/schemas/Platform'}
        expected_platform_account_id: {type: string}
        login_status: {$ref: '#/components/schemas/LoginStatus'}
    MediaAccountCookieReadStart:
      type: object
      required: [task_id, account_id, browser_profile_id, bit_profile_id, platform]
      properties:
        task_id: {type: string}
        account_id: {type: string}
        browser_profile_id: {type: string}
        bit_profile_id: {type: string}
        platform: {$ref: '#/components/schemas/Platform'}
    MediaAccountCheckStartResponse:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/MediaAccountCheckStart'}}
    MediaAccountCookieReadStartResponse:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/MediaAccountCookieReadStart'}}
