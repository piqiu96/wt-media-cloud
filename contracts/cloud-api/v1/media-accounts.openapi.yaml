openapi: 3.0.3
info:
  title: WT Media Cloud Media Account API
  version: 2026.10.31.1
paths:
  /api/v1/media-accounts:
    get:
      operationId: listMediaAccounts
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: team_id, schema: {type: integer, format: int64}}
        - {in: query, name: view, schema: {type: string, enum: [normal, attention, unbound]}}
        - {in: query, name: category_type, schema: {type: string, enum: [game, ai, anime]}}
        - {in: query, name: tags, schema: {type: string}, description: Comma-separated tags.}
        - {in: query, name: tag_match, schema: {type: string, enum: [any, all, exclude], default: any}}
        - {in: query, name: user_id, schema: {type: integer, format: int64}}
        - {in: query, name: category_ids, schema: {type: string}, description: Comma-separated numeric category IDs; an account matches any selected category.}
        - {in: query, name: platform, schema: {$ref: '#/components/schemas/Platform'}}
        - {in: query, name: enabled, schema: {type: boolean}}
        - {in: query, name: platform_login_status, schema: {$ref: '#/components/schemas/PlatformLoginStatus'}}
        - {in: query, name: any_tags, schema: {type: string}, description: Comma-separated tags; at least one must match.}
        - {in: query, name: all_tags, schema: {type: string}, description: Comma-separated tags; every tag must match.}
        - {in: query, name: exclude_tags, schema: {type: string}, description: Comma-separated tags; none may match.}
      responses:
        '200':
          description: Accounts visible to the current user. Cookie fields are never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountListResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createMediaAccount
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMediaAccountRequest'}
      responses:
        '201':
          description: Pending-identification account created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/media-accounts/{account_id}:
    parameters:
      - in: path
        name: account_id
        required: true
        schema: {type: string}
    get:
      operationId: getMediaAccount
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Visible media account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateMediaAccountStatus
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMediaAccountRequest'}
      responses:
        '200':
          description: Account metadata or enabled state updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/media-accounts/{account_id}/check:
    post:
      operationId: startMediaAccountCheck
      description: >-
        Authorizes a local account check and returns the task the Desktop sidecar
        must run. Operators may check the accounts they own; senior operators only
        the accounts they created; admins cannot start local work.
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: account_id, required: true, schema: {type: string}}]
      responses:
        '201':
          description: Sensitive task authorized for the local agent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountCheckStartResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Binding window is unavailable or belongs to another user.}
  /api/v1/media-accounts/{account_id}/check/result:
    post:
      operationId: applyMediaAccountCheckResult
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: account_id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaAccountCheckResultRequest'}
      responses:
        '200':
          description: Check facts read back from Cloud.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAccountResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: stale_account_check; operation or target changed.}
  /api/v1/media-accounts/{account_id}/profile:
    patch:
      operationId: bindMediaAccountProfile
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: account_id, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [browser_profile_id]
              properties: {browser_profile_id: {type: string}}
      responses:
        '200': {description: Same-user active Profile bound to the account.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Profile unavailable or already used by this platform.}
    delete:
      operationId: unbindMediaAccountProfile
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: account_id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Window relation removed without modifying browser Cookies.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/media-accounts/{account_id}/credentials:
    get:
      operationId: getAccountCredentials
      description: Explicit credentials view. No local read or write. Internal before_cookie
        is excluded.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current operation receipt; repeated requests never authorize
            another external write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccountCredentials'
        '403':
          description: Only the owning operator may access credentials or local operations.
        '409':
          description: 'cookie_operation_conflict (23003): stale operation, changed
            target or occupied window.'
  /api/v1/media-accounts/{account_id}/cookie-updates:
    post:
      operationId: startAccountCookieUpdate
      description: Acquire current target window operation. Same key/content returns
        receipt; changed content or stale expected_operation_id conflicts. Only a fresh
        start grants allow_execute.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current operation receipt; repeated requests never authorize
            another external write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CookieUpdate'
        '403':
          description: Only the owning operator may access credentials or local operations.
        '409':
          description: 'cookie_operation_conflict (23003): stale operation, changed
            target or occupied window.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieUpdateStart'
  /api/v1/media-accounts/{account_id}/cookie-updates/{operation_id}:
    get:
      operationId: getAccountCookieUpdate
      description: Read current matching operation, including execution input only while
        unresolved. Old operation conflicts.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          type: string
      - in: path
        name: operation_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current operation receipt; repeated requests never authorize
            another external write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CookieUpdate'
        '403':
          description: Only the owning operator may access credentials or local operations.
        '409':
          description: 'cookie_operation_conflict (23003): stale operation, changed
            target or occupied window.'
  /api/v1/media-accounts/{account_id}/cookie-updates/{operation_id}/snapshot:
    put:
      operationId: prepareAccountCookieUpdate
      description: Persist complete live target-platform Cookies before first can_apply=true.
        Actual different/unknown account refuses write. A repeated snapshot never grants
        another write.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          type: string
      - in: path
        name: operation_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current operation receipt; repeated requests never authorize
            another external write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CookieUpdate'
        '403':
          description: Only the owning operator may access credentials or local operations.
        '409':
          description: 'cookie_operation_conflict (23003): stale operation, changed
            target or occupied window.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieSnapshot'
  /api/v1/media-accounts/{account_id}/cookie-updates/{operation_id}/result:
    put:
      operationId: settleAccountCookieUpdate
      description: Applied requires matching input, real identity and readback. Failed/uncertain
        preserve last confirmed credentials. Unknown retains window occupation and must
        inspect without another write.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          type: string
      - in: path
        name: operation_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current operation receipt; repeated requests never authorize
            another external write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CookieUpdate'
        '403':
          description: Only the owning operator may access credentials or local operations.
        '409':
          description: 'cookie_operation_conflict (23003): stale operation, changed
            target or occupied window.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieUpdateResult'

  /api/v1/media-account-imports/preview:
    post:
      operationId: previewMediaAccountImport
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportPreviewInput'}
      description: Side-effect-free validation; <=100 original lines, <=2 MiB total, <=1 MiB per input. Returns original row_number, valid and message; never echoes Cookie.
      responses:
        '200':
          description: Preview rows
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportPreviewResponse'}
  /api/v1/media-account-imports:
    post:
      operationId: createMediaAccountImport
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportCreateInput'}
      description: Owner Desktop only; request_key, platform, group_id, category_ids, tags, remark and confirmed items [{row_number,input_cookie}]. Unique owner+request_key; canonical digest rejects changed content with 23004.
      responses:
        '201':
          description: Current batch projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResponse'}
    get:
      operationId: listMediaAccountImports
      security: [{sessionCookie: []}]
      description: Latest 20 owner batches; no credentials. Six exclusive statuses plus total, aggregated from items.
      responses:
        '200':
          description: Batch summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportListResponse'}
  /api/v1/media-account-imports/{batch_id}:
    get:
      operationId: getMediaAccountImport
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: batch_id, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Batch properties, stable original row numbers, revision, counts; no Cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResponse'}
  /api/v1/media-account-imports/{batch_id}/items/{row_number}/start:
    post:
      operationId: startMediaAccountImportItem
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportStartInput'}
      description: expected_revision; fresh grant increments attempt, operation_id import:batch:row:attempt. Serial batch; repeated grant has allow_execute=false. Shared window mutex with single-account updates.
      parameters: [{in: path, name: batch_id, required: true, schema: {type: string}}, {in: path, name: row_number, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'200': {description: Batch projection plus owner execution item; grant flags only on fresh transition, content: {application/json: {schema: {$ref: '#/components/schemas/ImportResponse'}}}}, '409': {description: 23004 import_conflict; refresh before continuing}}
  /api/v1/media-account-imports/{batch_id}/items/{row_number}/result:
    put:
      operationId: settleMediaAccountImportItem
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportResultInput'}
      description: expected_revision/attempt/step; created(browser_profile_id), creation_failed(definite capacity only), creation_unknown, preparation_failed, prepared(before_cookie,fingerprint,login_status,platform_account_id), completed(Cookie result), uncertain. Persist prepared before granting can_apply. Success atomically creates account and transfers credentials. Same UID in another window settles this window normally with an advisory hint; it never overwrites the other record or asks the user to skip.
      parameters: [{in: path, name: batch_id, required: true, schema: {type: string}}, {in: path, name: row_number, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'200': {description: Updated projection; repeated result never grants another execution, content: {application/json: {schema: {$ref: '#/components/schemas/ImportResponse'}}}}, '409': {description: 23004 import_conflict}}
  /api/v1/media-account-imports/{batch_id}/items/{row_number}/actions:
    post:
      operationId: actMediaAccountImportItem
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportActionInput'}
      description: expected_revision/action skip|restore|retry|reconcile|reuse. Reuse requires definite creation failure, explicit confirmed=true, candidate_profile_id and no account binding; actual platform empty checked before write. Unknown only reconcile; never increments attempt or replays create/write. Reconcile grants read-only execution input. Manual login continues same window and uses live readback plus real identity.
      parameters: [{in: path, name: batch_id, required: true, schema: {type: string}}, {in: path, name: row_number, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'200': {description: Updated projection/execution input for read-only reconcile, content: {application/json: {schema: {$ref: '#/components/schemas/ImportResponse'}}}}, '409': {description: 23004 import_conflict}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  responses:
    AuthenticationRequired: {description: Missing, invalid, or superseded session.}
    Forbidden: {description: User ownership, role, or category scope forbids the operation.}
    InvalidRequest: {description: Invalid media account request.}
    NotFound: {description: Media account not found.}
  schemas:
    Platform: {type: string, enum: [douyin, bilibili, baidu]}
    PlatformLoginStatus: {type: string, enum: [unknown, normal, not_logged_in, verification_needed, expired, restricted, account_mismatch, environment_error]}
    IdentificationStatus: {type: string, enum: [pending_identification, identified]}
    CreateMediaAccountRequest:
      type: object
      required: [platform]
      additionalProperties: false
      properties:
        category_ids: {type: array, items: {type: integer, format: int64, minimum: 1}, description: Omit or pass an empty array when the account is not classified yet. Selected categories must share one type.}
        platform: {$ref: '#/components/schemas/Platform'}
        remark: {type: string, maxLength: 500}
        tags: {type: array, items: {type: string, maxLength: 64}}
    UpdateMediaAccountRequest:
      type: object
      properties:
        enabled: {type: boolean}
        category_ids: {type: array, items: {type: integer, format: int64, minimum: 1}, description: Present with an empty array to clear all categories. Selected categories must share one type.}
        remark: {type: string, maxLength: 500}
        tags: {type: array, items: {type: string, maxLength: 64}}
      additionalProperties: false
      description: Metadata patch, or enabled alone. Identity and login verdict are written only by checking.
      minProperties: 1
    MediaAccount:
      type: object
      required: [id, user_id, user_name, team_id, category_ids, platform, identification_status, enabled, platform_login_status, tags, created_at, updated_at]
      properties:
        id: {type: string}
        user_id: {type: integer, format: int64}
        user_name: {type: string, description: 'Owner display name (nickname, falling back to username) resolved by the read query; empty when the user row is missing. Read-only projection, never written.'}
        team_id: {type: integer, format: int64, nullable: true}
        category_ids: {type: array, items: {type: integer, format: int64, minimum: 1}, description: May be empty when the account is not classified yet.}
        platform: {$ref: '#/components/schemas/Platform'}
        platform_account_id: {type: string}
        platform_name: {type: string}
        platform_avatar_url: {type: string}
        browser_profile_id: {type: string, description: Nullable browser-profile reference.}
        remark: {type: string}
        identification_status: {$ref: '#/components/schemas/IdentificationStatus'}
        same_identity_account_id: {type: string, description: Optional other-window same-UID record for a detail hint only. Not a conflict or execution restriction.}
        enabled: {type: boolean}
        platform_login_status: {$ref: '#/components/schemas/PlatformLoginStatus'}
        cookie_status: {type: string}
        cookie_updated_at: {type: string, format: date-time}
        last_check_status: {type: string, enum: [never, running, completed, failed]}
        last_check_message: {type: string}
        last_check_identity: {type: object, nullable: true, properties: {platform_account_id: {type: string}, platform_name: {type: string}, platform_avatar_url: {type: string}}}
        last_check_at: {type: string, format: date-time}
        last_check_items: {type: array, items: {type: object}}
        tags: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MediaAccountResponse:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/MediaAccount'}}
    MediaAccountListResponse:
      type: object
      required: [data]
      properties: {data: {type: object, required: [items, total, page, page_size, stats], properties: {items: {type: array, items: {$ref: '#/components/schemas/MediaAccount'}}, total: {type: integer}, page: {type: integer}, page_size: {type: integer}, stats: {type: object, properties: {total: {type: integer}, normal: {type: integer}, abnormal: {type: integer}, unbound: {type: integer}}}}}}
    MediaAccountCheckStart:
      type: object
      required: [operation_id, account_id, browser_profile_id, bit_profile_id, platform, platform_login_status]
      properties:
        operation_id: {type: string}
        account_id: {type: string}
        browser_profile_id: {type: string}
        bit_profile_id: {type: string}
        platform: {$ref: '#/components/schemas/Platform'}
        expected_platform_account_id: {type: string}
        platform_login_status: {$ref: '#/components/schemas/PlatformLoginStatus'}
    MediaAccountCheckStartResponse:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/MediaAccountCheckStart'}}
    MediaAccountCheckResultRequest:
      type: object
      required: [operation_id, execution_status]
      properties:
        execution_status: {type: string, enum: [completed, failed]}
        operation_id: {type: string}
        platform_account_id: {type: string, maxLength: 255}
        platform_name: {type: string, maxLength: 255}
        platform_avatar_url: {type: string, maxLength: 2048}
        platform_login_status: {$ref: '#/components/schemas/PlatformLoginStatus'}
        message: {type: string}
        check_items: {type: array, items: {type: object}}

    CookieUpdateStart:
      type: object
      additionalProperties: false
      required:
      - request_key
      - input_cookie
      properties:
        request_key:
          type: string
          maxLength: 64
        expected_operation_id:
          type: string
        input_cookie:
          type: string
          maxLength: 1048576
    CookieSnapshot:
      type: object
      additionalProperties: false
      required:
      - before_cookie
      - fingerprint
      - login_status
      properties:
        before_cookie:
          type: array
          items:
            type: object
            additionalProperties: true
        fingerprint:
          type: string
        login_status:
          type: string
        platform_account_id:
          type: string
    CookieUpdateResult:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        verified:
          type: boolean
          description: Read-only inspection obtained a definite platform result; permits
            settling a failed update without repeating a write.
        status:
          type: string
          enum:
          - applied
          - failed
          - uncertain
        applied:
          type: boolean
        cookies:
          type: array
          items:
            type: object
            additionalProperties: true
        platform_account_id:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        login_status:
          type: string
        input_matches:
          type: boolean
        message:
          type: string
          maxLength: 500
    CookieUpdate:
      type: object
      required:
      - operation_id
      - request_key
      - status
      - step
      - browser_profile_id
      - bit_profile_id
      - platform
      properties:
        operation_id:
          type: string
        request_key:
          type: string
        status:
          type: string
        step:
          type: string
        browser_profile_id:
          type: string
        bit_profile_id:
          type: string
        platform:
          type: string
        expected_platform_account_id:
          type: string
        message:
          type: string
        input_cookie:
          type: string
        fingerprint:
          type: string
        allow_execute:
          type: boolean
        can_apply:
          type: boolean
    AccountCredentials:
      type: object
      properties:
        original_cookie:
          type: string
        active_cookie:
          type: string
        cookie_updated_at:
          type: string
          format: date-time
          nullable: true
        current_update:
          $ref: '#/components/schemas/CookieUpdate'

    ImportPreviewInput:
      type: object
      required: [platform, items]
      properties:
        platform: {$ref: '#/components/schemas/Platform'}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [row_number, input_cookie]
            properties:
              row_number: {type: integer, minimum: 1, maximum: 100}
              input_cookie: {type: string, minLength: 1, maxLength: 1048576, writeOnly: true}
    ImportCreateInput:
      allOf:
        - {$ref: '#/components/schemas/ImportPreviewInput'}
        - type: object
          required: [request_key, group_id]
          properties:
            request_key: {type: string, minLength: 1, maxLength: 64}
            group_id: {type: string, minLength: 1, maxLength: 128}
            category_ids: {type: array, items: {type: integer, minimum: 1}}
            tags: {type: array, items: {type: string, maxLength: 64}}
            remark: {type: string, maxLength: 500}
    ImportStartInput:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, minimum: 0}
    ImportResultInput:
      type: object
      additionalProperties: false
      required: [expected_revision, attempt, step]
      properties:
        expected_revision: {type: integer, minimum: 0}
        attempt: {type: integer, minimum: 1}
        step: {type: string, enum: [created, creation_failed, creation_unknown, preparation_failed, prepared, completed, uncertain]}
        browser_profile_id: {type: string}
        fingerprint: {type: string}
        before_cookie: {type: array, items: {type: object}, writeOnly: true}
        status: {type: string, enum: [applied, failed, uncertain]}
        applied: {type: boolean}
        verified: {type: boolean, description: Read-only inspect obtained a definite platform result; manual login completion may transfer verified live cookies.}
        cookies: {type: array, items: {type: object}, writeOnly: true}
        platform_account_id: {type: string}
        name: {type: string}
        avatar_url: {type: string}
        login_status: {type: string}
        input_matches: {type: boolean}
        message: {type: string}
    ImportActionInput:
      type: object
      additionalProperties: false
      required: [expected_revision, action]
      properties:
        expected_revision: {type: integer, minimum: 0}
        action: {type: string, enum: [skip, restore, retry, reconcile, reuse]}
        candidate_profile_id: {type: string}
        confirmed: {type: boolean}
    ImportItem:
      type: object
      required: [row_number, status, step, attempt, message]
      properties:
        row_number: {type: integer, minimum: 1}
        status: {type: string, enum: [pending, running, succeeded, failed, skipped, uncertain]}
        step: {type: string, enum: [waiting, creating, preparing, applying, blocked, manual, completed]}
        attempt: {type: integer, minimum: 0}
        operation_id: {type: string}
        browser_profile_id: {type: string}
        bit_profile_id: {type: string}
        window_name: {type: string}
        account_id: {type: string}
        same_identity_account_id: {type: string, description: Optional other-window same-UID record for a detail hint only. Not a conflict or execution restriction.}
        name: {type: string}
        platform_account_id: {type: string}
        creation_unavailable: {type: boolean}
        message: {type: string}
    ImportView:
      type: object
      required: [id, user_id, request_key, platform, content_json, revision, counts, allow_execute, can_apply, can_inspect]
      properties:
        id: {type: string}
        user_id: {type: integer, format: int64}
        request_key: {type: string}
        platform: {$ref: '#/components/schemas/Platform'}
        content_json:
          type: object
          properties:
            category_ids: {type: array, items: {type: integer}}
            tags: {type: array, items: {type: string}}
            remark: {type: string}
            group_id: {type: string}
            items: {type: array, items: {$ref: '#/components/schemas/ImportItem'}}
        revision: {type: integer, minimum: 0}
        counts: {type: object, required: [total, pending, running, succeeded, failed, skipped, uncertain], additionalProperties: {type: integer, minimum: 0}}
        execution:
          allOf:
            - {$ref: '#/components/schemas/ImportItem'}
            - type: object
              description: Only explicit owner execution/reconcile; never in ordinary batch detail/list. No grants on repeated or stale requests.
              properties:
                input_cookie: {type: string}
                fingerprint: {type: string}
                before_cookie: {type: array, items: {type: object}}
        allow_execute: {type: boolean}
        can_apply: {type: boolean}
        can_inspect: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ImportResponse:
      type: object
      properties:
        errcode: {type: integer}
        message: {type: string}
        logid: {type: string}
        data: {$ref: '#/components/schemas/ImportView'}
    ImportListResponse:
      type: object
      properties:
        errcode: {type: integer}
        message: {type: string}
        logid: {type: string}
        data: {type: array, items: {$ref: '#/components/schemas/ImportView'}}
    ImportPreviewResponse:
      type: object
      properties:
        errcode: {type: integer}
        message: {type: string}
        logid: {type: string}
        data:
          type: array
          items:
            type: object
            required: [row_number, valid, message]
            properties:
              row_number: {type: integer, minimum: 1}
              valid: {type: boolean}
              message: {type: string}
