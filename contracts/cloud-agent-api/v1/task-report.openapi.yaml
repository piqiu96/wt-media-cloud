openapi: 3.1.0
info:
  title: WT Media Cloud-Agent Task Report API
  version: 2026.10.23.1
  description: >
    Cloud-owned contract for task progress, terminal results and user-side retry/cancel.
    Agent calls authenticate with a report-safe Agent Token: once a task has been claimed,
    a replaced desktop session no longer blocks its execution or its result, which is what
    lets the old machine finish what it started.
paths:
  /api/v1/cloud-agent/tasks/{task_id}/report:
    post:
      operationId: reportCloudAgentTask
      security: [{agentBearer: []}]
      summary: Report progress or the terminal result of one attempt.
      description: >
        The body must carry the `attempt_id` issued by the claim. A report whose
        `attempt_id` is not the task's current one is refused with `STALE_ATTEMPT` and
        writes nothing, so an old executor can never overwrite a newer attempt.

        `running` moves `leased`/`running` to `running`, sets `started_at` on the first
        one, and refreshes `last_report_at`. A terminal report (`succeeded` / `failed`) is
        accepted while the task is `leased` or `running`, and also for a task the timeout
        scanner settled as `failed` with `settled_by=timeout` — that is how a late result
        of the same attempt still converges. Any other terminal report is idempotent: the
        current task is returned and nothing is projected twice.
      parameters:
        - in: path
          name: task_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportTaskRequest'}
      responses:
        '200':
          description: Current task after the report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskEnvelope'}
        '400': {description: Unknown status, empty attempt_id, or progress outside 0–100.}
        '401': {description: Missing or invalid Agent Token (AUTH_AGENT_TOKEN_INVALID / AUTH_AGENT_TOKEN_EXPIRED).}
        '404': {description: Task not found for this user.}
        '409': {description: 'STALE_ATTEMPT (30009): the attempt has been superseded.'}
  /api/v1/cloud-agent/tasks/{task_id}/activity:
    post:
      operationId: reportCloudAgentActivity
      security: [{agentBearer: []}]
      summary: Keep one attempt alive without changing its status or progress.
      description: >
        Refreshes `last_report_at` only. The executor does not run a timer of its own: the
        Agent's task runtime sends one activity per running task. If the attempt is no
        longer current, or the task is no longer `leased`/`running`, the call is refused
        with `STALE_ATTEMPT`.
      parameters:
        - in: path
          name: task_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivityTaskRequest'}
      responses:
        '204': {description: Activity recorded.}
        '401': {description: Missing or invalid Agent Token.}
        '409': {description: 'STALE_ATTEMPT: the attempt is no longer current.'}
  /api/v1/cloud-agent/tasks/{task_id}/retry:
    post:
      operationId: retryCurrentUserTask
      security: [{sessionCookie: []}]
      summary: Retry the same task row after a failure or cancellation.
      description: >
        Only the task owner may retry, and only a `failed` or `cancelled` task. The row is
        returned to `pending` and its attempt/terminal fields are cleared; the next claim
        increments `attempt` and issues a new `attempt_id`. A task whose last result is
        `RESULT_UNKNOWN` may have had an external effect, so retrying it requires the
        explicit `confirm_result_unknown: true` confirmation.
      parameters:
        - in: path
          name: task_id
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetryTaskRequest'}
      responses:
        '200':
          description: The task is pending again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskEnvelope'}
        '409': {description: 'RESULT_UNKNOWN without confirmation (30010), or the task is not retryable (30007).'}
  /api/v1/cloud-agent/tasks/{task_id}/cancel:
    post:
      operationId: cancelCurrentUserTask
      security: [{sessionCookie: []}]
      summary: Cancel the caller's own unfinished task.
      parameters:
        - in: path
          name: task_id
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelTaskRequest'}
      responses:
        '200':
          description: The task is cancelled (`settled_by=user`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskEnvelope'}
        '409': {description: The task is already terminal (30003).}
components:
  securitySchemes:
    agentBearer: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  schemas:
    ReportTaskRequest:
      type: object
      required: [attempt_id, status, progress]
      additionalProperties: false
      properties:
        attempt_id: {type: string}
        status: {type: string, enum: [running, succeeded, failed]}
        progress: {type: integer, minimum: 0, maximum: 100}
        message: {type: string}
        error_code: {type: string}
        error_message: {type: string}
        retryable: {type: boolean}
        recovery_action: {type: string}
        result: {type: object, description: Terminal payload; projected once for succeeded tasks.}
    ActivityTaskRequest:
      type: object
      required: [attempt_id]
      additionalProperties: false
      properties:
        attempt_id: {type: string}
        message: {type: string}
        stage: {type: string}
    RetryTaskRequest:
      type: object
      properties:
        confirm_result_unknown: {type: boolean, default: false}
    CancelTaskRequest:
      type: object
      properties:
        message: {type: string}
    TaskEnvelope:
      type: object
      required: [data]
      properties:
        data: {type: object, description: 'The task shape is defined once in task-lease.openapi.yaml.'}
