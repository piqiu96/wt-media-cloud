openapi: 3.1.0
info:
  title: WT Media Cloud-Agent Compatibility API
  version: 2026.11.27.1
  description: Current provider revision 2026.11.26.2 adds explicitly advertised Bilibili capability; omitted supported_platforms permits Baidu only. Cloud-owned compatibility metadata. Revision 2026.11.25.2 is the minimum for new publication claims, original-scene resume and Profile-coordinated check claims. An older Agent may finish an already claimed original attempt through the existing ReportSafe contract.
paths:
  /api/v1/cloud-agent/compatibility:
    get:
      operationId: getCloudAgentCompatibility
      summary: Get Cloud-Agent contract compatibility metadata.
      responses:
        "200":
          description: Current Cloud-Agent compatibility metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/CloudAgentCompatibility"
components:
  schemas:
    CloudAgentCompatibility:
      type: object
      required:
        - api
        - major_version
        - contract_revision
        - minimum_agent_contract_revision
        - compatible_agent_major_versions
        - status
      properties:
        api:
          type: string
          const: cloud-agent
        major_version:
          type: string
          const: v1
        contract_revision:
          type: string
          const: 2026.11.26.2
        minimum_agent_contract_revision:
          type: string
          const: 2026.11.25.2
        compatible_agent_major_versions:
          type: array
          items:
            type: string
          minItems: 1
        status:
          type: string
          const: compatible
