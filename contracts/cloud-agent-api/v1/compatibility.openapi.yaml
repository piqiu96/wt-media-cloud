openapi: 3.1.0
info:
  title: WT Media Cloud-Agent Compatibility API
  version: 2026.07.14.4
  description: Minimal M1-C1 Cloud-owned contract for Cloud-Agent version compatibility.
paths:
  /api/v1/cloud-agent/compatibility:
    get:
      operationId: getCloudAgentCompatibility
      summary: Get Cloud-Agent contract compatibility metadata.
      responses:
        "200":
          description: Current Cloud-Agent compatibility metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/CloudAgentCompatibility"
components:
  schemas:
    CloudAgentCompatibility:
      type: object
      required:
        - api
        - major_version
        - contract_revision
        - minimum_agent_contract_revision
        - compatible_agent_major_versions
        - status
      properties:
        api:
          type: string
          const: cloud-agent
        major_version:
          type: string
          const: v1
        contract_revision:
          type: string
          const: 2026.07.14.4
        minimum_agent_contract_revision:
          type: string
          const: 2026.07.14.4
        compatible_agent_major_versions:
          type: array
          items:
            type: string
          minItems: 1
        status:
          type: string
          const: compatible
