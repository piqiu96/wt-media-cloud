openapi: 3.1.0
info:
  title: WT Media Cloud-Agent Task Lease API
  version: 2026.10.23.1
  description: >
    Cloud-owned contract for claiming and reading tasks. There is no public
    task-creation endpoint and no device or node identity: a task belongs to a user, the
    Agent proves which user it works for with a session-bound Agent Token, and each claim
    produces an `attempt_id` that later reports must carry.
paths:
  /api/v1/cloud-agent/tasks/claim:
    post:
      operationId: claimCloudAgentTask
      security: [{agentBearer: []}]
      summary: Claim one pending task for the token's user.
      description: >
        Strict-mode Agent Token only. The transaction takes the oldest claimable task of
        `user_id = token.sub` (`pending`, or `leased` with an expired lease) with
        `FOR UPDATE SKIP LOCKED`, moves it to `leased`, increments `attempt`, issues a new
        `attempt_id`, and resets the previous attempt's progress and terminal fields. The
        request names no agent: the audit label is derived from the token. `leased` is not
        "running"; execution starts with the Agent's first `running` report.
      responses:
        '200':
          description: The claimed task, including its new `attempt_id`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskEnvelope'}
        '401':
          description: >
            AUTH_AGENT_TOKEN_INVALID, or the strict-mode refusal: AUTH_DESKTOP_REPLACED
            when another desktop session is valid, DESKTOP_LOGIN_REQUIRED when there is
            none. A refused claim never touches the task.
        '409': {description: No claimable task (30001).}
  /api/v1/cloud-agent/tasks/{task_id}:
    get:
      operationId: getCloudAgentTask
      security: [{agentBearer: []}]
      summary: Read one of the token user's tasks.
      parameters:
        - in: path
          name: task_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Task state; payload secrets are redacted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskEnvelope'}
        '401': {description: Missing or invalid Agent Token.}
        '404': {description: Task not found for this user.}
  /api/v1/tasks/{task_id}:
    get:
      operationId: getCurrentUserTask
      security: [{sessionCookie: []}]
      summary: The UI's read of one of the caller's own tasks.
      parameters:
        - in: path
          name: task_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Task state; payload secrets are redacted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskEnvelope'}
        '401': {description: Session invalid, invalidated or expired.}
        '404': {description: Task not found for this user.}
components:
  securitySchemes:
    agentBearer: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: wt_media_session}
  schemas:
    TaskEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Task'}
    Task:
      type: object
      required: [task_id, task_type, status, attempt, external_side_effect, retryable, created_at]
      properties:
        task_id: {type: string}
        task_type:
          type: string
          description: >
            Declared type; an unknown type is refused at creation with
            UNSUPPORTED_TASK_TYPE rather than degraded to a noop.
        status: {type: string, enum: [pending, leased, running, succeeded, failed, cancelled]}
        user_id: {type: integer, format: int64, description: The only owner field; a task has no device or node.}
        attempt: {type: integer, minimum: 0, description: Incremented by each claim; 0 before the first one.}
        attempt_id:
          type: string
          description: >
            Run identifier of the current claim. Every report and activity call must carry
            it; a report from an older attempt is refused with STALE_ATTEMPT and writes
            nothing.
        agent_id: {type: string, description: Audit label derived from the token, never an identity.}
        idempotency_key: {type: string, description: Unique per user; another user's key is not reused.}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        last_report_at:
          type: string
          format: date-time
          description: Refreshed by reports and activity; the timeout scanner compares it against execution_timeout_seconds.
        finished_at: {type: string, format: date-time}
        lease_expires_at: {type: string, format: date-time}
        progress: {type: integer, minimum: 0, maximum: 100}
        message: {type: string}
        error_code: {type: string}
        error_message: {type: string}
        execution_timeout_seconds: {type: integer, minimum: 1, description: Default from the task type.}
        external_side_effect:
          type: boolean
          description: Default from the task type; decides whether a timeout becomes EXECUTION_INTERRUPTED (retryable) or RESULT_UNKNOWN (not retryable).
        retryable: {type: boolean}
        recovery_action: {type: string}
        settled_by: {type: string, enum: [agent, timeout, user, legacy], description: Who wrote the terminal state.}
        payload: {type: object, description: 'Redacted: secret-looking keys are replaced with [REDACTED].'}
        result: {type: object}
