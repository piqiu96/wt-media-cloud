openapi: 3.1.0
info:
  title: WT Media Cloud-Agent Publication Execution
  version: 2026.11.21.4
  description: >-
    Additive single-task execution. Agent bearer identifies the account owner; no device identity or
    generic lease. Claim requires a current Desktop session. Reports are report-safe only for the same
    owner and current attempt; starting new work, including submitting, rechecks the Desktop session.
    Task/attempt ids and revisions are decimal strings. Responses use errcode/message/data/logid.
    Download grants appear only in responses, never in frozen snapshots, evidence or logs.
paths:
  /api/v1/cloud-agent/publication-task/claim:
    post:
      operationId: claimPublication
      security: [{agentBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [request_key], additionalProperties: false, properties: {request_key: {type: string, minLength: 1, maxLength: 64}}}}}
      responses:
        '200':
          description: >-
            data is null when no task is available, otherwise Claim. A repeated owner/request key returns
            the original attempt with replayed=true, never a new task. A replay without a local record
            must preserve the scene for verification, not re-enter the browser. No-task creates no row.
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '401': {description: Invalid bearer or Desktop session no longer current.}
        '409': {description: Input changed, owner/Profile busy, or platform unavailable.}
  /api/v1/cloud-agent/publication-task/{id}/report:
    post:
      operationId: reportPublication
      security: [{agentBearer: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
      responses:
        '200': {description: '{task_status,attempt_status,attempt_id,report_seq,stop_requested,stop_reason?,allow_submit}. Omit stage for lightweight keepalive: no history append, resource revalidation or submit permission. Supply stage for progress and pre-submit checks. Invalidated execution input persists stop_reason=PUBLICATION_INPUT_CHANGED without advancing the stage; keepalive returns this stop until the executor safely completes or the attempt is reconciled. Only a fresh submitting report can grant one click; replay never grants it again. A task stop request fences permission with the same task revision. Explicit stop_requested=true and allow_submit=false denies permission; only that received denial plus verified original scene closure proves no click. Missing/failed responses remain uncertain.'}
        '409': {description: Stale/conflicting report, invalid transition, changed input or unsafe scene.}
  /api/v1/cloud-agent/publication-task/{id}/complete:
    post:
      operationId: completePublication
      security: [{agentBearer: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Completion'}}}}
      responses:
        '200': {description: '{task_status,attempt_status,attempt_id,result_hash}. Exact same result/sequence acknowledges the original write without another state change. Reviewing requires a matching real receipt; public success is verified separately, never inferred from this endpoint.'}
        '409': {description: Foreign/non-current attempt, stale sequence, conflicting result, or an already resolved scene.}
  /api/v1/cloud-agent/publication-task/{id}/attempt/{attempt_id}:
    get:
      operationId: inspectOriginalPublicationAttempt
      security: [{agentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
        - {in: path, name: attempt_id, required: true, schema: {$ref: '#/components/schemas/ID'}}
      responses:
        '200':
          description: 'Report-safe, owner-only original result acknowledgement and explicit scene resolution, including historical attempts. Read only: no grants, permission, new work or automatic browser re-entry. A matching stored hash may acknowledge only the exact original packet; scene_resolved requires explicit safe resolution or a completed result with verified closed scene.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [attempt_id, result_hash, scene_resolved, resolved_status]
                    properties:
                      attempt_id: {$ref: '#/components/schemas/ID'}
                      result_hash: {type: [string, 'null']}
                      scene_resolved: {type: boolean}
                      resolved_status: {type: string, enum: [failed, reviewing, published, ''], description: 'Original attempt disposition, never authorization for the task currently occupying this id.'}
        '404': {description: 'Original attempt missing, wrong publication or foreign owner.'}
  /api/v1/cloud-agent/publication-task/{id}/attempt/{attempt_id}/scene:
    get:
      operationId: inspectPublicationScene
      security: [{agentBearer: []}]
      description: Strict current Desktop session. Validate original owner, task revision, attempt, frozen input, paused pre-submit stage and stop state. Read only; never opens a browser or grants submit.
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
        - {in: path, name: attempt_id, required: true, schema: {$ref: '#/components/schemas/ID'}}
        - {in: query, name: expected_revision, required: true, schema: {$ref: '#/components/schemas/ID'}}
      responses:
        '200': {description: 'Standard envelope data original attempt ExecutionFeedback, allow_submit=false.'}
        '409': {description: Stale, unsafe, changed input or no original waiting scene eligibility.}
  /api/v1/cloud-agent/publication-task/{id}/resume:
    post:
      operationId: resumePublication
      security: [{agentBearer: []}]
      description: Continue only a live original pre-submit scene, with current Desktop authentication. Restores the saved stage and original attempt, never creates an attempt or reuploads. Same original expected_revision can confirm a lost reply only while that exact resume remains safe. Submit permission is independently rechecked later.
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attempt_id, expected_revision]
              properties:
                attempt_id: {$ref: '#/components/schemas/ID'}
                expected_revision: {$ref: '#/components/schemas/ID'}
      responses:
        '200': {description: 'Standard envelope data original ExecutionFeedback, running, allow_submit=false.'}
        '409': {description: Stale original identity/revision, submitted/lost scene, stop or changed input.}
  /api/v1/cloud-agent/publication-task/check/claim:
    post:
      operationId: claimPublicCheck
      security: [{agentBearer: []}]
      description: Read one due original reviewing task for the current owner. Advances only the five-minute read schedule and observation generation. No publication attempt, upload, file grant or submit permission is created. A missing reply waits for the next read cycle.
      responses:
        '200': {description: Standard envelope with data null or PublicCheckClaim, content: {application/json: {schema: {type: object, properties: {data: {nullable: true, allOf: [{$ref: '#/components/schemas/PublicCheckClaim'}]}}}}}}
        '401': {description: Current Desktop Agent session required.}
  /api/v1/cloud-agent/publication-task/{id}/check:
    post:
      operationId: observePublication
      security: [{agentBearer: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      description: Record this exact original attempt and generation. Current task revision/input/owner fences manual supplementation and later checks. Only unknown/received/public observations are admitted. Unknown or inaccessible preserves reviewing. A credible public observation atomically records work, task, observation and audit without changing the original attempt. Exact recorded replay confirms the original observation without changing a newer task.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublicCheckReport'}}}}
      responses:
        '200': {description: 'Standard envelope data {publication_id,attempt_id,generation,observation_hash}; IDs/generation decimal strings. No submit permission.'}
        '400': {description: Invalid observation or unsupported conclusion.}
        '401': {description: Current Desktop Agent session required.}
        '409': {description: Original task revision/attempt/generation/input changed or observation conflicts.}
components:
  securitySchemes:
    agentBearer: {type: http, scheme: bearer}
  parameters:
    TaskID: {in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}
  schemas:
    PublicCheckClaim:
      type: object
      required: [task, attempt, generation, expected_revision]
      properties:
        task: {type: object, description: 'Original reviewing task, immutable submission ID and exact platform-supplied target_url if known.'}
        attempt: {type: object, description: 'Original frozen input and Profile, no file grants or execution authority.'}
        generation: {type: string, pattern: '^[1-9][0-9]*$'}
        expected_revision: {type: string, pattern: '^[1-9][0-9]*$'}
    PublicCheckReport:
      type: object
      additionalProperties: false
      required: [generation, observation]
      properties:
        generation: {type: string, pattern: '^[1-9][0-9]*$'}
        observation:
          allOf:
            - {$ref: '../../cloud-api/v1/publication.openapi.yaml#/components/schemas/ResultResolution'}
            - {type: object, properties: {conclusion: {type: string, enum: [uncertain, reviewing, published]}}}
    ID: {type: string, pattern: '^[1-9][0-9]*$'}
    Report:
      type: object
      required: [attempt_id, report_seq]
      additionalProperties: false
      description: >-
        A single sequence covers keepalive and progress. Omit stage and all evidence fields for
        keepalive; it remains report-safe after the Desktop session is replaced. Progress with stage
        requires the current Desktop session, except awaiting_human. Retry with the original packet;
        repeated packets never replay submit permission. Each new report uses an increasing sequence.
      properties:
        attempt_id: {$ref: '#/components/schemas/ID'}
        report_seq: {type: integer, minimum: 1}
        stage: {type: string, enum: [preparing, ready, submitting, awaiting_human]}
        platform_uid: {type: string, maxLength: 255}
        bit_profile_id: {type: string, maxLength: 255}
        video_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        cover_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      allOf:
        - if: {not: {required: [stage]}}
          then:
            not:
              anyOf:
                - {required: [platform_uid]}
                - {required: [bit_profile_id]}
                - {required: [video_sha256]}
                - {required: [cover_sha256]}
    Completion:
      type: object
      required: [attempt_id, report_seq, result_hash, result]
      additionalProperties: false
      properties:
        attempt_id: {$ref: '#/components/schemas/ID'}
        report_seq: {type: integer, minimum: 1}
        result_hash: {type: string, pattern: '^[a-f0-9]{64}$', description: 'SHA256 of canonical UTF-8 JSON {report_seq,result}: keys sorted, no whitespace, unescaped Unicode; strings use JSON control escapes, numbers are integers. Persist and resend the original packet.'}
        result: {$ref: '#/components/schemas/Result'}
    Result:
      type: object
      required: [status, evidence]
      additionalProperties: false
      properties:
        status: {type: string, enum: [reviewing, uncertain, failed]}
        platform_work_id: {type: string, maxLength: 255}
        work_url: {type: string, maxLength: 2048}
        error_code: {type: string, maxLength: 64}
        error_message: {type: string, maxLength: 1000}
        evidence:
          type: object
          additionalProperties: false
          properties:
            platform_uid: {type: string, maxLength: 255}
            bit_profile_id: {type: string, maxLength: 255}
            video_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            cover_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            receipt_id: {type: string, maxLength: 255}
            not_submitted: {type: boolean}
            scene_closed: {type: boolean}
    Claim:
      type: object
      required: [task, attempt, replayed]
      properties:
        task: {type: object, description: 'Formal task with decimal-string IDs; ownership and fixed content.'}
        attempt: {type: object, description: 'Attempt with frozen input, owner, Cloud/BitBrowser Profile IDs and file sizes/digests; no grants or secrets.'}
        replayed: {type: boolean}
        files: {type: object, description: 'video and cover short-lived single-object grants, each {url,size,sha256}; never persist. Omitted on replay of finished/lost work.'}
    Envelope:
      type: object
      required: [errcode, message, data, logid]
      properties:
        errcode: {type: integer}
        message: {type: string}
        logid: {type: string}
        data: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/Claim'}]}
