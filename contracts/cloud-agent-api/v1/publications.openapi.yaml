openapi: 3.1.0
info:
  title: WT Media Cloud-Agent Publication Execution
  version: 2026.11.25.2
  description: >-
    Owner-scoped publication execution for standalone and batch tasks. New work requires a current
    Desktop session and Agent contract revision 2026.11.25.2 or newer. Original attempt keepalive,
    completion, and closure-only check release retain ReportSafe semantics. The profile use record
    represents the exact original operation and persists until trustworthy closure; elapsed time alone
    does not release a Profile, account, or unresolved window.
    Task/attempt ids and revisions are decimal strings. Responses use errcode/message/data/logid.
    New execution freezes portrait_cover_sha256/portrait_cover_size in addition to the horizontal cover, and requires matching portrait_cover_sha256 in progress and result evidence. Missing portrait input is refused; no automatic conversion.
    Download grants appear only in responses, never in frozen snapshots, evidence or logs.
paths:
  /api/v1/cloud-agent/publication-task/claim:
    post:
      operationId: claimPublication
      security: [{agentBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PublicationClaimRequest'}}}
      responses:
        '200':
          description: >-
            Data is null when no task is eligible or capacity/Profile is busy. A new claim checks the
            current batch group and control, actual Profile use, UID, and both effective capacity limits
            in the attempt transaction. A repeated owner/request key returns the original attempt with
            replayed=true. Only the known original claimant with durable local state may continue.
            Stopped, finished and lost attempts receive no new file grants. A busy/no-task reply creates no attempt.
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '401': {description: Invalid bearer or Desktop session no longer current.}
        '409': {description: Changed input, platform unavailable, publication_admission_closed during legacy cutover, or publication_agent_upgrade_required for an older Agent requesting new work.}
  /api/v1/cloud-agent/publication-task/{id}/report:
    post:
      operationId: reportPublication
      security: [{agentBearer: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
      responses:
        '200':
          description: >-
            Ordinary keepalive changes neither task nor batch business revision, appends no progress or audit,
            and grants no submit permission. scene_parked acknowledges release of only the automatic slot for the
            original pre-submit attempt; Profile, UID, and window remain held. Replays grant no new permission.
            Only a fresh submitting report in a current session for an attempt admitted or continued under the current contract can grant one click. Legacy-only attempts retain settlement, including already issued permissions and the original result, without a new permission. A stopped batch prevents new
            submit permission even after claim. Explicit stop_requested=true with allow_submit=false and verified
            original scene closure can prove no submission. Missing or failed replies remain uncertain.
          content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackEnvelope'}}}
        '409': {description: Stale/conflicting report, invalid transition, changed input or unsafe scene.}
  /api/v1/cloud-agent/publication-task/{id}/complete:
    post:
      operationId: completePublication
      security: [{agentBearer: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Completion'}}}}
      responses:
        '200':
          description: Exact result and sequence replay acknowledges the original completion. Reviewing requires the real matching receipt. Completion may update original task facts and group progress without reopening a stopped or ended batch. Public success is verified separately.
          content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackEnvelope'}}}
        '409': {description: Foreign/non-current attempt, stale sequence, conflicting result, or an already resolved scene.}
  /api/v1/cloud-agent/publication-task/{id}/attempt/{attempt_id}:
    get:
      operationId: inspectOriginalPublicationAttempt
      security: [{agentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
        - {in: path, name: attempt_id, required: true, schema: {$ref: '#/components/schemas/ID'}}
      responses:
        '200':
          description: 'Report-safe, owner-only original result acknowledgement and explicit scene resolution, including historical attempts. Read only: no grants, permission, new work or automatic browser re-entry. A matching stored hash may acknowledge only the exact original packet; scene_resolved requires explicit safe resolution or a completed result with verified closed scene.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [attempt_id, result_hash, scene_resolved, resolved_status]
                    properties:
                      attempt_id: {$ref: '#/components/schemas/ID'}
                      result_hash: {type: [string, 'null']}
                      scene_resolved: {type: boolean}
                      resolved_status: {type: string, enum: [failed, reviewing, published, ''], description: 'Original attempt disposition, never authorization for the task currently occupying this id.'}
        '404': {description: 'Original attempt missing, wrong publication or foreign owner.'}
  /api/v1/cloud-agent/publication-task/{id}/attempt/{attempt_id}/scene:
    get:
      operationId: inspectPublicationScene
      security: [{agentBearer: []}]
      description: Strict current Desktop session. Check original owner, task revision, attempt, frozen input, paused pre-submit stage and parent stop state. Read-only eligibility for the locally registered original scene.
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
        - {in: path, name: attempt_id, required: true, schema: {$ref: '#/components/schemas/ID'}}
        - {in: query, name: expected_revision, required: true, schema: {$ref: '#/components/schemas/ID'}}
      responses:
        '200':
          description: Original attempt feedback with allow_submit=false.
          content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackEnvelope'}}}
        '409': {description: Stale, unsafe, changed input or no original waiting scene eligibility.}
  /api/v1/cloud-agent/publication-task/{id}/resume:
    post:
      operationId: resumePublication
      security: [{agentBearer: []}]
      description: Current Desktop session only. Recheck current parent control, original attempt, exact local scene, frozen input and revision. Reacquire an automatic slot before restoring its paused stage. Keep the original attempt, Profile and window. Replay of the original revision confirms only that exact previously accepted resume while safe. Submit permission is checked separately.
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attempt_id, expected_revision, capacity]
              properties:
                attempt_id: {$ref: '#/components/schemas/ID'}
                expected_revision: {$ref: '#/components/schemas/ID'}
                capacity: {$ref: '#/components/schemas/ExecutionCapacity'}
      responses:
        '200':
          description: Original attempt is running with its automatic slot and allow_submit=false.
          content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackEnvelope'}}}
        '409': {description: Stale revision, unsafe original scene, parent control, changed input, upgrade required or capacity wait. Wait never starts local actions.}
  /api/v1/cloud-agent/publication-task/check/claim:
    post:
      operationId: claimPublicCheck
      security: [{agentBearer: []}]
      description: >-
        Strict current Desktop session. Claim one due original submission check for this owner. Acquire its
        actual Profile use and reserve window capacity in the same transaction as the observation generation.
        Publishing and checking the same BitBrowser main-account/Profile pair conflict before a new attempt or
        observation generation is created. Journal the exact request key and input before sending. Persist
        the returned reservation and original snapshot before any read or window activity. Persist a separate
        possible-open barrier before attempting to open the Profile, then persist trustworthy closure and the
        exact settlement packet before sending it. Preserve the journal across session replacement until original
        settlement is acknowledged. With an active replay, continue the original check only when that same-key
        journal proves the possible-open barrier was never crossed. If crossed or unknown, reconcile the exact
        old scene before settlement. A released replay returns only its original acknowledgement and never
        returns a snapshot or creates a new generation.
        The settle_unreceived branch is ReportSafe for the original requesting session and owner. It
        accepts only the durable original key when the Agent has never persisted a reservation reply or
        begun work and still proves it never opened the original scene. It returns no work snapshot.
        An already admitted key releases only that original reservation and returns its acknowledgement.
        A key with no reservation is atomically tombstoned so a later in-flight claim cannot allocate it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/PublicCheckClaimRequest'}
                - {$ref: '#/components/schemas/UnreceivedPublicCheckSettlement'}
      responses:
        '200':
          description: Active original check, exact released acknowledgement, or data=null when no eligible check or Profile/window is busy.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Success'}
                  - properties:
                      data:
                        oneOf:
                          - {type: 'null'}
                          - {$ref: '#/components/schemas/PublicCheckClaim'}
                          - {$ref: '#/components/schemas/ReleasedPublicCheckClaim'}
                          - {$ref: '#/components/schemas/CancelledPublicCheckClaim'}
        '401': {description: Claim requires a current Desktop session. Unreceived settlement requires the valid original-session ReportSafe token.}
        '409': {description: Request key reused with different input, a newer Agent contract is required, or legacy cutover still closes new admission.}
  /api/v1/cloud-agent/publication-task/{id}/check:
    post:
      operationId: observePublication
      security: [{agentBearer: []}]
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      description: >-
        The observation branch requires the current Desktop session and matches the original task, attempt,
        generation, Profile reservation and current task revision. It records only unknown/received/public
        observations and releases the original Profile use once verified safe. Credible public evidence records
        the work, task projection, observation and audit atomically. The explicit release-only branch uses
        ReportSafe authentication and verifies the original operation and trustworthy no-open/closed disposition.
        It only settles that Profile use, even if task revision changed or an observation became stale. Exact
        acknowledgement replay cannot release a successor or apply an observation again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/PublicCheckReport'}
                - {$ref: '#/components/schemas/PublicCheckRelease'}
      responses:
        '200':
          description: Original observation or release-only acknowledgement.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Success'}
                  - properties:
                      data:
                        oneOf:
                          - {$ref: '#/components/schemas/PublicCheckAcknowledgement'}
                          - allOf:
                              - {$ref: '#/components/schemas/PublicCheckReleaseAcknowledgement'}
                              - not: {required: [observation_hash]}
        '400': {description: Invalid observation, release evidence or unsupported conclusion.}
        '401': {description: Observation requires a current Desktop session. Release-only requires a valid original-owner report-safe token.}
        '409': {description: Original revision, attempt, generation, input or reservation changed, or evidence conflicts. A stale observation can be followed by original release-only closure.}
components:
  securitySchemes:
    agentBearer: {type: http, scheme: bearer}
  parameters:
    TaskID: {in: path, name: id, required: true, schema: {$ref: '#/components/schemas/ID'}}
  schemas:
    RequestKey: {type: string, minLength: 1, maxLength: 64}
    ExecutionCapacity:
      type: object
      additionalProperties: false
      required: [automatic_slots, window_slots]
      description: >-
        Deployment/configured upper bounds through the Agent session, not a count of currently free slots.
        Effective bounds take the smaller Cloud and Agent values independently and then enforce windows as
        another constraint on automation. Controlled starting settings are 5 automatic and 10 windows.
        Runtime Profile/UID availability further limits admission. A larger reported upper bound grants no
        Cloud or local capacity. Browser checks count towards retained windows.
      properties:
        automatic_slots: {type: integer, minimum: 1, maximum: 65535}
        window_slots: {type: integer, minimum: 1, maximum: 65535}
    PublicationClaimRequest:
      type: object
      additionalProperties: false
      required: [request_key]
      properties:
        request_key: {$ref: '#/components/schemas/RequestKey'}
        capacity: {$ref: '#/components/schemas/ExecutionCapacity'}
      description: capacity is mandatory for new work. Legacy request-key-only packets may read an existing original claim without receiving new work or grants.
    PublicCheckClaimRequest:
      type: object
      additionalProperties: false
      required: [request_key, capacity]
      properties:
        request_key: {$ref: '#/components/schemas/RequestKey'}
        capacity: {$ref: '#/components/schemas/ExecutionCapacity'}
    UnreceivedPublicCheckSettlement:
      type: object
      additionalProperties: false
      required: [request_key, settle_unreceived]
      properties:
        request_key: {$ref: '#/components/schemas/RequestKey'}
        settle_unreceived: {const: true}
    CancelledPublicCheckClaim:
      type: object
      additionalProperties: false
      required: [request_key, reservation_state]
      properties:
        request_key: {$ref: '#/components/schemas/RequestKey'}
        reservation_state: {const: cancelled}
    PublicCheckClaim:
      type: object
      required: [task, attempt, generation, expected_revision, reservation_id, reservation_state, replayed, browser_fallback_allowed]
      properties:
        browser_fallback_allowed: {type: boolean, description: "False after the task already used a browser fallback. Explicit public-media verification may still use a browser; ordinary lookup failures must not reopen it."}
        task: {type: object, description: 'Original reviewing task, immutable submission ID and exact platform-supplied target_url if known.'}
        attempt: {type: object, description: 'Original frozen input and Profile, no file grants or execution authority.'}
        generation: {$ref: '#/components/schemas/ID'}
        expected_revision: {$ref: '#/components/schemas/ID'}
        reservation_id: {$ref: '#/components/schemas/ID'}
        reservation_state: {const: active}
        replayed: {type: boolean}
    ReleasedPublicCheckClaim:
      allOf:
        - {$ref: '#/components/schemas/PublicCheckReleaseAcknowledgement'}
        - type: object
          required: [reservation_state, replayed]
          properties:
            reservation_state: {const: released}
            replayed: {const: true}
            observation_hash: {type: string, pattern: '^[a-f0-9]{64}$', description: Present only when the original acknowledgement recorded an observation.}
          not: {anyOf: [{required: [task]}, {required: [attempt]}, {required: [expected_revision]}]}
    ProfileDisposition:
      type: string
      enum: [not_opened, closed]
      description: The original caller verified the exact Profile is closed. not_opened additionally requires durable evidence that this reservation never attempted to open a browser. closed requires verified closure of its owned scene. Elapsed time or a missing local record is insufficient.
    PublicCheckReport:
      type: object
      additionalProperties: false
      required: [reservation_id, generation, observation, profile_disposition]
      properties:
        browser_used: {type: boolean, description: "This read opened an owned Profile scene."}
        lookup_result: {type: string, enum: [found, not_found, blocked], description: "Optional lookup outcome. not_found requires a complete successful original-account search; blocked stops automatic reads pending operator action."}
        reservation_id: {$ref: '#/components/schemas/ID'}
        generation: {$ref: '#/components/schemas/ID'}
        profile_disposition: {$ref: '#/components/schemas/ProfileDisposition'}
        observation:
          allOf:
            - {$ref: '../../cloud-api/v1/publication.openapi.yaml#/components/schemas/ResultResolution'}
            - type: object
              properties:
                conclusion: {type: string, enum: [uncertain, reviewing, published]}
                evidence:
                  type: object
                  required: [scene_closed]
                  properties:
                    scene_closed: {const: true}
              description: Both Profile dispositions require explicit scene_closed=true. A conflicting observation leaves the original Profile use held.
      allOf:
        - if: {required: [browser_used], properties: {browser_used: {const: true}}}
          then: {properties: {profile_disposition: {const: closed}}}
    PublicCheckRelease:
      type: object
      additionalProperties: false
      required: [release_only, reservation_id, attempt_id, generation, profile_disposition]
      properties:
        release_only: {const: true}
        reservation_id: {$ref: '#/components/schemas/ID'}
        attempt_id: {$ref: '#/components/schemas/ID'}
        generation: {$ref: '#/components/schemas/ID'}
        profile_disposition: {$ref: '#/components/schemas/ProfileDisposition'}
    PublicCheckReleaseAcknowledgement:
      type: object
      required: [publication_id, attempt_id, generation, reservation_id, released]
      properties:
        publication_id: {$ref: '#/components/schemas/ID'}
        attempt_id: {$ref: '#/components/schemas/ID'}
        generation: {$ref: '#/components/schemas/ID'}
        reservation_id: {$ref: '#/components/schemas/ID'}
        released: {const: true}
    PublicCheckAcknowledgement:
      allOf:
        - {$ref: '#/components/schemas/PublicCheckReleaseAcknowledgement'}
        - required: [observation_hash]
          properties:
            observation_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    ID: {type: string, pattern: '^[1-9][0-9]*$'}
    Report:
      type: object
      required: [attempt_id, report_seq]
      additionalProperties: false
      description: >-
        A single sequence covers keepalive and progress. Omit stage and all evidence fields for
        keepalive; it remains report-safe after the Desktop session is replaced. Progress with stage
        requires the current Desktop session, except awaiting_human. Retry with the original packet;
        repeated packets never replay submit permission. Each new report uses an increasing sequence.
      properties:
        attempt_id: {$ref: '#/components/schemas/ID'}
        report_seq: {type: integer, minimum: 1}
        stage: {type: string, enum: [preparing, ready, submitting, awaiting_human]}
        scene_parked:
          const: true
          description: A current Desktop session is required to record new parking evidence. The original controller has stopped automated actions in the pre-submit wait callback and registered the live local scene. At this exact increasing report_seq, the server may release only the automatic slot. Older awaiting_human packets have no such effect.
        platform_uid: {type: string, maxLength: 255}
        bit_profile_id: {type: string, maxLength: 255}
        video_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        portrait_cover_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        cover_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      allOf:
        - if: {not: {required: [stage]}}
          then:
            not:
              anyOf:
                - {required: [platform_uid]}
                - {required: [bit_profile_id]}
                - {required: [video_sha256]}
                - {required: [cover_sha256]}
                - {required: [portrait_cover_sha256]}
        - if: {required: [scene_parked]}
          then: {required: [stage], properties: {stage: {const: awaiting_human}}}
    Completion:
      type: object
      required: [attempt_id, report_seq, result_hash, result]
      additionalProperties: false
      properties:
        attempt_id: {$ref: '#/components/schemas/ID'}
        report_seq: {type: integer, minimum: 1}
        result_hash: {type: string, pattern: '^[a-f0-9]{64}$', description: 'SHA256 of canonical UTF-8 JSON {report_seq,result}: keys sorted, no whitespace, unescaped Unicode; strings use JSON control escapes, numbers are integers. Persist and resend the original packet.'}
        result: {$ref: '#/components/schemas/Result'}
    Result:
      type: object
      required: [status, evidence]
      additionalProperties: false
      properties:
        status: {type: string, enum: [reviewing, uncertain, failed]}
        platform_work_id: {type: string, maxLength: 255}
        work_url: {type: string, maxLength: 2048}
        error_code: {type: string, maxLength: 64}
        error_message: {type: string, maxLength: 1000}
        evidence:
          type: object
          additionalProperties: false
          properties:
            platform_uid: {type: string, maxLength: 255}
            bit_profile_id: {type: string, maxLength: 255}
            video_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            portrait_cover_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            cover_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            receipt_id: {type: string, maxLength: 255}
            not_submitted: {type: boolean}
            scene_closed: {type: boolean}
    Claim:
      type: object
      required: [task, attempt, replayed]
      properties:
        task: {type: object, description: 'Formal task with decimal-string IDs; ownership and fixed content.'}
        attempt: {type: object, description: 'Attempt with frozen input, owner, Cloud/BitBrowser Profile IDs and file sizes/digests; no grants or secrets.'}
        replayed: {type: boolean}
        execution_group_no: {type: [integer, 'null'], minimum: 1, description: Fixed batch execution group assigned at claim. Null for a standalone task.}
        effective_capacity: {$ref: '#/components/schemas/ExecutionCapacity'}
        files: {type: object, description: 'video, cover (16:9), and portrait_cover (3:4) short-lived single-object grants, each {url,size,sha256}; never persist. Omitted on replay of finished/lost work.'}
    ExecutionFeedback:
      type: object
      required: [task_status, attempt_status, attempt_id, report_seq, stop_requested, allow_submit, scene_parked]
      properties:
        task_status: {$ref: '../../cloud-api/v1/publication.openapi.yaml#/components/schemas/TaskStatus'}
        attempt_status: {type: string, enum: [running, awaiting_human, completed, interrupted]}
        attempt_id: {$ref: '#/components/schemas/ID'}
        report_seq: {type: integer, minimum: 0}
        stop_requested: {type: boolean}
        stop_reason: {type: string}
        allow_submit: {type: boolean}
        result_hash: {type: [string, 'null']}
        scene_parked: {type: boolean, description: True only while Cloud records the original scene as reliably parked with no automatic slot. Successful parking and exact replay return this explicit flag. A client must treat a missing legacy flag as unconfirmed.}
    Success:
      type: object
      required: [errcode, message, data, logid]
      properties:
        errcode: {type: integer, const: 0}
        message: {type: string}
        logid: {type: string}
    FeedbackEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Success'}
        - properties:
            data: {$ref: '#/components/schemas/ExecutionFeedback'}
    Envelope:
      allOf:
        - {$ref: '#/components/schemas/Success'}
        - properties:
            data: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/Claim'}]}
