openapi: 3.1.0
info:
  title: WT Media Local Agent Runtime Binding API
  version: 2026.10.01.1
  description: |
    Binding and presence for Local Agent nodes (contract v2). The node is the
    execution-presence layer: it binds by `device_id` and its credential is
    valid while the device is bound and the node is online (the device's current
    registration, not superseded). Login sessions form the separate
    identity layer: session invalidation (logout, replacement, expiry) does not
    revoke a node credential — only unbinding the device or a superseding
    registration for the same device does. Registration remains session-gated
    through the one-use binding ticket.
paths:
  /api/v1/local-agent/device-binding:
    get:
      operationId: getMyDeviceBinding
      summary: Read the current user's durable Desktop device binding.
      responses:
        "200":
          description: Device binding status, without public key or credentials.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceBindingEnvelope"}
        "401": {description: Active user session required.}
    delete:
      operationId: unbindMyDevice
      summary: Explicitly revoke the bound device and all of its local nodes.
      responses:
        "204": {description: Device unbound; local files remain on the old computer.}
        "401": {description: Active user session required.}
        "409": {description: No device is currently bound.}
  /api/v1/local-agent/binding-tickets:
    post:
      operationId: createLocalAgentBindingTicket
      summary: Mint a short-lived one-use ticket from the active user session.
      responses:
        "201":
          description: One-use ticket. The raw token is returned only in this response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BindingTicketEnvelope"}
        "401": {description: Active user session required.}
  /api/v1/local-agent/nodes/register:
    post:
      operationId: registerBoundLocalAgentNode
      summary: Consume a binding ticket and issue a node credential once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterLocalNode"}
      responses:
        "201":
          description: Bound node and one-time node credential response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationEnvelope"}
        "401": {description: Ticket or bound session invalid.}
        "409": {description: Agent contract incompatible.}
  /api/v1/local-agent/nodes/{node_id}/runtime-report:
    post:
      operationId: reportLocalAgentRuntime
      security: [{nodeBearer: []}]
      parameters:
        - in: path
          name: node_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuntimeReport"}
      responses:
        "200": {description: Runtime report accepted.}
        "401": {description: Node credential invalid (device unbound or node superseded).}
        "409": {description: Profile main account or assigned Profile mismatch.}
components:
  securitySchemes:
    nodeBearer:
      type: http
      scheme: bearer
  schemas:
    BindingTicketEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [ticket_id, binding_token, expires_at]
          properties:
            ticket_id: {type: string}
            binding_token: {type: string, description: Returned once and never persisted in plaintext.}
            expires_at: {type: string, format: date-time}
    RegisterLocalNode:
      type: object
      required: [binding_token, agent_id, device_id, device_public_key, device_signature, bind_device, agent_version, contract_major_version, contract_revision]
      properties:
        binding_token: {type: string, writeOnly: true}
        agent_id: {type: string}
        device_id: {type: string}
        device_public_key: {type: string, description: Base64url Ed25519 public key; SHA-256 hex fingerprint equals device_id.}
        device_signature: {type: string, writeOnly: true, description: Base64url signature over "wt-media-device-v1\n" + binding_token + "\n" + device_id.}
        device_name: {type: string, maxLength: 64}
        bind_device: {type: boolean, description: True only after explicit user action to enroll an unbound device; false for automatic renewal.}
        agent_version: {type: string}
        contract_major_version: {type: string, const: v1}
        contract_revision: {type: string}
      additionalProperties: false
    DeviceBindingEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [bound, bit_account_bound]
          properties:
            bound: {type: boolean}
            device_id: {type: string}
            device_name: {type: string}
            bound_at: {type: string, format: date-time}
            last_verified_at: {type: string, format: date-time}
            bit_account_bound: {type: boolean}
            bit_main_user_id_masked: {type: string}
    RegistrationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [node, node_credential]
          properties:
            node:
              type: object
              required: [id, agent_id, device_id, user_id, mode, agent_version, contract_major_version, contract_revision, status, registered_at, last_heartbeat_at]
              properties:
                id: {type: string}
                agent_id: {type: string}
                device_id: {type: string}
                user_id: {type: integer, format: int64}
                mode: {type: string, const: local}
                agent_version: {type: string}
                contract_major_version: {type: string}
                contract_revision: {type: string}
                status: {type: string, enum: [online, draining, replaced]}
                registered_at: {type: string, format: date-time}
                last_heartbeat_at: {type: string, format: date-time}
              additionalProperties: false
            node_credential: {type: string, description: Returned once and never persisted in plaintext.}
    RuntimeReport:
      type: object
      required: [operating_system, cpu_architecture, agent_version, python_version, ffmpeg, workdir_status, disk, bitbrowser_status]
      properties:
        operating_system: {type: string, enum: [macos, windows, linux, unsupported]}
        cpu_architecture: {type: string, enum: [x86_64, arm64, unsupported]}
        agent_version: {type: string}
        python_version: {type: string}
        ffmpeg: {$ref: "#/components/schemas/DependencyFact"}
        workdir_status: {$ref: "#/components/schemas/RuntimeStatus"}
        disk:
          type: object
          required: [status, free_megabytes]
          properties:
            status: {$ref: "#/components/schemas/RuntimeStatus"}
            free_megabytes: {type: integer, minimum: 0}
          additionalProperties: false
        bitbrowser_status: {type: string, enum: [normal, unreachable, identity_unverifiable, not_installed, needs_upgrade, user_action_required]}
        main_user_id: {type: string, description: Normalized from BitBrowser mainUserId when bitbrowser_status is normal.}
        bit_profile_ids:
          type: array
          uniqueItems: true
          items: {type: string}
      additionalProperties: false
    DependencyFact:
      type: object
      required: [status]
      properties:
        status: {$ref: "#/components/schemas/RuntimeStatus"}
        version: {type: string}
      additionalProperties: false
    RuntimeStatus:
      type: string
      enum: [normal, abnormal, not_installed, needs_upgrade, unreachable, user_action_required]
