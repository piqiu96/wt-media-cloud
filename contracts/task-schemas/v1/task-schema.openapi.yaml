openapi: 3.1.0
info:
  title: WT Media Universal Task Schema
  version: 2026.10.23.1
  description: >
    The formal shape of one asynchronous task. A task belongs to a user, not to a
    machine: there is no device, node or desktop field, and no state that tracks which
    computer is running it. Each claim produces an `attempt_id`; `last_report_at` is
    maintained by the Agent task runtime and read by the Cloud timeout scanner.
    The HTTP routes that create, claim, report on and settle tasks are in
    `cloud-agent-api/v1/task-lease.openapi.yaml` and `task-report.openapi.yaml`.
paths: {}
components:
  schemas:
    TaskStatus:
      type: string
      enum:
        - pending
        - leased
        - running
        - succeeded
        - failed
        - cancelled
      description: >
        pending → leased → running → succeeded
                    running → failed
                    leased → pending (lease expired, claimed again)
                    (any non-terminal) → cancelled

    TaskType:
      type: string
      enum:
        - noop_task
        - cookie_read_task
        - cookie_write_task
        - account_check_task
        - profile_create_task
        - profile_open_task
        - profile_close_task
        - profile_update_task
        - proxy_check_task
        - proxy_mutation_task
      description: >
        Registered task types. An unknown or empty type is refused with
        UNSUPPORTED_TASK_TYPE; it is never downgraded to `noop_task`.

    TaskStatusSettledBy:
      type: string
      enum: [agent, timeout, user, legacy]
      description: >
        Who wrote the terminal state: the executor (`agent`), the timeout scanner
        (`timeout`), the user cancelling (`user`), or the migration of a row that
        predates the runtime (`legacy`).

    Task:
      type: object
      required: [task_id, task_type, status, attempt, created_at]
      properties:
        task_id: {type: string, description: 'e.g. "task_a1b2c3d4".'}
        task_type: {$ref: '#/components/schemas/TaskType'}
        status: {$ref: '#/components/schemas/TaskStatus'}
        user_id:
          type: integer
          format: int64
          description: Owner. Omitted only for historical rows created before tasks were user-scoped.
        attempt:
          type: integer
          description: Increments on every claim. `0` before the first claim.
        attempt_id:
          type: string
          description: >
            Identifies the current claim. Every report must carry it; a report whose
            id differs from this one is STALE_ATTEMPT.
        idempotency_key:
          type: string
          description: Unique per user on `(user_id, idempotency_key)`.
        agent_id:
          type: string
          description: Audit label of the process that claimed the task. Not an identity and not used for authorization.
        created_at: {type: string, format: date-time}
        started_at:
          type: string
          format: date-time
          description: Set by the first `running` report, not by the claim.
        last_report_at:
          type: string
          format: date-time
          description: Refreshed by running reports and by activity. The timeout scanner compares it with now - execution_timeout_seconds.
        finished_at: {type: string, format: date-time}
        lease_expires_at:
          type: string
          format: date-time
          description: A `leased` task past this moment may be claimed again by the same user.
        progress: {type: integer, minimum: 0, maximum: 100}
        message: {type: string}
        updated_at: {type: string, format: date-time}
        error_code:
          type: string
          description: Set when failed. For timeout settlements this is EXECUTION_INTERRUPTED or RESULT_UNKNOWN.
        error_message: {type: string}
        execution_timeout_seconds:
          type: integer
          description: Silent-execution budget for this type, fixed at creation.
        external_side_effect:
          type: boolean
          description: >
            True when a run can change state outside Cloud. A time-out of such a task
            is RESULT_UNKNOWN and cannot be retried without explicit confirmation.
        retryable: {type: boolean}
        recovery_action:
          type: string
          description: 'e.g. retry, check_platform_state.'
        settled_by: {$ref: '#/components/schemas/TaskStatusSettledBy'}
        payload:
          type: object
          description: Task input. Secrets are redacted before the task leaves Cloud.
        result:
          type: object
          description: Terminal payload, projected once for succeeded tasks.

    TaskTypeDefaults:
      type: object
      description: |
        Timeout and side-effect defaults written when a task of each type is created.
        A type without a row takes 300 seconds and no external side effect.

        | task_type | execution_timeout_seconds | external_side_effect |
        | --- | ---: | --- |
        | noop_task | 300 | false |
        | cookie_read_task | 300 | false |
        | cookie_write_task | 300 | true |
        | account_check_task | 300 | false |
        | profile_create_task | 300 | true |
        | profile_open_task | 120 | false |
        | profile_close_task | 120 | false |
        | profile_update_task | 300 | true |
        | proxy_check_task | 300 | false |
        | proxy_mutation_task | 300 | true |
      additionalProperties:
        $ref: '#/components/schemas/TaskTypeSpec'
    TaskTypeSpec:
      type: object
      required: [execution_timeout_seconds, external_side_effect]
      additionalProperties: false
      properties:
        execution_timeout_seconds: {type: integer, minimum: 1}
        external_side_effect: {type: boolean}
