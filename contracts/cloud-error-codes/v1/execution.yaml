schema_version: 1
revision: "2026.10.23.1"
# Admission and execution codes. `code` is what the client branches on; the same
# `{code, message, retryable, recovery_action}` shape appears in an HTTP error envelope
# (preflight) and in a task's terminal result fields (timeout settlement).
errors:
  # The action or task type the caller named is not registered. Never downgraded to a no-op.
  unsupported_task_type: {http_status: 400, code: 10002, retryable: false, recovery_action: none}
  # A report carried an attempt_id that is not the task's current one; nothing was written.
  stale_attempt: {http_status: 409, code: 30009, retryable: false, recovery_action: none}
  # Retrying a task whose last attempt may have changed external state requires explicit
  # confirmation (`confirm_result_unknown=true`).
  result_unknown: {http_status: 409, code: 30010, retryable: false, recovery_action: check_platform_state}
  task_not_found: {http_status: 404, code: 20004}
  no_pending_task: {http_status: 409, code: 30001}
  task_already_terminal: {http_status: 409, code: 30003}
  task_not_retryable: {http_status: 409, code: 30007}
  invalid_task_request: {http_status: 400, code: 10001}
  task_store_error: {http_status: 500}

# A task settled by the timeout scanner (settled_by=timeout), not an HTTP response.
timeout_results:
  execution_interrupted:
    retryable: true
    recovery_action: retry
    external_side_effect: false
    description: No external effect is possible; the user may run it again.
  result_unknown:
    retryable: false
    recovery_action: check_platform_state
    external_side_effect: true
    description: The run may have changed external state; check the platform before retrying.
