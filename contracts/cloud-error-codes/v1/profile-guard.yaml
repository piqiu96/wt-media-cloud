schema_version: 1
revision: "2026.10.23.1"
# Sensitive Profile permits are a per-Profile mutex, not a credential: the Agent Token
# authenticates, the permit id only says which held slot is being renewed or released.
errors:
  invalid_sensitive_preflight: {http_status: 400, code: 10001}
  sensitive_task_not_found: {http_status: 404, code: 20004}
  sensitive_task_assignment_mismatch: {http_status: 403, code: 11003}
  # 23003: the permit is no longer held, has expired, or belongs to another user's task.
  # Carried in `error.type`, without a code/recovery_action.
  profile_permit_invalid: {http_status: 409, code: 23003}
  # 23003: a referenced Profile cannot be operated on right now.
  profile_runtime_unavailable: {http_status: 409, code: 23003}
  profile_guard_store_error: {http_status: 500}
