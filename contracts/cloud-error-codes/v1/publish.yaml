  publication_batch_unresolved: {errcode: 18010, http_status: 409, retryable: false, message: Unresolved tasks or a changed failure set prevent finish.}
  publication_capacity_wait: {errcode: 18011, http_status: 409, retryable: true, message: Original-scene continuation must wait for capacity.}
