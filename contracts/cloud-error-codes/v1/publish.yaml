  publication_not_found: {errcode: 18002, http_status: 404, retryable: false, message: Missing or inaccessible publication resource or batch.}
  publication_conflict: {errcode: 18003, http_status: 409, retryable: false, message: Request input, edit eligibility or revision changed; reload before editing.}
  publication_output_occupied: {errcode: 18004, http_status: 409, retryable: false, message: Output already occupied on this platform.}
  publication_platform_closed: {errcode: 18005, http_status: 409, retryable: false, message: Requested platform is not supported.}
